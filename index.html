window.__PENDING_UNITS.push({"id":"s2-u2","readyNo":2,"data":{"WORDS":[{"w":"assistant","pos":"n.","zh":"助理","lv":"","eg":"My assistant will now demonstrate the machine in action.","egZh":"现在我的助手将演示机器运转情况。"},{"w":"colleague","pos":"n.","zh":"同事","lv":"","eg":"We were friends and colleagues for more than 20 years.","egZh":"20多年来我们既是朋友又是同事。"},{"w":"custodian","pos":"n.","zh":"看门人，看守人","lv":"","eg":"The nice man works as the school's custodian.","egZh":"这位和善的男子是学校的管理员。"},{"w":"entry","pos":"n.","zh":"进入权，进入","lv":"","eg":"Entry to the museum is free.","egZh":"这座博物馆免费参观。"},{"w":"interview","pos":"n.","zh":"面试，面谈","lv":"","eg":"He has an interview next week for the manager's job.","egZh":"他下周要接受一个经理职位的面试。"},{"w":"perk","pos":"n.","zh":"额外待遇，津贴","lv":"","eg":"Perks offered by the firm include a car and free health insurance.","egZh":"公司给予的额外待遇包括一辆汽车和免费健康保险。"},{"w":"receptionist","pos":"n.","zh":"接待员","lv":"","eg":"She is a receptionist in a clinic.","egZh":"她在一家诊所做接待员。"},{"w":"suit","pos":"v.","zh":"适合，中……的意","lv":"","eg":"It suits me to start work at a later time.","egZh":"对我来说，最好晚一点再开始工作。"},{"w":"admit","pos":"v.","zh":"承认","lv":"","eg":"Did he admit breaking the window?","egZh":"他承认了窗子是他打破的吗？"},{"w":"advisor","pos":"n.","zh":"顾问","lv":"","eg":"He integrated his advisor's suggestions into his plan.","egZh":"他把顾问的若干建议纳入了计划。"},{"w":"ambitious","pos":"adj.","zh":"有抱负的；有野心的","lv":"","eg":"The ambitious young man used his friends to further his career.","egZh":"这位野心勃勃的年轻人利用朋友来推动他事业的发展。"},{"w":"candidate","pos":"n.","zh":"求职者；候选人","lv":"","eg":"I consider that he is the best candidate.","egZh":"我认为他是最合适的候选人。"},{"w":"comment","pos":"v.&n.","zh":"评论；发表意见","lv":"","eg":"It created wide comment in the press.","egZh":"这引起报界广泛的评论。"},{"w":"document","pos":"n.","zh":"文件；公文","lv":"","eg":"He made changes, and then put the document away.","egZh":"他做出修改，接着放好了文档。"},{"w":"impact","pos":"n.","zh":"影响；作用","lv":"","eg":"We need to assess the impact on climate change.","egZh":"我们需要评估对气候变化的影响。"},{"w":"offer","pos":"v.&n.","zh":"提供","lv":"","eg":"Some software offers more support to new users.","egZh":"有一些软件为新手用户提供更多的支持和帮助。"},{"w":"organized","pos":"adj.","zh":"有条理的","lv":"","eg":"These people are very efficient and very organized.","egZh":"这些人做事效率很高而且井井有条。"},{"w":"performance","pos":"n.","zh":"表现；表演","lv":"","eg":"Her performance gripped the audience.","egZh":"她的表演深深地吸引了观众。"},{"w":"realistic","pos":"adj.","zh":"现实的","lv":"","eg":"Stop daydreaming and be realistic.","egZh":"别空想了，还是现实点吧。"},{"w":"responsibility","pos":"n.","zh":"责任；职责","lv":"","eg":"The error may not be your fault, but it's your responsibility.","egZh":"错误可能不是你犯的，但是有你的责任。"},{"w":"weakness","pos":"n.","zh":"弱点","lv":"","eg":"He is consciously trying to overcome his weakness.","egZh":"他有意识地在克服自己的缺点。"},{"w":"workplace","pos":"n.","zh":"工作场所","lv":"","eg":"Computers have brought about many changes in the workplace.","egZh":"计算机给工作场所带来了许多变化。"},{"w":"have a negative impact on","pos":"phrase","zh":"对……产生不良影响","lv":"","eg":"Does the work have a negative impact on your health?","egZh":"这份工作对你的健康造成了不良影响吗？"}],"GLOSS":{"candidate":{"w":"candidate","pos":"n.","zh":"求职者；候选人","def":"a person who applies for a job or is nominated for election","eg":"I consider that he is the best candidate.","egZh":"我认为他是最合适的候选人。","src":"Reading · Words & Expressions"},"advisor":{"w":"advisor","pos":"n.","zh":"顾问","def":"a person who gives advice","eg":"He integrated his advisor's suggestions into his plan.","egZh":"他把顾问的若干建议纳入了计划。","src":"Reading · Words & Expressions"},"weakness":{"w":"weakness","pos":"n.","zh":"弱点；缺点","def":"a fault or weak point","eg":"He is consciously trying to overcome his weakness.","egZh":"他有意识地在克服自己的缺点。","src":"Reading · Words & Expressions"},"impact":{"w":"negative impact","pos":"phrase","zh":"不良影响","def":"a bad effect on something","eg":"Does the work have a negative impact on your health?","egZh":"这份工作对你的健康造成了不良影响吗？","src":"Reading · Words & Expressions"},"ambitious":{"w":"ambitious","pos":"adj.","zh":"有抱负的；有野心的","def":"having a strong desire to succeed","eg":"The ambitious young man used his friends to further his career.","egZh":"这位野心勃勃的年轻人利用朋友来推动他的事业发展。","src":"Reading · Words & Expressions"},"responsibility":{"w":"responsibility","pos":"n.","zh":"责任；职责","def":"a duty to deal with something","eg":"The error may not be your fault, but it's your responsibility.","egZh":"错误可能不是你犯的，但是有你的责任。","src":"Reading · Words & Expressions"},"realistic":{"w":"realistic","pos":"adj.","zh":"现实的","def":"accepting things as they are","eg":"Stop daydreaming and be realistic.","egZh":"别空想了，还是现实点吧。","src":"Reading · Words & Expressions"},"workplace":{"w":"workplace","pos":"n.","zh":"工作场所","def":"a place where people work","eg":"What can she bring to her workplace?","egZh":"那她能给工作带来什么呢？","src":"Reading · Words & Expressions"},"impression":{"w":"impression","pos":"n.","zh":"印象","def":"an idea or feeling about someone","eg":"making the best possible impression on your interviewer","egZh":"给面试官留下尽可能好的印象","src":"Reading · Passage"},"interviewer":{"w":"interviewer","pos":"n.","zh":"面试官","def":"the person who conducts a job interview","eg":"making the best possible impression on your interviewer","egZh":"给面试官留下尽可能好的印象","src":"Reading · Passage"},"ln1":{"isNote":true,"w":"段③ 长句 · enable ... to ...","sent":"Thinking about what you're going to say beforehand will enable you to sound realistic and honest, while making the best possible impression on your interviewer.","zh":"在面试前想好自己要说什么，这会让你听起来真实又真诚，进而给面试官留下尽可能好的印象。","def":"enable sb. to do sth. 意为“使某人能够做某事”；while 引导的现在分词短语作伴随状语。","points":["enable","impression"],"src":"Reading · Language notes"}},"PASSAGE":[{"no":"①","text":"Make or break? Hostess: Welcome! Tonight, we're following three [[candidate|candidates]] on their search for a job. Will they make it or break it? Our career [[advisor|advisor]], Mr. Smart, is here to comment on our candidates' performance. Let's begin with how to skillfully answer difficult job interview questions. Q1: What's your greatest weakness? Candidate A: Frankly speaking, I'm not very organized. Several times, I've lost important documents. Mr. Smart: Oh dear! This candidate is honest, but this is not a [[weakness|weakness]] you should admit to in an interview. Try to think of [[weakness|weaknesses]] which can't have a [[impact|negative impact]] on your work."},{"no":"②","text":"Q2: Why do you want this job? Candidate B: Well, the salary is great and you offer a company car. Mr. Smart: Another honest response. But unfortunately, this candidate is not saying anything about what she can offer the company—it's all take, take, take! What can she bring to her [[workplace|workplace]]? Q3: Where do you see yourself in five years' time? Candidate C: After five years of hard work, I'd like to have more responsibilities. Mr. Smart: This is a good response. The candidate is [[ambitious|ambitious]], but she doesn't say she wants the boss' job (even if she does!). Show you have some kind of plan for the future by thinking about [[realistic|realistic]] goals before the interview."},{"no":"③","text":"Hostess: Interesting! So, from the candidates' responses we can see the importance of careful preparation before a job interview. Thinking about what you're going to say beforehand will enable you to sound [[realistic|realistic]] and honest, while making the best possible [[impression|impression]] on your [[interviewer|interviewer]]. [[ln1|Thinking about what you're going to say beforehand will enable you to sound realistic and honest, while making the best possible impression on your interviewer.]] Stay with us till after the ads, when Mr. Smart will be giving advice on how to dress for success at a job interview!"}],"PASSAGE_ZH":[{"no":"①","text":"女主持：欢迎各位！今晚，我们将关注三位求职者的求职过程。他们会成功还是失败呢？我们的职业咨询顾问斯马特先生将会在这里对求职者的表现作出评价。首先让我们来看一下如何巧妙地回答高难度的求职面试问题。问题1：你最大的缺点是什么？求职者A：老实说，我不太有条理。有几次我把重要的文件弄丢了。斯马特先生：哦，天啊！这位求职者很诚实，但这不是你应该在面试中承认的缺点。试着想想对你的工作不会有负面影响的缺点。"},{"no":"②","text":"问题2：你为什么想要这份工作？求职者B：嗯，工资很高，而且您能提供公司用车。斯马特先生：又一个诚实的回答。但不幸的是，这位求职者并没有说她能为公司做些什么——全都是获得、获得、获得！那她能给工作带来什么呢？问题3：你认为五年后你会变成什么样子？求职者C：我希望在努力工作五年后，自己能够承担更多的责任。斯马特先生：这个回答很好。求职者很有雄心，但是她没有说她想要老板的工作（即使她确实是这么想的！）。面试前要考虑现实的目标，以表明你对未来有一定的计划。"},{"no":"③","text":"女主持：太有趣了！那么，通过这些求职者的回答，我们可以发现面试前认真准备是很重要的。在面试前想好自己要说什么，这会让你听起来真实又真诚，进而给面试官留下尽可能好的印象。不要走开，广告过后，斯马特先生将会为大家提供面试时穿着得体的建议！"}],"READING_QS":[{"q":"According to Mr. Smart, which weakness is acceptable to mention in an interview?","o":["Being disorganized","A weakness that won't negatively impact your work","Losing important documents"],"a":1,"y":"出处 Slide 19-22：Mr. Smart 建议想一些对工作没有负面影响的缺点。"},{"q":"What does Mr. Smart think of Candidate B's answer to \"Why do you want this job\"?","o":["She showed her value to the company","She only talked about what she could get","It was a perfect answer"],"a":1,"y":"出处 Slide 20：斯马特指出该求职者只说能获得什么，未提及能给公司带来什么。"},{"q":"What advice does Mr. Smart give for the question about the future?","o":["Say you want the boss's job","Think about realistic goals before the interview","Avoid planning ahead"],"a":1,"y":"出处 Slide 20/23：面试前考虑现实目标以表明对未来有计划。"},{"q":"Which of the following is NOT advised by Mr. Smart?","o":["Think about how you can help the company","Prepare realistic future plans","Tell the interviewer you want his/her job"],"a":2,"y":"出处 Slide 26：明确不应说想要老板的工作。"}],"PATTERNS":[{"fn":"01 · 表达求职意向","frame":"I'd like this job because I'm interested in fashion.","ex":"I'd like this job because I'm interested in fashion.","zh":"表达你想得到这份工作的原因。"},{"fn":"02 · 说明工作经验","frame":"I have __ months' / years' experience of managing a shop.","ex":"I have three years' experience of managing a shop.","zh":"说明自己在某方面的经验年数。"},{"fn":"03 · 表达职业追求","frame":"I'm looking for new challenges.","ex":"I'm looking for new challenges.","zh":"表达希望迎接新挑战。"},{"fn":"04 · 描述个人品质","frame":"I'm punctual / a good team player / reliable.","ex":"I'm a good team player.","zh":"描述自己的优点与职业素养。"},{"fn":"05 · 说明技能","frame":"I have good customer care skills.","ex":"I have good customer care skills.","zh":"说明自己具备客户服务技能。"},{"fn":"06 · 询问面试准备","frame":"Have you spent time preparing?","ex":"Have you spent time preparing?","zh":"询问对方是否已为面试做准备。"},{"fn":"07 · 询问如何着手","frame":"How do I go about researching?","ex":"How do I go about researching?","zh":"询问如何着手做某事（如了解公司）。"},{"fn":"08 · 感谢与祝愿","frame":"Thanks for the tip. Good luck!","ex":"Thanks for the tip, Marina. Good luck, Nick!","zh":"对话中常用以感谢建议并送上祝福。"}],"CHAT_TIPS":["听对话时注意说话人的语气与情绪（如 Nick 的紧张、Marina 的鼓励）。","填空前先通读整段对话，预测可能填入的词性与词义。","注意固定搭配，如 go about doing sth.（着手做某事）、all you can about the company（尽可能多地了解公司）。","听完后可对照 Script 与参考译文核对，注意 résumé、mechanic、post 等职场词汇。","练习中可模仿 Vivian 的回答思路：介绍经验、表达品质、举例说明团队合作。"],"PRIDE_PASSAGE":[{"no":"①","text":"Three visits to the cottage. In the late Eastern Han Dynasty, Zhuge Liang lived completely alone in a thatched cottage in Longzhong. Xu Shu, an adviser to Liu Bei, recommended Zhuge Liang as a rare talent. In order to get Zhuge Liang's help, Liu Bei went to Zhuge's cottage. Unfortunately, Zhuge Liang was not at home that day, so Liu Bei gave his visiting card to Zhuge's servant and went away. Later, on a snowy and windy day, Liu visited the cottage for a second time. Once again, Zhuge was not at home."},{"no":"②","text":"Liu decided to visit Zhuge for a third time. This time, Zhuge was at home, but he was sleeping when Liu arrived. Liu stood outside of the house, waiting quietly for hours. When Zhuge woke up, he was greatly moved by Liu's sincerity. He agreed to serve as Liu's military counselor."},{"no":"③","text":"Liu admired Zhuge's ideas on how to confront other military forces at that time, as well as his insights into how to run a state. With Zhuge's help, Liu enlarged his territory and later established the State of Shu. Liu was grateful for Zhuge's help. He told Guan Yu and Zhang Fei, \"With Zhuge Liang's assistance, I feel just like a fish in water.\""}],"PRIDE_ZH":[{"no":"①","text":"三顾茅庐。东汉末年，诸葛亮独自一人居住在隆中的一间茅草屋里。谋士徐庶向刘备推荐说：诸葛亮是个奇才。为了得到诸葛亮的帮助，刘备便去了他的茅草屋。不巧的是，诸葛亮那天不在家，刘备只好给诸葛亮的仆人留下拜帖，然后离开了。过了几天，刘备又冒着风雪前去。哪知诸葛亮又不在家。"},{"no":"②","text":"刘备决定第三次去拜访诸葛亮。这次，诸葛亮在家，但刘备到的时候他正在睡觉。刘备站在屋外，静静地等了几个小时。诸葛亮醒来后，被刘备的真诚所打动，答应出山相助，成为刘备的军师。"},{"no":"③","text":"刘备十分欣赏诸葛亮对如何对抗当时其他军事势力的想法以及他对治理国家的见解。在诸葛亮的帮助下，刘备扩大了自己的领土，后来建立了蜀国。刘备对诸葛亮的帮助心怀感激。他对关羽、张飞说：“我之有孔明，犹鱼之有水也！”"}],"PRIDE_CULTURE":"“三顾茅庐”是中国历史上求贤若渴的著名典故，出自《三国演义》，体现了中国传统文化中“礼贤下士”与对人才的高度尊重。刘备三访诸葛亮，展现了诚意与谦逊，也成为后世形容真心诚意、一再邀请贤才的成语。这一故事与求职面试主题呼应：求职者需要展现真诚与充分准备，而雇主也应尊重人才。","PRIDE_QS":[{"q":"What can the story of \"Three Visits to the Cottage\" teach us about succeeding in our careers?","o":["Only talent matters","Sincerity and persistence help win trust and support","Avoid meeting people in person"],"a":1,"y":"出处 Slide 71：故事启示求职者真诚与坚持的重要性。"},{"q":"How did Liu Bei show his sincerity to Zhuge Liang?","o":["He sent a gift instead","He visited three times and waited quietly for hours","He wrote a letter"],"a":1,"y":"出处 Slides 68-69：刘备三顾茅庐并静候数小时。"},{"q":"What does \"like a fish in water\" mean in Liu Bei's words?","o":["He felt uncomfortable","Zhuge's help made him feel perfectly suited and supported","He wanted to leave"],"a":1,"y":"出处 Slide 70：比喻得到得力助手后如鱼得水。"}],"PRIDE_CET4":[{"w":"cottage","pos":"n.","zh":"小屋；村舍","eg":"Zhuge Liang lived in a thatched cottage in Longzhong."},{"w":"adviser","pos":"n.","zh":"顾问；谋士","eg":"Xu Shu, an adviser to Liu Bei, recommended Zhuge Liang."},{"w":"recommend","pos":"v.","zh":"推荐；建议","eg":"He recommended Zhuge Liang as a rare talent."},{"w":"sincerity","pos":"n.","zh":"真诚；诚意","eg":"Zhuge was moved by Liu's sincerity."},{"w":"territory","pos":"n.","zh":"领土；领地","eg":"Liu enlarged his territory."},{"w":"establish","pos":"v.","zh":"建立；创立","eg":"later established the State of Shu"},{"w":"grateful","pos":"adj.","zh":"感激的；感谢的","eg":"Liu was grateful for Zhuge's help."},{"w":"assistance","pos":"n.","zh":"帮助；援助","eg":"With Zhuge Liang's assistance, I feel like a fish in water."}],"PRIDE_PHRASES":[{"p":"thatched cottage","zh":"茅草屋","eg":"Zhuge Liang lived in a thatched cottage."},{"p":"rare talent","zh":"奇才","eg":"recommended Zhuge Liang as a rare talent"},{"p":"visiting card","zh":"拜帖；名帖","eg":"Liu Bei gave his visiting card to the servant"},{"p":"military counselor","zh":"军师；军事顾问","eg":"He agreed to serve as Liu's military counselor."},{"p":"a fish in water","zh":"如鱼得水","eg":"I feel just like a fish in water."}],"PRIDE_PATTERNS":[{"t":"describe sequential events","frame":"First... Later... Once again...","eg":"Later, on a snowy day, Liu visited for a second time. Once again, Zhuge was not at home.","zh":"用时间副词描述事件的先后顺序。"},{"t":"express being moved","frame":"be moved by ...","eg":"He was greatly moved by Liu's sincerity.","zh":"表达“被……打动”。"},{"t":"metaphor: like a fish in water","frame":"feel just like a fish in water","eg":"With Zhuge Liang's assistance, I feel just like a fish in water.","zh":"比喻得到得力助手后自在如意。"}],"GAP_ANSWERS":{"vf":["part-time","receptionist","colleagues","perks","assistant"],"chatting":["an interview tomorrow","the post of mechanic","spent time preparing","all you can about the company","check their website"]},"QUESTIONS":{"vf":[{"q":"Where does Andrew work?","opts":["At a school","At the new sports center in town","At a hospital"],"a":1,"why":"出处 Slide 8：Andrew 在镇上新开的体育中心做兼职接待员。"},{"q":"What perk does Andrew get?","opts":["Free meals","Free entry to the gym and swimming pool","A company car"],"a":1,"why":"出处 Slide 8：可免费使用健身房和游泳池。"},{"q":"What will Alisa do next week?","opts":["Start a full-time job","Have an interview for a part-time sales assistant job","Visit Andrew at work"],"a":1,"why":"出处 Slide 8：Alisa 下周有兼职销售助理的面试。"}],"chatting":[{"q":"What job is Nick interviewing for?","opts":["A teacher","The post of mechanic at a garage","A sales assistant"],"a":1,"why":"出处 Slide 59：修车厂的机械师职位。"},{"q":"What did Nick prepare for the interview?","opts":["His résumé and a suit","A gift","Nothing"],"a":0,"why":"出处 Slide 59：准备了简历并买了西装。"},{"q":"What does Marina advise Nick to do first?","opts":["Call the company","Check their website","Buy a new suit"],"a":1,"why":"出处 Slide 59：先查看公司网站了解价值观等。"}]},"SP_GROUPS":[{"group":"Grammar Focus · Adverbs (副词)","cards":[{"no":"1","title":"形容词 + ly","sent":"She is constantly changing her mind.","zh":"她老是改变主意。","items":[{"lb":"constant → constantly","df":"多数形容词直接加 ly","egs":[["constant → constantly","经常地"],["quick → quickly","快速地"]]}],"src":"Grammar Focus · Adverbs"},{"no":"2","title":"以 y 结尾","sent":"Luckily, she was in when I called.","zh":"幸好我打电话时她在家。","items":[{"lb":"y → i + ly","df":"以 y 结尾的形容词，变 y 为 i 再加 ly","egs":[["lucky → luckily","幸运地"],["happy → happily","高兴地"]]}],"src":"Grammar Focus · Adverbs"},{"no":"3","title":"以 le 结尾","sent":"She gently refused to accept the gifts.","zh":"她委婉地拒绝接受那些礼物。","items":[{"lb":"le → ly","df":"去掉 e 再加 y","egs":[["gentle → gently","温柔地"],["simple → simply","简单地"]]}],"src":"Grammar Focus · Adverbs"},{"no":"4","title":"以 ic 结尾","sent":"The process was controlled automatically.","zh":"生产工序是自动控制的。","items":[{"lb":"ic → ically","df":"加 ally","egs":[["automatic → automatically","自动地"],["basic → basically","基本地"]]}],"src":"Grammar Focus · Adverbs"},{"no":"5","title":"不规则副词","sent":"The concert went very well.","zh":"音乐会进行得很顺利。","items":[{"lb":"good → well","df":"少数不规则副词不以 y 结尾","egs":[["good → well","好地"]]}],"src":"Grammar Focus · Adverbs"},{"no":"6","title":"同形副词","sent":"The team worked very hard, and their hard work paid off.","zh":"这个团队工作非常努力，他们的努力也得到了回报。","items":[{"lb":"hard → hard","df":"有些副词与形容词同形","egs":[["hard → hard","努力地"],["fast → fast","快速地"]]}],"src":"Grammar Focus · Adverbs"}]},{"group":"Reading · Language notes (语言解析)","cards":[{"no":"1","title":"Make or break?","sent":"Make or break?","zh":"成功还是失败？","items":[{"lb":"make or break","df":"不成则败；获得极大成功或完全失败","egs":[["a make-or-break investment plan","成败系于一线的投资计划"],["either make or break","成败攸关"]]}],"src":"Reading · 语言解析"},{"no":"2","title":"have an impact on","sent":"Try to think of weaknesses which can't have a negative impact on your work.","zh":"试着想想对你的工作不会有负面影响的缺点。","items":[{"lb":"have an impact on","df":"对……有影响","egs":[["The development of new technology continues to have an impact on learning.","新技术的发展继续影响着学习。"]]},{"lb":"which 定语从句","df":"which 引导定语从句，在从句中作主语","egs":[["weaknesses which can't have a negative impact","不会有负面影响的缺点"]]}],"src":"Reading · 语言解析"},{"no":"3","title":"some kind of","sent":"Show you have some kind of plan for the future by thinking about realistic goals before the interview.","zh":"表明你对未来有一定的计划。","items":[{"lb":"some kind of","df":"某种（与单数名词连用，表示不确定）","egs":[["for some reason","因为某种原因"],["some kind of innate ability","某种与生俱来的能力"]]}],"src":"Reading · 语言解析"}]}]},"content":{"unit":{"title":"Job interviews","zh":"求职面试","book":"New Era English for Careers · 用英语讲中国故事","source":"U2（VR版）_教学课件_202501.pptx"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u2-vocabulary-focus-exC.wav","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["part-time","receptionist","colleagues","perks","assistant"],"gaps":[{"who":"Alisa","html":"Hi, Andrew! Where are you going?"},{"who":"Andrew","html":"Hi, Alisa! I'm just on my way to work."},{"who":"Alisa","html":"Where are you working?"},{"who":"Andrew","html":"I've got a <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\"> job as a <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> at the new sports center in town."},{"who":"Alisa","html":"Great! What are your hours like?"},{"who":"Andrew","html":"I work on Tuesday and Thursday evenings and Saturdays too."},{"who":"Alisa","html":"Ah, so you can fit your work around your studies. That's good."},{"who":"Andrew","html":"Yeah, it suits me really well."},{"who":"Alisa","html":"And what's the work like? Do you enjoy it?"},{"who":"Andrew","html":"Yeah, I do. It's a nice place to work and my <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> are friendly."},{"who":"Alisa","html":"Do you get any <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\">?"},{"who":"Andrew","html":"I get free entry to the gym and to the swimming pool too. What about you? Do you have a part-time job?"},{"who":"Alisa","html":"Actually, I'll have an interview for a part-time job as a sales <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> next week."},{"who":"Andrew","html":"Good luck! Hope it goes really well."}],"script":[["Alisa","Hi, Andrew! Where are you going?"],["Andrew","Hi, Alisa! I'm just on my way to work."],["Alisa","Where are you working?"],["Andrew","I've got a part-time job as a receptionist at the new sports center in town."],["Alisa","Great! What are your hours like?"],["Andrew","I work on Tuesday and Thursday evenings and Saturdays too."],["Alisa","Ah, so you can fit your work around your studies. That's good."],["Andrew","Yeah, it suits me really well."],["Alisa","And what's the work like? Do you enjoy it?"],["Andrew","Yeah, I do. It's a nice place to work and my colleagues are friendly."],["Alisa","Do you get any perks?"],["Andrew","I get free entry to the gym and to the swimming pool too. What about you? Do you have a part-time job?"],["Alisa","Actually, I'll have an interview for a part-time job as a sales assistant next week."],["Andrew","Good luck! Hope it goes really well."]],"translation":[["艾丽萨","嗨，安德鲁！你要去哪里？"],["安德鲁","嗨，艾丽萨！我正准备去上班。"],["艾丽萨","你在哪里工作？"],["安德鲁","我在镇上新开的体育中心做兼职接待员。"],["艾丽萨","真棒！你的工作时间是什么样的？"],["安德鲁","我在周二和周四晚上工作，还有周六。"],["艾丽萨","啊，所以你能把你的工作和学习结合起来。那很好啊。"],["安德鲁","是的，这份工作很适合我。"],["艾丽萨","工作是怎样的呢？你喜欢吗？"],["安德鲁","嗯，我喜欢。工作环境很好，我的同事也很友善。"],["艾丽萨","你有什么福利吗？"],["安德鲁","我可以免费使用健身房和游泳池。你呢？你有兼职工作吗？"],["艾丽萨","其实，我下周有一个兼职销售助理的面试。"],["安德鲁","祝你好运！希望一切都能顺利。"]],"note":"词库：part-time, receptionist, colleagues, perks, assistant。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Make or break?","lead":"阅读一篇关于求职面试的短文，学习如何巧妙回答面试难题。","audio":"assets/audio/s2-u2-reading-passage.mp3","audioLabel":"课文原声 · Make or break?"},"chatting":{"title":"Chatting · Listen and complete the conversation","lead":"听 Nick 与 Marina 的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u2-chatting-listening.mp3","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["an interview tomorrow","the post of mechanic","spent time preparing","all you can about the company","check their website"],"gaps":[{"who":"Nick","html":"Hey, guess what, Marina? I've got <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">."},{"who":"Marina","html":"Well done, Nick. That's brilliant! What's the job?"},{"who":"Nick","html":"It's for <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> at the garage near the college."},{"who":"Marina","html":"Great! How are you feeling about it?"},{"who":"Nick","html":"A bit nervous. This will be my first interview."},{"who":"Marina","html":"I'm sure you'll do well. Have you <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">?"},{"who":"Nick","html":"Well, I prepared my résumé and bought a suit."},{"who":"Marina","html":"That's a good start. Have you done some research?"},{"who":"Nick","html":"Research? What do I need to research?"},{"who":"Marina","html":"Well, you need to find out <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\">."},{"who":"Nick","html":"Why is that important? If I get the job, I'll soon know all about it."},{"who":"Marina","html":"If you do some research, it looks like you're really interested in the job."},{"who":"Nick","html":"OK. How do I go about researching?"},{"who":"Marina","html":"Well, I think you should <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> first. Find out about the company values, that kind of thing."},{"who":"Nick","html":"I'll do that. Thanks for the tip, Marina."},{"who":"Marina","html":"You're welcome. Good luck, Nick! I'm sure you'll be great."}],"script":[["Nick","Hey, guess what, Marina? I've got an interview tomorrow."],["Marina","Well done, Nick. That's brilliant! What's the job?"],["Nick","It's for the post of mechanic at the garage near the college."],["Marina","Great! How are you feeling about it?"],["Nick","A bit nervous. This will be my first interview."],["Marina","I'm sure you'll do well. Have you spent time preparing?"],["Nick","Well, I prepared my résumé and bought a suit."],["Marina","That's a good start. Have you done some research?"],["Nick","Research? What do I need to research?"],["Marina","Well, you need to find out all you can about the company."],["Nick","Why is that important? If I get the job, I'll soon know all about it."],["Marina","If you do some research, it looks like you're really interested in the job."],["Nick","OK. How do I go about researching?"],["Marina","Well, I think you should check their website first. Find out about the company values, that kind of thing."],["Nick","I'll do that. Thanks for the tip, Marina."],["Marina","You're welcome. Good luck, Nick! I'm sure you'll be great."]],"translation":[["尼克","嘿，你猜怎么着，玛丽娜？我明天有一个面试。"],["玛丽娜","干得好，尼克。这太棒了！是什么工作呢？"],["尼克","大学附近修车厂的机械师职位。"],["玛丽娜","太好了！你现在感觉怎么样？"],["尼克","有点紧张。这是我的第一次面试。"],["玛丽娜","我相信你会表现得很好。你花时间准备了吗？"],["尼克","嗯，我准备了个人简历，还买了一套西装。"],["玛丽娜","这是一个好的开始。你做功课了吗？"],["尼克","功课？我需要做什么功课？"],["玛丽娜","嗯，你得找出所有你能找到的关于这家公司的资料。"],["尼克","为什么这很重要？如果我得到这份工作，我很快就会了解它的全部情况。"],["玛丽娜","如果提前做好功课，就能表现出你对这份工作是真的有兴趣。"],["尼克","好的，那我要怎么做呢？"],["玛丽娜","嗯，我觉得你应该先看看他们的网站。了解一下公司的价值观，诸如此类的东西。"],["尼克","我会的。谢谢你的指点，玛丽娜。"],["玛丽娜","不客气。祝你好运，尼克！我敢肯定你一定会成功的。"]],"note":"词库：an interview tomorrow, the post of mechanic, spent time preparing, all you can about the company, check their website。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · Three Visits to the Cottage","lead":"阅读中国典故“三顾茅庐”，了解传统文化中礼贤下士的精神。","audio":"assets/audio/s2-u2-pride-of-china.mp3","audioLabel":"专题原声 · Three Visits to the Cottage","note":"本专题讲述刘备三顾茅庐请诸葛亮出山的故事，与求职面试主题呼应：真诚与准备是成功的关键。"}}});
</script>

window.__PENDING_UNITS.push({"id":"s2-u3","readyNo":3,"data":{"WORDS":[{"w":"internship","pos":"n.","zh":"实习期的工作","lv":"","eg":"And he arranged for her to have a second internship the next summer.","egZh":"他安排她明年夏天进行第二次实习。"},{"w":"shortage","pos":"n.","zh":"缺乏；缺少","lv":"","eg":"A shortage of funds is preventing the UN from monitoring relief.","egZh":"资金短缺使联合国无法督导救援工作。"},{"w":"supplier","pos":"n.","zh":"供应商","lv":"","eg":"I’ll contact the suppliers and see if I can get the paint you want by Friday.","egZh":"我会和供货商联系，看看我能否在周五之前拿到您想要的涂料。"},{"w":"valuable","pos":"adj.","zh":"有价值的；有用的","lv":"","eg":"The book provides valuable information on recent trends.","egZh":"此书就近来的发展趋势提供了宝贵的信息。"},{"w":"apply for","pos":"phrase","zh":"申请；请求","lv":"","eg":"I am continuing to apply for jobs.","egZh":"我正在继续找工作。"},{"w":"feel confident about","pos":"phrase","zh":"对……感到自信","lv":"","eg":"I feel quite confident about future.","egZh":"我对未来很有信心。"},{"w":"get off to a good start","pos":"phrase","zh":"有好的开端","lv":"","eg":"The meeting got off to a good start.","egZh":"会议有了一个良好的开端。"},{"w":"keep in touch with","pos":"phrase","zh":"与……保持联系","lv":"","eg":"We must keep in touch with each other.","egZh":"大家要常联系。"},{"w":"make the most of sth","pos":"phrase","zh":"充分利用某事物","lv":"","eg":"It’s my first trip abroad so I’m going to make the most of it.","egZh":"这是我第一次出国，我要充分利用这个机会。"},{"w":"news agency","pos":"phrase","zh":"新闻社；通讯社","lv":"","eg":"The announcement came in a bald statement from the official news agency.","egZh":"官方通讯社发表了直截了当的声明。"},{"w":"on offer","pos":"phrase","zh":"在供应中的；可提供的","lv":"","eg":"Over the page you can read all about the six great books on offer.","egZh":"在下一页上，你可以看到有关6本在售好书的全部信息。"},{"w":"work for peanuts","pos":"phrase","zh":"为了一点小钱而工作","lv":"","eg":"Researchers may sometimes complain they work for peanuts.","egZh":"研究人员或许有时候抱怨他们的薪酬微薄。"}],"GLOSS":{"internship":{"w":"internship","pos":"n.","zh":"实习期的工作","def":"a job that lasts for a short time that someone, especially a student, does to gain experience","eg":"Many internships are open to applicants from other countries.","egZh":"许多实习岗位都接收其他国家的申请者。","src":"Reading · Words & Expressions"},"applyfor":{"w":"apply for","pos":"phrase","zh":"申请；请求","def":"to request something, esp. officially and in writing","eg":"We’ve applied for a home improvement grant.","egZh":"我们已经申请改善住房的拨款。","src":"Reading · Language notes"},"newsagency":{"w":"news agency","pos":"phrase","zh":"新闻社；通讯社","def":"an organization that collects and supplies news","eg":"The announcement came from the official news agency.","egZh":"声明来自官方通讯社。","src":"Reading · Words & Expressions"},"thing":{"w":"if … is your thing","pos":"phrase","zh":"如果你喜欢……，如果你是……迷","def":"to say something is your thing means it is something you like or are good at","eg":"If antique is your thing, go to flea markets.","egZh":"如果你喜欢古董，那就去跳蚤市场。","src":"Reading · Language notes"},"intouch":{"w":"keep in touch with","pos":"phrase","zh":"与……保持联系","def":"to continue to communicate with someone","eg":"We keep in touch with each other by email.","egZh":"我们通过电子邮件保持联系。","src":"Reading · Words & Expressions"},"shortage":{"w":"shortage","pos":"n.","zh":"缺乏；缺少","def":"a situation in which there is not enough of something","eg":"A shortage of funds is preventing the UN from monitoring relief.","egZh":"资金短缺使联合国无法督导救援工作。","src":"Reading · Words & Expressions"},"goodstart":{"w":"get off to a good start","pos":"phrase","zh":"有好的开端","def":"to start in a particular (good/bad) way","eg":"The meeting got off to a good start.","egZh":"会议有了一个良好的开端。","src":"Reading · Language notes"},"onoffer":{"w":"on offer","pos":"phrase","zh":"供使用的，待出售的","def":"available to be used or bought","eg":"Over 40 new products are on offer at 25% off.","egZh":"超过40种新产品降价25%出售。","src":"Reading · Language notes"},"ln1":{"isNote":true,"w":"段③ 长句 · by + V-ing 作方式状语","sent":"By giving people your business card, and keeping in touch with people you meet on the job, you’ll have no shortage of useful contacts to help you get your career off to a good start.","zh":"通过递出你的名片，并与工作中接触到的人保持联系，你就不会缺乏有用的人脉，这将有助于你迎来职业生涯的良好开端。","def":"by + 动名词短语作方式状语，表示“通过……的方式”，主句表示其结果；句中 shortage / keep in touch with / get off to a good start 均为本课重点。","points":["keep in touch with","shortage","get off to a good start"],"src":"Reading · Language notes"}},"PASSAGE":[{"no":"①","text":"Would you work for peanuts? To say yes to this question is not as crazy as you may think. Many college students work very hard for little money—not because they’re stupid, but because they want to gain experience and build contacts in their business field. These jobs are called [[internship|internships]]."},{"no":"②","text":"An internship provides college students with a great way to get experience in their majors. Make sure you choose an internship which matches your interests though. For example, if you like writing and photography, why not [[applyfor|apply for]] an internship with a [[newsagency|news agency]]? If technology [[thing|is your thing]], try applying for an internship with a big technological company. After completing six months to a year’s work with a company, you can build a great résumé and apply for jobs feeling more confident about your skills."},{"no":"③","text":"Doing an internship is also a really good way of building valuable contacts in your chosen field. If you make the most of your time as an intern, you’ll use events and meetings to introduce yourself not just to people in your own organization, but also to suppliers and customers. [[ln1|By giving people your business card, and keeping in touch with people you meet on the job, you’ll have no shortage of useful contacts to help you get your career off to a good start]]."},{"no":"④","text":"These days, internships are becoming very popular. Why not find out what’s [[onoffer|on offer]]? Ask your college about its internship program or look for opportunities online. It could be the start of a brilliant career."}],"PASSAGE_ZH":[{"no":"①","text":"你愿意为了一点小钱工作吗？对这个问题给出肯定回答并不像你想象的那样疯狂。很多大学生都为了一点钱而非常努力地工作——不是因为他们蠢，而是因为他们想在行业领域积累经验、建立人脉。这样的工作叫作实习。"},{"no":"②","text":"实习为大学生获取专业经验提供了一条绝佳途径，但要确保你选择的实习工作与你的兴趣相匹配。举例来说，如果你喜欢写作和摄影，为什么不去申请新闻机构的实习呢？假如你喜欢技术，你可以尝试申请去大型科技公司实习。在一家公司完成半年到一年的实习工作后，你会写出一份优秀的简历，应聘时对自己的技能更加自信。"},{"no":"③","text":"实习也是在你选择的领域里建立有价值联系的好方法。假如你能充分利用实习时间，你可以利用各种活动和会议来自我介绍——不仅仅是向你的公司，也向供应商和客户介绍你自己。通过递出你的名片，并与工作中接触到的人保持联系，你就不会缺乏有用的人脉，这将有助于你迎来职业生涯的良好开端。"},{"no":"④","text":"如今，实习工作越来越受欢迎。为何不去看看都有哪些实习机会？问问你的大学有没有实习项目，或者自己上网寻找机会。这可能是一个辉煌生涯的开始。"}],"READING_QS":[{"q":"What does the passage call the jobs that college students do for little money to gain experience?","o":["Internships","Part-time jobs","Volunteer work"],"a":0,"y":"课文①明确写道 “These jobs are called internships.”（这样的工作叫作实习）。"},{"q":"If you like writing and photography, where does the passage suggest you apply for an internship?","o":["A big technological company","A news agency","A local bank"],"a":1,"y":"课文②举例：“why not apply for an internship with a news agency?”（为什么不去申请新闻机构的实习呢？）。"},{"q":"According to the passage, what can help you get your career off to a good start?","o":["Giving people your business card and keeping in touch with contacts","Always working alone","Avoiding meetings"],"a":0,"y":"课文③指出，通过递名片、与接触的人保持联系，能积累有用的人脉，助力职业生涯的良好开端。"},{"q":"How can you find out what internships are on offer?","o":["Ask your college or look online","Only through newspapers","By waiting for an email"],"a":0,"y":"课文④建议 “Ask your college about its internship program or look for opportunities online.”（问问大学或上网寻找）。"},{"q":"What is the general tone of the passage toward internships?","o":["Negative and discouraging","Neutral and factual only","Positive — a brilliant career may start from them"],"a":2,"y":"课文结尾说实习越来越受欢迎，且 “It could be the start of a brilliant career.”（这可能是一个辉煌生涯的开始）。"}],"PATTERNS":[{"fn":"01 · 表达慰问 / 获悉坏消息","frame":"So sorry to hear you lost your job.","ex":"So sorry to hear you lost your job.","zh":"获悉你丢了工作，很遗憾。（用于向对方表达同情与慰问）"},{"fn":"02 · 询问出了什么问题","frame":"What went wrong?","ex":"What went wrong?","zh":"出了什么问题？（职场对话中常用以开启对失误/事故原因的讨论）"},{"fn":"03 · 说明“不合适 / 不匹配”","frame":"My boss told me that I wasn’t the right fit for the company.","ex":"I wasn’t the right fit for the company.","zh":"我不太适合这家公司。（the right fit 常用于评价人与岗位、团队的匹配度）"},{"fn":"04 · 表达个人工作偏好","frame":"I do prefer to get things done on my own.","ex":"I do prefer to get things done on my own.","zh":"我确实更喜欢独自完成任务。（强调型的 prefer 表达）"},{"fn":"05 · 总结根因","frame":"I guess it comes down to experience.","ex":"It comes down to experience, which I’ve accumulated bit by bit.","zh":"归结起来是经验的问题，而我是一点一点积累起来的。（come down to 意为“归根到底在于”）"},{"fn":"06 · 提出改进 / 表态","frame":"I need to communicate with others and work as part of a team.","ex":"From now on, I need to communicate with others and work as part of a team.","zh":"从今往后，我需要与他人沟通、作为团队的一员去工作。"},{"fn":"07 · 表示完全赞同","frame":"I totally agree.","ex":"I totally agree.","zh":"我完全赞同。"},{"fn":"08 · 赞叹 / 不足为奇","frame":"No wonder you are the product director!","ex":"No wonder you are the product director! You are so familiar with Chinese culture.","zh":"难怪你是产品总监！你对中国文化如此熟悉。"}],"CHAT_TIPS":["听对话时注意说话人的语气与情绪：Marco 被解雇后语气低落，Amanda 以安慰与建议的口吻回应。","职场对话中 “team player”（团队成员 / 有团队精神）是高频词，常用来评价一个人是否适合团队工作。","短语 “the right fit”（合适的人 / 匹配）与 “take the initiative”（主动）是职场评价常用表达，听到时要快速反应。","做填空前先通读整段对话，预测空格所需词性（名词 / 形容词 / 动词短语），再边听边填。","VR 情景中 Jack 与 Katherine 的对话展示了如何礼貌地向同事请教，注意 “Although I’ve been interning for only two months…” 这类谦逊而得体的表达。"],"PRIDE_PASSAGE":["Once Mencius was asked, \"How can one be a wise king in your opinion?\" He answered, \"In my opinion, a wise king should rule the country benevolently. As a result, more people will support him and few oppose him. I mean that a favorable climate isn't as important as geographical advantages, but that geographical advantages aren't as important as the unity and support of the people. Take a small city for example. After several failures in capturing the city, the enemy would surely take advantage of climatic conditions as cold and heat, and wind and rain. However, their efforts would still end in vain if the high walls and deep moat of the small city outweighed the advantage of the favorable climate conditions used by the enemy.","If the same city had high, firm walls, sharp weapons and was well-supplied, the soldiers on guard might still flee in terror when the enemy came if they were not unified in purpose. Why is it so? This is definitely because geographical advantages aren't as important as the unity of the people. These two examples fully support my viewpoint that people cannot be confined by the boundaries and that a country cannot be safeguarded by its geographical advantages. Resorting to force is not a long-term policy to manage a country. Without the adoption of a benevolent policy, a ruler will be doomed to lose power because people will no longer offer their support."],"PRIDE_ZH":["有一回有人问孟子：“先生以为怎样做才算是圣主明君呢？”孟子说：“我认为圣主明君是用仁政来治理天下的，这样顺从、支持他的人就多，反对他的人就少。我的意思是说天时不如地利，地利不如人和。举个例子说吧，比如有座小城，敌人多次进攻失败后是一定会利用适合作战的阴晴、寒暑、风雨等有利天时的，但他们不能获胜。因为这座小城占有地形上的优势，城高池深，这种地利超过了敌方的天时。","同样的一座城，城墙很牢固，兵力也强，兵器也锐利，粮食充足，可是当敌人来了，城内守兵仍有可能弃城逃跑，这又是什么原因呢？这说明地利不如人和呀！这就证明了我的主张：靠疆界是无法限制百姓的；守卫家园依靠山川险阻也是靠不住的；同样，仰仗武力也是不能长久地威行天下的。如果你不施行仁政，人们就离你远远的，会搞得众叛亲离，那么你不是注定要垮台吗？”"],"PRIDE_CULTURE":"“天时不如地利，地利不如人和”出自《孟子·公孙丑下》。孟子认为，治理国家要靠仁政，顺从、支持君主的人多，国家就安定；相比之下，地理险阻（地利）与气候条件（天时）都不如民众的团结一心（人和）重要。即便城高池深、兵精粮足，若守军不能同心协力，仍会不战自溃。这一思想体现了中华文明对“人和”——集体团结、上下同欲——的高度重视。在现代职场中，“人和”正是团队协作精神的文化根脉：一个优秀的团队不靠单打独斗，而靠成员相互尊重、积极沟通、彼此支持，才能创造佳绩。","PRIDE_QS":[{"q":"“地利不如人和”的核心含义是？","o":["地理优势比民众团结更重要","民众的团结一心胜过地理与天时优势","气候条件决定胜负"],"a":1,"y":"孟子明确指出 geographical advantages aren’t as important as the unity of the people（地利不如人和）。"},{"q":"在孟子看来，贤明的君主应当如何治理国家？","o":["依靠武力","施行仁政","孤立百姓"],"a":1,"y":"文中孟子主张 “a wise king should rule the country benevolently”（以仁政治理天下）。"},{"q":"为何城高池深、兵精粮足的守军仍可能弃城逃跑？","o":["因为将士不能同心协力（unity of purpose）","因为惧怕敌人的武器","因为天气恶劣"],"a":0,"y":"文中说若守军 “were not unified in purpose”（不能同心协力），即便城防坚固也可能溃逃。"}],"PRIDE_CET4":[{"w":"benevolent","pos":"adj.","zh":"仁慈的；仁政的","eg":"a wise king should rule the country benevolently"},{"w":"favorable","pos":"adj.","zh":"有利的；赞成的","eg":"a favorable climate isn’t as important as geographical advantages"},{"w":"geographical","pos":"adj.","zh":"地理的","eg":"geographical advantages plus the unity of the people"},{"w":"unity","pos":"n.","zh":"团结；统一","eg":"geographical advantages aren’t as important as the unity of the people"},{"w":"advantage","pos":"n.","zh":"优势；有利条件","eg":"the high walls outweighed the advantage of the favorable climate"},{"w":"capture","pos":"v.","zh":"攻占；捕获","eg":"After several failures in capturing the city"},{"w":"moat","pos":"n.","zh":"护城河","eg":"the high walls and deep moat of the small city"},{"w":"outweigh","pos":"v.","zh":"比……更重要；超过","eg":"the small city outweighed the advantage of the favorable climate"},{"w":"weapon","pos":"n.","zh":"武器","eg":"sharp weapons and was well-supplied"},{"w":"flee","pos":"v.","zh":"逃跑；溃逃","eg":"the soldiers on guard might still flee in terror"},{"w":"unify","pos":"v.","zh":"使统一；使一致","eg":"if they were not unified in purpose"},{"w":"confine","pos":"v.","zh":"限制；禁闭","eg":"people cannot be confined by the boundaries"},{"w":"safeguard","pos":"v.","zh":"保卫；维护","eg":"a country cannot be safeguarded by its geographical advantages"},{"w":"resort","pos":"v.","zh":"诉诸；依靠","eg":"Resorting to force is not a long-term policy"},{"w":"doomed","pos":"adj.","zh":"注定的（失败/毁灭）","eg":"a ruler will be doomed to lose power"}],"PRIDE_PHRASES":[{"p":"take advantage of","zh":"利用","eg":"the enemy would surely take advantage of climatic conditions"},{"p":"end in vain","zh":"以失败 / 徒劳告终","eg":"their efforts would still end in vain"},{"p":"outweigh","zh":"超过；比……更重要","eg":"the small city outweighed the advantage"},{"p":"be confined by","zh":"被……限制","eg":"people cannot be confined by the boundaries"},{"p":"safeguard … by","zh":"依靠……保卫","eg":"a country cannot be safeguarded by its geographical advantages"},{"p":"resort to","zh":"诉诸；求助于","eg":"Resorting to force is not a long-term policy"}],"PRIDE_PATTERNS":[{"t":"否定比较级 not as … as（不如……）","frame":"A isn’t as + adj. + as B","eg":"a favorable climate isn’t as important as geographical advantages","zh":"天时不如地利——A 不如 B 重要。"},{"t":"条件句 If …（如果……）","frame":"If + 从句, 主句","eg":"If the same city had high, firm walls …, the soldiers might flee …","zh":"如果同一座城有高墙坚壁……守军仍可能逃跑——用于提出假设。"},{"t":"动名词作主语 / 宾语 Resorting to …","frame":"Resorting to + n. + be + …","eg":"Resorting to force is not a long-term policy","zh":"诉诸武力不是长久之策。"}],"GAP_ANSWERS":{"vf":["dress code","allowed","staff","permitted","slogans"],"chatting":["the right fit","taking the initiative","on my own","check things with","communicate with others"]},"QUESTIONS":{"vf":[{"q":"What does Sally want to remind Tim about?","opts":["His late arrival","The company dress code","His work performance"],"a":1,"why":"对话开头 Sally 说 “I wanted to remind you about our company dress code.”"},{"q":"According to the dress code, which of the following is NOT allowed at work?","opts":["Jeans","Suits","A shirt and tie"],"a":0,"why":"Sally 明确说 “we’re not allowed to wear jeans to work”，且 staff members are not permitted to wear jeans。"},{"q":"What is a “dress-down Friday” in the conversation?","opts":["A day to wear formal suits","A day when you can wear what you want","A day off work"],"a":1,"why":"Sally 说 “We do sometimes have dress-down Fridays. You can wear what you want.”"}],"chatting":[{"q":"Why was Marco fired?","opts":["He was always late for work","He wasn’t the right fit and wasn’t enough of a team player","He quit by himself"],"a":1,"why":"Marco 说老板告诉他 “I wasn’t the right fit for the company”，且 “wasn’t enough of a team player”。"},{"q":"What was Marco said to be very good at?","opts":["Taking the initiative","Communicating with others","Checking things with colleagues"],"a":0,"why":"Boss 评价他 “very good at taking the initiative”（很有主动性）。"},{"q":"What will Marco do from now on?","opts":["Work alone all the time","Communicate with others and work as part of a team","Quit the industry"],"a":1,"why":"Marco 最后说 “I need to communicate with others and work as part of a team.”"}]},"SP_GROUPS":[{"group":"Grammar Focus · Attributive clauses（定语从句）","cards":[{"no":"1","title":"限制性定语从句 Restrictive attributive clauses","sent":"The girl whom I saw told me to come back today.","zh":"我见到的那个姑娘叫我今天再来。","items":[{"lb":"关系代词 who / whom / which / that","df":"引导限制性定语从句，限定先行项的意义；去掉后句意常不完整。","egs":[["The car which I hired broke down.","我租的汽车坏了。"],["The man who robbed her has been arrested.","抢劫她的那个男人已被逮捕。"]]}],"src":"Grammar Focus · Attributive clauses"},{"no":"2","title":"非限制性定语从句 Non-restrictive attributive clauses","sent":"My grandmother, who is 86, drinks green tea every day.","zh":"我86岁的祖母每天都喝绿茶。","items":[{"lb":"逗号分隔","df":"对先行项仅作补充说明，去掉不影响主句；常用 which / who 引导。","egs":[["The 9:30 train, which is usually very punctual, was late today.","9点30分的火车通常很准时，今天却误点了。"]]}],"src":"Grammar Focus · Attributive clauses"},{"no":"3","title":"课文中的定语从句 In the reading","sent":"Make sure you choose an internship which matches your interests though.","zh":"但要确保你选择的实习工作符合你的兴趣。","items":[{"lb":"which","df":"关系代词，指代前文 internship，在从句中作主语。","egs":[["an internship which matches your interests","符合你兴趣的实习"]]}],"src":"Reading · Grammar"}]},{"group":"Reading · Language notes（语言解析）","cards":[{"no":"1","title":"if … is your thing","sent":"If technology is your thing, try applying for an internship with a big technological company.","zh":"假如你喜欢技术，你可以尝试申请去大型科技公司实习。","items":[{"lb":"含义","df":"表示某物是你喜欢或擅长的事物。","egs":[["If antique is your thing, go to flea markets.","如果你喜欢古董，那就去跳蚤市场。"]]}],"src":"Reading · Language notes"},{"no":"2","title":"apply for","sent":"Why not apply for an internship with a news agency?","zh":"为什么不去申请新闻机构的实习呢？","items":[{"lb":"含义","df":"提出请求，申请（尤指正式、书面）。","egs":[["We’ve applied for a home improvement grant.","我们已经申请改善住房的拨款。"]]}],"src":"Reading · Language notes"},{"no":"3","title":"keep / stay in touch with","sent":"keeping in touch with people you meet on the job","zh":"与工作中接触到的人保持联系","items":[{"lb":"含义","df":"与……保持联系。","egs":[["We keep in touch with each other by email.","我们通过电子邮件保持联系。"],["He promised to stay in touch with us while he was abroad.","他承诺出国后会和我们保持联系。"]]}],"src":"Reading · Language notes"},{"no":"4","title":"get off to a good / bad start","sent":"help you get your career off to a good start","zh":"有助于你迎来职业生涯的良好开端","items":[{"lb":"含义","df":"以某种（好的 / 不好的）方式开始。","egs":[["The day had got off to a bad start.","这一天一开始就不顺。"]]}],"src":"Reading · Language notes"},{"no":"5","title":"on offer","sent":"Why not find out what’s on offer?","zh":"为何不去看看都有哪些实习机会？","items":[{"lb":"含义","df":"供使用的，待出售的。","egs":[["Over 40 new products are on offer at 25 percent off.","超过40种新产品降价25%出售。"]]}],"src":"Reading · Language notes"}]}]},"content":{"unit":{"title":"In the workplace","zh":"职场日常","book":"New Era English for Careers · 用英语讲中国故事","source":"U3（VR版）_教学课件_202504.pptx"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段 Sally 与 Tim 关于着装规定的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u3-vocabulary-focus-exC.mp3","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["dress code","allowed","staff","permitted","slogans"],"gaps":[{"who":"Sally","html":"Hi, Tim. Can I have a word, please?"},{"who":"Tim","html":"Sure, Sally."},{"who":"Sally","html":"I wanted to remind you about our company <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">."},{"who":"Tim","html":"Is there something wrong with what I’m wearing?"},{"who":"Sally","html":"Well, you’re wearing jeans."},{"who":"Tim","html":"Oh. I think they look quite smart."},{"who":"Sally","html":"They’re smart jeans, yes, but they are still jeans and we’re not <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> to wear jeans to work."},{"who":"Tim","html":"I see. Sorry about that. I won’t wear them again. I haven’t seen the dress code though. Where can I find it?"},{"who":"Sally","html":"It’s on our <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> webpage. I’ll show you. Look! It says that staff members are not <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> to wear jeans."},{"who":"Tim","html":"I see. And no T-shirts with <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\">, short trousers or baseball caps."},{"who":"Sally","html":"We do sometimes have dress-down Fridays. You can wear what you want."},{"who":"Tim","html":"What a great idea!"}],"script":[["Sally","Hi, Tim. Can I have a word, please?"],["Tim","Sure, Sally."],["Sally","I wanted to remind you about our company dress code."],["Tim","Is there something wrong with what I’m wearing?"],["Sally","Well, you’re wearing jeans."],["Tim","Oh. I think they look quite smart."],["Sally","They’re smart jeans, yes, but they are still jeans and we’re not allowed to wear jeans to work."],["Tim","I see. Sorry about that. I won’t wear them again. I haven’t seen the dress code though. Where can I find it?"],["Sally","It’s on our staff webpage. I’ll show you. Look! It says that staff members are not permitted to wear jeans."],["Tim","I see. And no T-shirts with slogans, short trousers or baseball caps."],["Sally","We do sometimes have dress-down Fridays. You can wear what you want."],["Tim","What a great idea!"]],"translation":[["萨莉","嗨，蒂姆。我想和你说句话，可以吗？"],["蒂姆","当然了，萨莉。"],["萨莉","我想提醒你一下我们公司的着装规定。"],["蒂姆","我的着装有什么问题吗？"],["萨莉","嗯，你穿的是牛仔裤。"],["蒂姆","哦，我觉得这条裤子看着还挺得体的。"],["萨莉","是，这条牛仔裤挺好看，但它仍然是牛仔裤。公司不允许穿牛仔裤上班。"],["蒂姆","我明白了。对不起，我不会再穿了。不过我还没有看到公司的着装规定。在哪里能看到？"],["萨莉","在我们的员工网页上，我指给你看。你看，上面写着“员工不可以穿牛仔裤”。"],["蒂姆","我看到了。也不能穿有标语的T恤、短裤，不能戴棒球帽。"],["萨莉","我们有时会有星期五便装日。你可以穿你想穿的衣服。"],["蒂姆","那可真好！"]],"note":"词库：dress code, allowed, staff, permitted, slogans。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Working for peanuts?","lead":"阅读课文，了解大学生“为一点小钱工作”的实习现象，并思考实习对职业生涯的意义。","audio":"assets/audio/s2-u3-reading-passage.mp3","audioLabel":"课文原声 · Working for peanuts?"},"chatting":{"title":"Chatting · Listen and complete the conversation","lead":"听 Amanda 与 Marco 关于失业与团队合作的对话，补全空缺，并核对理解。","audio":"assets/audio/s2-u3-chatting-listening.mp3","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["the right fit","taking the initiative","on my own","check things with","communicate with others"],"gaps":[{"who":"Amanda","html":"Hi, Marco. So sorry to hear you lost your job."},{"who":"Marco","html":"Yes, I got fired."},{"who":"Amanda","html":"What went wrong?"},{"who":"Marco","html":"My boss told me that I wasn’t <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\"> for the company."},{"who":"Amanda","html":"Did she say why?"},{"who":"Marco","html":"I asked her. She said that I was very good at <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\">, but that I wasn’t enough of a team player."},{"who":"Amanda","html":"And do you agree with her?"},{"who":"Marco","html":"Well, to be honest, I do prefer to get things done <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">. It slows me down if I’m always having to <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> my colleagues."},{"who":"Amanda","html":"Being a good team player is one of the most important skills for today’s workplace, Marco. It’s something you’ll need to work on if you want to be a successful professional."},{"who":"Marco","html":"I guess you’re right. Well, I’ve learned my lesson. From now on, I need to <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> and work as part of a team."}],"script":[["Amanda","Hi, Marco. So sorry to hear you lost your job."],["Marco","Yes, I got fired."],["Amanda","What went wrong?"],["Marco","My boss told me that I wasn’t the right fit for the company."],["Amanda","Did she say why?"],["Marco","I asked her. She said that I was very good at taking the initiative, but that I wasn’t enough of a team player."],["Amanda","And do you agree with her?"],["Marco","Well, to be honest, I do prefer to get things done on my own. It slows me down if I’m always having to check things with my colleagues."],["Amanda","Being a good team player is one of the most important skills for today’s workplace, Marco. It’s something you’ll need to work on if you want to be a successful professional."],["Marco","I guess you’re right. Well, I’ve learned my lesson. From now on, I need to communicate with others and work as part of a team."]],"translation":[["阿曼达","嗨，马尔科。很抱歉得知你丢了工作。"],["马尔科","是的，我被解雇了。"],["阿曼达","出了什么问题？"],["马尔科","我的老板告诉我，我不适合这个公司。"],["阿曼达","她说为什么了吗？"],["马尔科","我问了她，她说我很主动，但不够有团队精神。"],["阿曼达","你同意她的说法吗？"],["马尔科","老实说，我确实更喜欢独自完成任务。如果我总是要和同事们核对事情，那会拖累我。"],["阿曼达","但成为一名优秀的团队成员是当今职场最重要的技能之一，马尔科。如果想成为一名成功的职场人士，你就必须为此努力。"],["马尔科","我认为你说得对。好吧，我已经吸取了教训。从今往后，我需要学会和他人交流，并且作为团队的一员去工作。"]],"note":"词库：the right fit, taking the initiative, on my own, check things with, communicate with others。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · 地利人和 (Unity of the People)","lead":"阅读孟子关于“天时、地利、人和”的论述，理解“人和”——民众团结与支持——胜于地利与天时的中国智慧，并思考其对现代团队合作的启示。","audio":"assets/audio/s2-u3-pride-of-china.mp3","audioLabel":"专题原声 · 地利人和 · Unity of the People","note":"素材取自课件中孟子《公孙丑下》“天时不如地利，地利不如人和”选段，理解“人和”胜于地利与天时的中国智慧。"}}});

window.__PENDING_UNITS.push({"id":"s2-u4","readyNo":4,"data":{"WORDS":[{"w":"experienced","pos":"adj.","zh":"经验丰富的，有经验的","lv":"","eg":"An experienced nurse treats all minor injuries.","egZh":"一位有经验的护士处理所有的轻伤。"},{"w":"final","pos":"n.","zh":"期终考试，大学毕业考试","lv":"","eg":"Anna sat her finals last summer.","egZh":"安娜去年夏天参加了大学毕业考试。"},{"w":"fluently","pos":"adv.","zh":"熟练地，流利地","lv":"","eg":"I can't speak English fluently as I am out of practice.","egZh":"我不能流利地说英语，因为我已荒疏了。"},{"w":"graduate","pos":"n./v.","zh":"大学毕业生；大学毕业","lv":"","eg":"Unemployment is a very real problem for graduates now.","egZh":"现在，失业对大学毕业生是个实质问题。"},{"w":"rewarding","pos":"adj.","zh":"值得做的，有意义的","lv":"","eg":"Nursing can be a very rewarding career.","egZh":"护士是一个非常有意义的职业。"},{"w":"on balance","pos":"phrase","zh":"全面考虑之后，总的说来","lv":"","eg":"On balance, the company has had a successful year.","egZh":"总的来说，公司这一年是成功的。"},{"w":"weigh up","pos":"phrase","zh":"仔细考虑，权衡","lv":"","eg":"You must weigh up the pros and cons.","egZh":"你必须权衡利弊。"},{"w":"amazed","pos":"adj.","zh":"大为惊喜的；惊讶的","lv":"","eg":"I was amazed at her knowledge of French literature.","egZh":"她的法国文学知识之丰富使我大为惊奇。"},{"w":"antique","pos":"n./adj.","zh":"古董（的）；古时制造的","lv":"","eg":"He wears designer clothes and drives an antique car.","egZh":"他穿着著名设计师设计的服装，开着一辆古董车。"},{"w":"component","pos":"n.","zh":"零件；组成部分","lv":"","eg":"The factory supplies electrical components for cars.","egZh":"这家工厂供应汽车的电器部件。"},{"w":"inspirational","pos":"adj.","zh":"鼓舞人心的；启发灵感的","lv":"","eg":"As well as a fine defender, he was an inspirational captain.","egZh":"他不仅是个优秀的防守队员，还是个很会鼓舞大家的队长。"},{"w":"journal","pos":"n.","zh":"日记；日志","lv":"","eg":"He kept a journal of his travels across Asia.","egZh":"他把自己的亚洲之行记录下来了。"},{"w":"patient","pos":"adj.","zh":"有耐心的；能忍耐的","lv":"","eg":"He was endlessly kind and patient with children.","egZh":"他对孩子们总是非常好，很有耐心。"},{"w":"publisher","pos":"n.","zh":"出版商；出版社","lv":"","eg":"The publisher planned to produce the journal on a weekly basis.","egZh":"出版者计划将该期刊定为周刊。"},{"w":"repair","pos":"v./n.","zh":"修理；修补","lv":"","eg":"Goldsmith has repaired the roof to ensure the house is wind-proof.","egZh":"戈德史密斯修理了屋顶，以确保房屋能够抗风。"},{"w":"target","pos":"n.","zh":"目标；靶子","lv":"","eg":"The missiles missed their target.","egZh":"导弹没有击中目标。"},{"w":"consist of","pos":"phrase","zh":"由……构成","lv":"","eg":"Their diet consists largely of vegetables.","egZh":"他们的日常饮食以蔬菜为主。"},{"w":"fed up","pos":"phrase","zh":"厌烦的；无法再忍受的","lv":"","eg":"In the end, I just got fed up with her constant complaining.","egZh":"她不停地发牢骚，终于使我厌烦了。"},{"w":"nine to five","pos":"phrase","zh":"朝九晚五","lv":"","eg":"I work nine to five.","egZh":"我九点至五点上班。"},{"w":"stressed out","pos":"phrase","zh":"焦虑的；紧张的","lv":"","eg":"I was really stressed out before finals.","egZh":"期末考试之前我非常担心。"},{"w":"take heart from","pos":"phrase","zh":"受到鼓舞；树立信心","lv":"","eg":"The government can take heart from the latest opinion polls.","egZh":"政府可以从最近的民意测验中找回信心。"}],"GLOSS":{"ambitious":{"w":"ambitious","pos":"adj.","zh":"有抱负的，有雄心的","def":"determined to be successful, rich, powerful, etc.","eg":"Alfred was intensely ambitious, obsessed with the idea of starting up his own company.","egZh":"艾尔弗雷德雄心勃勃，一心想着创立自己的公司。","src":"Reading · 语言解析①"},"publisher":{"w":"publisher","pos":"n.","zh":"出版商，出版社","def":"a person or company whose business is to arrange the writing, production, and sale of books, newspapers, etc.","eg":"My father was the editor and publisher of a small town newspaper.","egZh":"我父亲是一家小镇报社的编辑兼出版商。","src":"Reading · 语言解析②"},"antique":{"w":"antique","pos":"n./adj.","zh":"古董（的），古时制造的","def":"a piece of furniture, jewelry, etc. made a long time ago and valuable; old and often valuable","eg":"An antique vase was stolen last night.","egZh":"昨晚一个古董花瓶被偷了。","src":"Reading · 语言解析③"},"repair":{"w":"repair","pos":"v./n.","zh":"修理，修补","def":"to fix something damaged, broken, or not working properly","eg":"Goldsmith has repaired the roof to ensure the house is wind-proof.","egZh":"戈德史密斯修理了屋顶，以确保房屋能够抗风。","src":"Reading · 语言解析④"},"component":{"w":"component","pos":"n.","zh":"零件，组成部分","def":"one of several parts that together make up a whole machine, system, etc.","eg":"The factory supplies electrical components for cars.","egZh":"这家工厂供应汽车的电器部件。","src":"Reading · Words & Expressions"},"fed up":{"w":"fed up","pos":"phrase","zh":"厌烦的，无法再忍受的","def":"annoyed or bored with something because it has been happening for too long","eg":"In the end, I just got fed up with her constant complaining.","egZh":"她不停地发牢骚，终于使我厌烦了。","src":"Reading · Words & Expressions"},"nine to five":{"w":"nine to five","pos":"phrase","zh":"朝九晚五","def":"a job with normal daytime office hours","eg":"I work nine to five.","egZh":"我九点至五点上班。","src":"Reading · Words & Expressions"},"stressed out":{"w":"stressed out","pos":"phrase","zh":"焦虑的，紧张的","def":"very anxious, tired, and unable to relax","eg":"I was really stressed out before finals.","egZh":"期末考试之前我非常担心。","src":"Reading · Words & Expressions"},"journal":{"w":"journal","pos":"n.","zh":"日记，日志","def":"a written record of the things you do, see, etc. every day","eg":"He kept a journal of his travels across Asia.","egZh":"他把自己的亚洲之行记录下来了。","src":"Reading · Words & Expressions"},"amazed":{"w":"amazed","pos":"adj.","zh":"大为惊喜的，惊讶的","def":"very surprised","eg":"I was amazed at her knowledge of French literature.","egZh":"她的法国文学知识之丰富使我大为惊奇。","src":"Reading · Words & Expressions"},"consist of":{"w":"consist of","pos":"phrase","zh":"由……构成","def":"to be made up of something","eg":"Their diet consists largely of vegetables.","egZh":"他们的日常饮食以蔬菜为主。","src":"Reading · Words & Expressions"},"ln1":{"isNote":true,"w":"段① 长句 · 将来职业规划","sent":"I'm very ambitious—I really enjoy the challenge of meeting targets and trying to be the best. In a few years' time, I hope to be a regional manager.","zh":"我很有雄心壮志——完成目标并努力做到最好，我很享受这个挑战的过程。几年后，我希望能成为一名大区经理。","def":"用 \"In a few years' time\" 表示\"几年后\"，hope to be 用于表达职业目标。","points":["ambitious","meeting targets","regional manager"],"src":"Reading · 语言解析①"},"ln2":{"isNote":true,"w":"段③ 长句 · 专注与耐心","sent":"You need to be really patient and have to concentrate really hard.","zh":"你需要非常有耐心，并且必须非常专注。","def":"patient 与 concentrate 连用，说明古董修复工作对心性的高要求。","points":["patient","concentrate"],"src":"Reading · 语言解析③-④"}},"PASSAGE":[{"no":"①","text":"I've been working with my company for over two years now. Last month, my department had an eight-percent increase in sales, and I want to get this up by another two percent next year. I'm very [[ambitious|ambitious]]—I really enjoy the challenge of meeting targets and trying to be the best. In a few years' time, I hope to be a regional manager. [[ln1|In a few years' time, I hope to be a regional manager.]]"},{"no":"②","text":"After graduation, my husband and I both got good jobs in Toronto. We earned a lot, but we got [[fed up|fed up]] with working [[nine to five|nine to five]] every day. We felt tired and [[stressed out|stressed out]]. So we quit our jobs, sold our big house and decided to travel the world! During our trip, we sent our travel [[journal|journals]] and photographs to a [[publisher|publisher]] and we were [[amazed|amazed]] when they agreed to publish our work! Now we live the life we really want."},{"no":"③","text":"This job wouldn't be for everyone—an [[antique|antique]] clock [[consist of|consists of]] thousands of [[component|components]] and it can take several months to [[repair|repair]] one. You need to be really patient and have to concentrate really hard. I spend hours each day alone, sitting at my working table in complete silence. I wouldn't change my job though—it's perfect for me, and I feel really satisfied when I finish a [[repair|repair]]. [[ln2|You need to be really patient and have to concentrate really hard.]]"}],"PASSAGE_ZH":[{"no":"①","text":"我在公司工作已经两年多了。上个月，我所在部门的销售额增长了8%，明年我想把这个数字再提高2%。我很有雄心壮志——完成目标并努力做到最好，我很享受这个挑战的过程。几年后，我希望能成为一名大区经理。"},{"no":"②","text":"毕业后，我和丈夫都在多伦多找到了好工作。我们赚了很多钱，但我们厌倦了每天朝九晚五的工作。我们觉得很累，压力很大。所以我们辞掉了工作，卖掉了我们的大房子，决定去环游世界！在旅行期间，我们把旅行日记和照片发给了一个出版商。当他们同意出版我们的作品时，我们大吃一惊！现在我们过上了自己真正想要的生活。"},{"no":"③","text":"并非所有人都适合这份工作——一座古董钟包含上千个零件，修理好一座可能就需要几个月的时间。你需要非常有耐心，并且必须非常专注。我每天都花几个小时独自坐在工作台前，在一片寂静中工作。但我不会换工作，它对我来说是完美的，而且每当我完成一项维修工作时，我都感到非常满足。"}],"READING_QS":[{"q":"What is Brad Mercer's career ambition?","o":["To become a regional manager","To travel the world","To repair antique clocks"],"a":0,"y":"出处：课文① Brad Mercer 说到 \"I hope to be a regional manager.\""},{"q":"Why did Jennifer and Will Shaw quit their jobs in Toronto?","o":["They got fed up with nine-to-five work","They wanted to repair antiques","They were dismissed"],"a":0,"y":"出处：课文② \"we got fed up with working nine to five every day.\""},{"q":"What does Wang Jianzhong do for a living?","o":["An antique repairer","A sales manager","A travel writer"],"a":0,"y":"出处：课文③ 标题 \"Antique repairer\"。"},{"q":"How long might it take Wang Jianzhong to repair one antique clock?","o":["Several months","A few days","Several years"],"a":0,"y":"出处：课文③ \"it can take several months to repair one.\""}],"PATTERNS":[{"fn":"01 · 表达考虑职业转变","frame":"I'm considering a career change.","ex":"Actually, everything's fine, but I'm considering a career change.","zh":"表达正在考虑转行 / 换工作。"},{"fn":"02 · 表达工作缺乏成就感","frame":"I just don't find it fulfilling any more.","ex":"To be honest, I just don't find it fulfilling any more.","zh":"说明当前工作不再让人有满足感。"},{"fn":"03 · 表达收到工作邀约","frame":"A contact has offered me a teaching job.","ex":"A contact has offered me a teaching job in western China.","zh":"说明有人提供了某份工作机会。"},{"fn":"04 · 询问是否接受提议","frame":"Do you think you'll take up the offer?","ex":"Do you think you'll take up the offer?","zh":"用 take up the offer 询问对方是否接下邀约。"},{"fn":"05 · 说明职业规划取决于人生规划","frame":"Career planning depends on your life plans.","ex":"Career planning depends on your life plans. How do you see your life in the future?","zh":"说明职业规划建立在人生目标之上。"},{"fn":"06 · 表达用专业技能改善生活","frame":"I hope to use my professional skills to improve people's daily lives.","ex":"I hope to use my professional skills to improve people's daily lives.","zh":"表达运用专业技能造福他人、改善生活。"}],"CHAT_TIPS":["听前先浏览填空，预测所缺词性与词义（名词 / 动词 / 短语）。","注意对话中的连读与弱读，如 \"I'm considering\" 中 'm 的轻读。","掌握本单元短语动词（phrasal verbs）的含义与搭配，如 take up、hand in、look forward to。","听后对照 Script 与中文译文，核对填空并跟读模仿语音语调。","关注职业路径相关表达：career change、fulfilling、take up the offer 等。"],"PRIDE_PASSAGE":[{"no":"①","text":"Beijing opera is a beautiful form of artistic expression. Mei Lanfang, arguably the most celebrated Beijing opera artist of all time, succeeded in spreading the beauty of Chinese theater all over the world."},{"no":"②","text":"Born in Beijing in 1894, Mei began training in Chinese opera skills at age eight. Best-known for portraying female characters, his performance style was rigorous yet elegant. Throughout his career, he modernized many aspects of Beijing opera."},{"no":"③","text":"The preciousness of Mei Lanfang's art lay not only in his unique talent and hard work, but also in his loyalty to the nation. During wartime, Mei stopped singing and dancing and grew a mustache as a response to the Japanese who requested him to perform. During this period, he relied solely on pawning and selling his paintings."},{"no":"④","text":"This bold act of patriotism earned him great respect and bolstered his fame as an artist."},{"no":"⑤","text":"In the 1950s, Mei began a new chapter in his artistic career. He actively practiced the purpose of \"literature and art for the people\", continuously innovating the old and bringing forth the new. He built a drama performance system with deep national characteristics, and completed his transition from \"king of the opera world\" to an artist of the people, becoming a literary and art worker with a high degree of cultural self-confidence."}],"PRIDE_ZH":[{"no":"①","text":"京剧是一种美丽的艺术表达形式。梅兰芳，可以说是有史以来最著名的京剧表演艺术家，他成功地将中国戏剧之美传播到世界各地。"},{"no":"②","text":"梅兰芳1894年生于北京，八岁开始学习中国戏曲技艺。梅兰芳以塑造女性角色而闻名，其表演风格严谨而优雅。在他的整个职业生涯中，他将京剧的许多方面现代化了。"},{"no":"③","text":"梅兰芳艺术的珍贵，不仅在于其天赋独厚之条件和苦心孤诣之努力，更在于其民族气节。在抗战期间，作为对日本人要求他表演的回应，梅兰芳息歌罢舞、蓄须明志，其间仅靠典当和卖画为继。"},{"no":"④","text":"这一大胆的爱国主义行为为他赢得了极大的尊重，并提高了他作为艺术家的声誉。"},{"no":"⑤","text":"20世纪50年代，梅兰芳开启了他艺术生涯的新篇章。他积极践行\"文艺为人民\"的宗旨，不断推陈出新，构筑起深具民族特性的戏曲表演体系，完成了从\"伶界大王\"到人民艺术家的转变，成为具有高度文化自信的文艺工作者。"}],"PRIDE_CULTURE":"梅兰芳（1894—1961）是京剧\"梅派\"艺术创始人，被誉为\"伶界大王\"。他在京剧旦角表演、唱腔与身段上均有开创性贡献，并将京剧推向世界舞台。抗战期间他蓄须明志、拒绝为日寇演出，展现出崇高的民族气节；新中国成立后他又积极\"推陈出新\"，践行文艺为人民的宗旨。京剧作为中国非物质文化遗产，融合了唱、念、做、打，是中国传统艺术走向世界的重要名片。","PRIDE_QS":[{"q":"What did Mei Lanfang do during the wartime to show his patriotism?","o":["He grew a mustache and stopped performing","He performed for the Japanese","He sold all his paintings abroad"],"a":0,"y":"出处：专题③ \"Mei stopped singing and dancing and grew a mustache as a response to the Japanese who requested him to perform.\""},{"q":"What is Mei Lanfang best-known for?","o":["Portraying female characters","Playing the drums","Writing opera scripts"],"a":0,"y":"出处：专题② \"Best-known for portraying female characters\"。"},{"q":"In the 1950s, what purpose did Mei actively practice?","o":["Literature and art for the people","Art only for the rich","Modern dancing"],"a":0,"y":"出处：专题⑤ \"the purpose of literature and art for the people\"。"}],"PRIDE_CET4":[{"w":"celebrated","pos":"adj.","zh":"著名的，备受赞扬的","eg":"Mei Lanfang, arguably the most celebrated Beijing opera artist of all time"},{"w":"expression","pos":"n.","zh":"表达，表示","eg":"Beijing opera is a beautiful form of artistic expression"},{"w":"rigorous","pos":"adj.","zh":"严谨的，严格的","eg":"his performance style was rigorous yet elegant"},{"w":"elegant","pos":"adj.","zh":"优雅的，雅致的","eg":"his performance style was rigorous yet elegant"},{"w":"loyalty","pos":"n.","zh":"忠诚，忠心","eg":"his loyalty to the nation"},{"w":"patriotism","pos":"n.","zh":"爱国主义，爱国精神","eg":"This bold act of patriotism earned him great respect"},{"w":"fame","pos":"n.","zh":"声誉，名望","eg":"bolstered his fame as an artist"},{"w":"innovate","pos":"v.","zh":"创新，革新","eg":"continuously innovating the old and bringing forth the new"}],"PRIDE_PHRASES":[{"p":"all over the world","zh":"全世界","eg":"succeeded in spreading the beauty of Chinese theater all over the world"},{"p":"at age eight","zh":"八岁时","eg":"Mei began training in Chinese opera skills at age eight"},{"p":"best-known for","zh":"以……闻名","eg":"Best-known for portraying female characters"},{"p":"as a response to","zh":"作为对……的回应","eg":"as a response to the Japanese who requested him to perform"},{"p":"rely on","zh":"依靠，依赖","eg":"he relied solely on pawning and selling his paintings"},{"p":"bring forth the new","zh":"推陈出新 / 创新","eg":"continuously innovating the old and bringing forth the new"},{"p":"cultural self-confidence","zh":"文化自信","eg":"a literary and art worker with a high degree of cultural self-confidence"}],"PRIDE_PATTERNS":[{"t":"not only ... but also ... 句型","frame":"not only ... but also ...","eg":"The preciousness of Mei Lanfang's art lay not only in his unique talent and hard work, but also in his loyalty to the nation.","zh":"连接两个并列成分，表示\"不仅……而且……\"。"},{"t":"as a response to 作状语","frame":"as a response to + 名词","eg":"Mei stopped singing and dancing ... as a response to the Japanese who requested him to perform.","zh":"表示\"作为对……的回应\"，说明动作的原因。"},{"t":"现在分词作伴随状语","frame":"v.-ing, ...","eg":"continuously innovating the old and bringing forth the new, he built a drama performance system with deep national characteristics","zh":"现在分词短语作伴随或方式状语，补充说明主句动作。"}],"GAP_ANSWERS":{"vf":["graduate","private","overtime","rewarding","on balance"],"chatting":["a career change","find it fulfilling","has offered me","take up the offer","making money"]},"QUESTIONS":{"vf":[{"q":"What is Nora going to be?","opts":["A nurse","A sales manager","An antique repairer"],"a":0,"why":"出处：对话 \"You're going to be a nurse, aren't you?\""},{"q":"Where does Nora consider working?","opts":["A community hospital or a private clinic","A secondary school","A travel agency"],"a":0,"why":"出处：对话 \"apply to work at a community hospital or a private clinic.\""},{"q":"Why does Nora also consider a community hospital?","opts":["To serve people at grass roots level","For higher pay","To work overtime"],"a":0,"why":"出处：对话 \"I'd get a chance to serve people at grass roots level.\""}],"chatting":[{"q":"What is Max considering?","opts":["A career change","A new house","Going abroad to study"],"a":0,"why":"出处：对话 \"I'm considering a career change.\""},{"q":"What job has a contact offered Max?","opts":["A teaching job in western China","A sales job","A food tasting job"],"a":0,"why":"出处：对话 \"A contact has offered me a teaching job in western China.\""},{"q":"What does Lucy say life is not just about?","opts":["Making money","Helping people","Traveling"],"a":0,"why":"出处：对话 \"Life's not just about making money.\""}]},"SP_GROUPS":[{"group":"Grammar Focus · Phrasal verbs（短语动词）","cards":[{"no":"1","title":"动词 + 介词（及物）","sent":"I came across an interesting book in the library.","zh":"我在图书馆偶然发现一本有趣的书。","items":[{"lb":"come across","df":"偶然遇见 / 发现","egs":[["I came across an interesting book.","我偶然发现一本有趣的书。"],["The audience broke into loud applause.","观众爆发出热烈的掌声。"]]}],"src":"课件 Grammar Focus · 短语动词(1)"},{"no":"2","title":"动词 + 副词","sent":"Have you handed in your homework already?","zh":"你已经交作业了吗？","items":[{"lb":"hand in","df":"交上，提交","egs":[["Have you handed in your homework?","你交作业了吗？"],["I always get up early.","我总是早起。"]]}],"src":"课件 Grammar Focus · 短语动词(2)"},{"no":"3","title":"动词 + 副词 + 介词","sent":"I'm really looking forward to our vacation.","zh":"我真的很期待我们的假期。","items":[{"lb":"look forward to","df":"期待","egs":[["I'm looking forward to our vacation.","我期待我们的假期。"],["She puts up with his bad temper.","她忍受他的坏脾气。"]]}],"src":"课件 Grammar Focus · 短语动词(3)"},{"no":"4","title":"动词 + 名词 + 介词（及物）","sent":"Don't worry about me. I can take care of myself.","zh":"别担心我，我能照顾好自己。","items":[{"lb":"take care of","df":"照顾，照料","egs":[["I can take care of myself.","我能照顾好自己。"],["You weren't paying attention to what I said.","你没注意听我说的话。"]]}],"src":"课件 Grammar Focus · 短语动词(4)"}]},{"group":"Reading · Language notes（课文长句解析）","cards":[{"no":"1","title":"ambitious（有雄心的）","sent":"I'm very ambitious—I really enjoy the challenge of meeting targets and trying to be the best.","zh":"我很有雄心壮志——完成目标并努力做到最好，我很享受这个挑战的过程。","items":[{"lb":"ambitious","df":"adj. 有抱负的，有雄心的","egs":[["Alfred was intensely ambitious.","艾尔弗雷德雄心勃勃。"]]}],"src":"课件 Reading · 语言解析①"},{"no":"2","title":"publisher（出版商）","sent":"we sent our travel journals and photographs to a publisher","zh":"我们把旅行日记和照片发给了一个出版商。","items":[{"lb":"publisher","df":"n. 出版商，出版社","egs":[["My father was the editor and publisher.","我父亲是编辑兼出版商。"]]}],"src":"课件 Reading · 语言解析②"},{"no":"3","title":"antique / component / repair（古董 / 零件 / 修理）","sent":"an antique clock consists of thousands of components and it can take several months to repair one.","zh":"一座古董钟包含上千个零件，修理好一座可能就需要几个月。","items":[{"lb":"antique","df":"n./adj. 古董（的）","egs":[["An antique vase was stolen.","昨晚一个古董花瓶被偷了。"]]},{"lb":"component","df":"n. 零件，组成部分","egs":[["electrical components for cars","汽车的电器部件"]]},{"lb":"repair","df":"v./n. 修理，修补","egs":[["Goldsmith has repaired the roof.","戈德史密斯修理了屋顶。"]]}],"src":"课件 Reading · 语言解析③-④"}]}]},"content":{"unit":{"title":"Career paths","zh":"职业路径","book":"New Era English for Careers · 用英语讲中国故事","source":"U4（VR版）_教学课件_202501.pptx"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u4-vocabulary-focus-exC.mp3","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["graduate","private","overtime","rewarding","on balance"],"gaps":[{"who":"Edward","html":"Hi, Nora. Nice to see you! By the way, how did your finals go?"},{"who":"Nora","html":"Hi, Edward. They went well, thanks. Now I'm ready to <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">!"},{"who":"Edward","html":"Congratulations!"},{"who":"Nora","html":"Thank you. Now I need to decide what to do."},{"who":"Edward","html":"You're going to be a nurse, aren't you?"},{"who":"Nora","html":"Yes, but choosing my workplace is the hard part. I can't decide whether to apply to work at a community hospital or a <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> clinic."},{"who":"Edward","html":"Your working conditions would be much better at a private clinic. The pay would be better too, especially if you worked <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">."},{"who":"Nora","html":"Yes, you are right. It seems the obvious choice in some ways. But I should maybe apply to work at a community hospital."},{"who":"Edward","html":"Why?"},{"who":"Nora","html":"Because in a community hospital I'd get a chance to serve people at grass roots level. I think that could be very <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> and I would also get more exercise."},{"who":"Edward","html":"Exactly! It's all up to you. Weigh up the pros and cons of each, and decide what is best <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\">."}],"script":[["Edward","Hi, Nora. Nice to see you! By the way, how did your finals go?"],["Nora","Hi, Edward. They went well, thanks. Now I'm ready to graduate!"],["Edward","Congratulations!"],["Nora","Thank you. Now I need to decide what to do."],["Edward","You're going to be a nurse, aren't you?"],["Nora","Yes, but choosing my workplace is the hard part. I can't decide whether to apply to work at a community hospital or a private clinic."],["Edward","Your working conditions would be much better at a private clinic. The pay would be better too, especially if you worked overtime."],["Nora","Yes, you are right. It seems the obvious choice in some ways. But I should maybe apply to work at a community hospital."],["Edward","Why?"],["Nora","Because in a community hospital I'd get a chance to serve people at grass roots level. I think that could be very rewarding and I would also get more exercise."],["Edward","Exactly! It's all up to you. Weigh up the pros and cons of each, and decide what is best on balance."]],"translation":[["Edward","你好，诺拉。很高兴见到你！对了，你的期末考试怎么样了？"],["Nora","你好，爱德华。我的期末考试很顺利，谢谢。现在我已经准备好毕业了！"],["Edward","恭喜！"],["Nora","谢谢你。现在我需要决定以后要做什么。"],["Edward","你会成为一名护士，对吗？"],["Nora","是的，但选择工作单位是一个难点。我无法决定是申请去社区医院工作还是去私人诊所工作。"],["Edward","去私人诊所的话工作环境会好很多。工资也会更高，尤其是在加班的时候。"],["Nora","是的，你说得没错。在某些方面看来，去私人诊所显然是更好的选择。但我也许应该申请去社区医院工作。"],["Edward","为什么？"],["Nora","因为在社区医院里，我有机会为基层人民服务。我认为这非常有意义，我也会得到更多的锻炼。"],["Edward","没错！一切取决于你。权衡一下二者的利弊，然后决定什么是最好的选择。"]],"note":"词库：graduate, private, overtime, rewarding, on balance。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Dream big","lead":"阅读三则职业梦想故事，了解不同人的职业路径与人生选择。","audio":"assets/audio/s2-u4-reading-passage.mp3","audioLabel":"课文原声 · Dream big"},"chatting":{"title":"Chatting · Listen and complete the conversation","lead":"听一段关于职业转变的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u4-chatting-listening.mp3","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["a career change","find it fulfilling","has offered me","take up the offer","making money"],"gaps":[{"who":"Lucy","html":"Hi, Max. How's your business these days?"},{"who":"Max","html":"Hi, Lucy. Actually, everything's fine, but I'm considering <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">."},{"who":"Lucy","html":"Really? I thought you loved your job."},{"who":"Max","html":"To be honest, I just don't <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> any more. It's time to do something different."},{"who":"Lucy","html":"What do you think you'll do instead?"},{"who":"Max","html":"A contact <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> a teaching job in western China."},{"who":"Lucy","html":"Sounds pretty good! What kind of school are you going to work at?"},{"who":"Max","html":"It's a secondary school in a small village."},{"who":"Lucy","html":"I think you'd find life there very different! Do you think you'll <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\">?"},{"who":"Max","html":"I think so. Over the years, I've learned so much about business. Now it's time to give something back to society and to help people who haven't had all the advantages that I have."},{"who":"Lucy","html":"I see what you mean. Life's not just about <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\">, is it?"},{"who":"Max","html":"Exactly. What about you?"},{"who":"Lucy","html":"Not very well. I haven't worked since I was dismissed two months ago."},{"who":"Max","html":"Every dog has its day."},{"who":"Lucy","html":"Thanks. I'm sure everything will work out."}],"script":[["Lucy","Hi, Max. How's your business these days?"],["Max","Hi, Lucy. Actually, everything's fine, but I'm considering a career change."],["Lucy","Really? I thought you loved your job."],["Max","To be honest, I just don't find it fulfilling any more. It's time to do something different."],["Lucy","What do you think you'll do instead?"],["Max","A contact has offered me a teaching job in western China."],["Lucy","Sounds pretty good! What kind of school are you going to work at?"],["Max","It's a secondary school in a small village."],["Lucy","I think you'd find life there very different! Do you think you'll take up the offer?"],["Max","I think so. Over the years, I've learned so much about business. Now it's time to give something back to society and to help people who haven't had all the advantages that I have."],["Lucy","I see what you mean. Life's not just about making money, is it?"],["Max","Exactly. What about you?"],["Lucy","Not very well. I haven't worked since I was dismissed two months ago."],["Max","Every dog has its day."],["Lucy","Thanks. I'm sure everything will work out."]],"translation":[["Lucy","你好，马克斯。最近工作怎么样？"],["Max","你好，露西。其实一切都很好，但我在考虑换工作。"],["Lucy","真的吗？我以为你很喜欢你的工作。"],["Max","说实话，我不能再从中得到成就感了。是时候做一些不同的事情了。"],["Lucy","那你要换什么工作呢？"],["Max","有人给我推荐了一份在中国西部支教的工作。"],["Lucy","听起来很不错啊！你要去什么样的学校工作？"],["Max","一个小村庄里的一所中学。"],["Lucy","我想你会发现那里的生活迥然不同！你会接下这个工作机会吗？"],["Max","我想我会的。这些年来，我从工作中学到了很多。现在是时候回馈社会，帮助那些弱势群体了。"],["Lucy","我明白你的意思了。生活不只是为了赚钱，对吧？"],["Max","没错。你怎么样？"],["Lucy","不是很好。自从两个月前被解雇以后，我就没再工作过。"],["Max","人人皆有得意日。"],["Lucy","谢谢。我相信一切都会好起来的。"]],"note":"词库：a career change, find it fulfilling, has offered me, take up the offer, making money。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · Beijing opera master Mei Lanfang","lead":"了解京剧大师梅兰芳的艺术人生与民族气节，感受中国传统文化的世界影响。","audio":"assets/audio/s2-u4-pride-of-china.mp3","audioLabel":"专题原声 · Mei Lanfang","note":"专题原文见 The Pride of China 部分（幻灯片 67–72），了解京剧大师梅兰芳的艺术人生与民族气节。"}}});
