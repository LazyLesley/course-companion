<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>课本阅览室 · 教材配套学习网站</title>
<style>
/* ========== 设计令牌：沿用参考页「复古档案 · 纸墨手稿」========== */
:root{
  --paper:#EFE7D4;
  --paper-2:#F6F0E3;
  --paper-3:#E5DAC3;
  --paper-dark:#D9CBAE;
  --ink:#2A2521;
  --ink-2:#5C5349;
  --ink-3:#8A7F71;
  --red:#A2382C;
  --red-soft:rgba(162,56,44,.12);
  --blue:#33506B;
  --blue-soft:rgba(51,80,107,.10);
  --gold:#B08A3E;
  --green:#4E6B4A;
  --green-soft:rgba(78,107,74,.12);
  --line:rgba(42,37,33,.16);
  --line-2:rgba(42,37,33,.28);
  --shadow:0 1px 2px rgba(42,37,33,.08), 0 8px 24px -14px rgba(42,37,33,.28);
  --shadow-lift:0 2px 4px rgba(42,37,33,.10), 0 16px 36px -18px rgba(42,37,33,.34);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.85;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 16% 10%,rgba(176,138,62,.055) 0%,transparent 42%),
    radial-gradient(circle at 84% 76%,rgba(162,56,44,.04) 0%,transparent 46%),
    repeating-linear-gradient(0deg,rgba(42,37,33,.016) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(42,37,33,.010) 0 1px,transparent 1px 4px);
  mix-blend-mode:multiply;
}
button,input{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
a{color:var(--red);text-decoration:none;}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.04em;line-height:1.4;}
p{margin:0 0 .9em;}
p:last-child{margin-bottom:0;}
.mono{font-family:var(--mono);}
.sans{font-family:var(--sans);}
.z{position:relative;z-index:2;}

/* ========== 顶部档案索引条 ========== */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(239,231,212,.94);backdrop-filter:blur(10px) saturate(1.2);
  border-bottom:1px solid var(--line-2);
}
.topbar-in{
  max-width:1320px;margin:0 auto;padding:0 28px;height:62px;
  display:flex;align-items:center;gap:18px;
}
.brand{font-weight:700;font-size:17px;letter-spacing:.14em;display:flex;align-items:center;gap:10px;white-space:nowrap;}
.brand .seal{
  width:27px;height:27px;border:1.6px solid var(--red);color:var(--red);
  display:grid;place-items:center;font-size:12px;border-radius:3px;transform:rotate(-4deg);
}
.brand small{font-family:var(--sans);font-size:10px;letter-spacing:.22em;color:var(--ink-3);display:block;margin-top:-3px;}
.term-switch{display:flex;gap:6px;margin-left:14px;}
.term-switch button{
  font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:transparent;
  border:1px solid transparent;border-radius:2px;padding:6px 12px;transition:.2s;
}
.term-switch button:hover{color:var(--red);background:var(--paper-2);}
.term-switch button.on{color:var(--red);border-color:var(--line-2);background:var(--paper-2);}
.top-meta{margin-left:auto;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;white-space:nowrap;}
.top-meta b{color:var(--red);font-family:var(--mono);}
/* 第二课堂入口（静态元素，不受 renderTop 重绘影响） */
.top-link{font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--red);background:var(--paper-2);border:1px solid var(--line-2);border-radius:2px;padding:6px 12px;text-decoration:none;white-space:nowrap;transition:.2s;}
.top-link:hover{background:var(--red);color:var(--paper-2);border-color:var(--red);}
.top-link span{font-size:11px;margin-left:5px;opacity:.75;}

/* ========== 布局 ========== */
.layout{max-width:1320px;margin:0 auto;padding:26px 28px 60px;display:grid;grid-template-columns:264px minmax(0,1fr);gap:30px;align-items:start;}
.sidebar{position:sticky;top:88px;}
.side-card{background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 16px 16px;}
.side-title{font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:var(--ink-3);margin-bottom:14px;}
.side-term{
  font-size:14px;font-weight:700;letter-spacing:.12em;padding:8px 10px;margin:0 -4px 8px;
  border-left:3px solid var(--gold);background:rgba(176,138,62,.08);display:flex;justify-content:space-between;align-items:center;
}
.side-term span{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:400;}
.unit-list{list-style:none;margin:0 0 18px;padding:0;}
.unit-list:last-of-type{margin-bottom:8px;}
.unit-btn{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:2px;
  padding:8px 9px;color:var(--ink-2);transition:.18s;
}
.unit-btn:hover{background:var(--paper-3);color:var(--ink);}
.unit-btn.on{background:var(--paper);border-color:var(--line-2);color:var(--ink);box-shadow:var(--shadow);}
.unit-btn .no{font-family:var(--mono);font-size:10.5px;color:var(--red);opacity:.8;flex:none;width:20px;}
.unit-btn .txt{min-width:0;flex:1;}
.unit-btn .en{display:block;font-family:var(--sans);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.unit-btn .zh{display:block;font-size:11px;color:var(--ink-3);line-height:1.4;}
.badge{font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;padding:2px 5px;border-radius:2px;flex:none;white-space:nowrap;}
.badge.ready{color:var(--red);background:var(--red-soft);border:1px solid rgba(162,56,44,.3);}
.badge.soon{color:var(--ink-3);border:1px solid var(--line);}
.side-note{font-family:var(--sans);font-size:11px;color:var(--ink-3);line-height:1.7;border-top:1px dashed var(--line-2);padding-top:12px;margin-top:6px;}

/* ========== 主区通用 ========== */
.crumbs{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:16px;}
.crumbs b{color:var(--ink-2);font-weight:400;}
.crumbs .sep{margin:0 8px;opacity:.5;}
.unit-head{position:relative;background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow);padding:28px 30px 24px;margin-bottom:22px;overflow:hidden;}
.unit-head::after{
  content:"";position:absolute;right:-30px;bottom:-46px;width:170px;height:170px;border:1px solid var(--line);border-radius:50%;opacity:.5;
}
.unit-head .eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:.32em;color:var(--red);margin-bottom:10px;}
.unit-head h1{font-size:clamp(28px,3.6vw,42px);letter-spacing:.02em;}
.unit-head h1 .num{font-family:var(--mono);font-size:.48em;color:var(--red);vertical-align:middle;margin-right:14px;letter-spacing:.02em;}
.unit-head .en-sub{font-family:var(--sans);font-size:12px;letter-spacing:.26em;color:var(--ink-3);margin-top:10px;}
.unit-head .stamp{
  position:absolute;top:22px;right:26px;border:2px solid var(--red);color:var(--red);
  padding:6px 10px;border-radius:4px;font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;
  transform:rotate(8deg);opacity:.85;font-weight:700;z-index:1;
}
.unit-head .head-meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);}
.unit-head .head-meta b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.04em;}

.module-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:22px;}
.mod-tab{
  text-align:left;background:rgba(246,240,227,.62);border:1px solid var(--line);border-left:3px solid transparent;
  padding:14px 16px 13px;color:var(--ink-2);transition:.2s;box-shadow:var(--shadow);
}
.mod-tab:hover{background:var(--paper-2);transform:translateY(-2px);box-shadow:var(--shadow-lift);}
.mod-tab.on{background:var(--paper-2);border-left-color:var(--red);color:var(--ink);box-shadow:var(--shadow-lift);}
.mod-tab .no{font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:.1em;display:block;margin-bottom:4px;}
.mod-tab .t{font-size:16px;font-weight:700;letter-spacing:.04em;display:block;}
.mod-tab .d{font-family:var(--sans);font-size:11px;color:var(--ink-3);display:block;margin-top:4px;line-height:1.5;}

.sec{margin-bottom:22px;}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;}
.sec-head .idx{font-family:var(--mono);font-size:11px;color:var(--red);letter-spacing:.08em;}
.sec-head h2{font-size:20px;letter-spacing:.08em;}
.sec-head .hint{font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-left:auto;}
.card{background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 24px;}
.card + .card{margin-top:14px;}
.plaque{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--red);padding:16px 20px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-2);}
.plaque .t{font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;color:var(--red);display:block;margin-bottom:7px;}
.plaque b{color:var(--ink);}
.chip{display:inline-block;font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;padding:2px 9px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2);background:rgba(255,255,255,.35);margin:0 5px 5px 0;}
.chip.red{border-color:var(--red);color:var(--red);background:var(--red-soft);}
.chip.blue{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
.chip.gold{border-color:var(--gold);color:#8a6a29;background:rgba(176,138,62,.12);}
.rule{height:1px;background:linear-gradient(90deg,var(--line-2),transparent 75%);margin:20px 0;}

/* 音频条 */
.audio-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.audio-row audio{height:38px;max-width:100%;}
.audio-label{font-family:var(--sans);font-size:12px;color:var(--ink-3);line-height:1.6;}
.audio-label b{display:block;font-family:var(--serif);font-size:14px;color:var(--ink);}

/* 对话稿 */
.dialogue{font-size:15px;line-height:2.05;}
.line{display:flex;gap:12px;margin-bottom:7px;align-items:baseline;}
.line .who{flex:none;width:62px;font-family:var(--sans);font-size:11.5px;color:var(--red);letter-spacing:.04em;}
.line .txt{flex:1;color:var(--ink);}
.line.alt .who{color:var(--blue);}
.zh-line{font-size:13.5px;color:var(--ink-2);line-height:1.95;}
.zh-line .who{flex:none;width:62px;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);}
.gap{
  display:inline-block;width:118px;border:none;border-bottom:1.5px solid var(--red);
  background:rgba(162,56,44,.06);color:var(--ink);font-family:var(--mono);font-size:12.5px;
  padding:1px 6px;margin:0 3px;text-align:center;outline:none;
}
.gap:focus{background:var(--red-soft);}
.gap.ok{background:var(--green-soft);border-bottom-color:var(--green);}
.gap.bad{background:var(--red-soft);border-bottom-color:var(--red);}
.gap::placeholder{color:var(--ink-3);opacity:.6;}

.btn{
  font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;padding:8px 16px;
  background:var(--paper-2);border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2);transition:.18s;
}
.btn:hover{border-color:var(--red);color:var(--red);background:#fff;}
.btn.primary{background:var(--red);border-color:var(--red);color:#F6F0E3;}
.btn.primary:hover{background:#8d3026;color:#fff;}
.btn.sm{padding:5px 11px;font-size:11.5px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;}
.fb-line{font-family:var(--sans);font-size:12.5px;margin-top:12px;display:none;}
.fb-line.show{display:block;}
.fb-line.ok{color:var(--green);}
.fb-line.bad{color:var(--red);}
details.ref{background:var(--paper-2);border:1px solid var(--line);padding:0 20px;margin-top:12px;}
details.ref summary{cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--blue);padding:12px 0;list-style:none;}
details.ref summary::-webkit-details-marker{display:none;}
details.ref summary::before{content:"▸ ";color:var(--red);}
details.ref[open] summary::before{content:"▾ ";}
details.ref .ref-body{border-top:1px dashed var(--line);padding:16px 0 18px;}

/* 词表 */
.table-wrap{overflow-x:auto;}
table.word-table{width:100%;border-collapse:collapse;font-size:14px;}
.word-table th{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);font-weight:400;
  text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line-2);white-space:nowrap;
}
.word-table td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.word-table tr:last-child td{border-bottom:none;}
.word-table tbody tr:hover{background:rgba(255,255,255,.34);}
.word-table .w-no{font-family:var(--mono);font-size:11px;color:var(--red);width:34px;}
.word-table .w-en{font-family:var(--sans);font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;}
.word-table .w-pos{font-family:var(--sans);font-size:11px;color:var(--ink-3);white-space:nowrap;}
.word-table .w-zh{color:var(--ink);min-width:130px;}
.word-table .w-eg{font-size:12.5px;color:var(--ink-2);line-height:1.7;min-width:230px;}
.word-table .w-eg i{display:block;color:var(--ink-3);font-style:normal;font-size:11.5px;}
.lv{font-family:var(--sans);font-size:10px;padding:1px 6px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-3);margin-left:6px;}
.lv.extra{border-color:var(--blue);color:var(--blue);}
.lv.over{border-color:var(--gold);color:#8a6a29;}

/* 理解题 */
.q-item{padding:15px 0;border-bottom:1px dashed var(--line);}
.q-item:last-child{border-bottom:none;padding-bottom:0;}
.q-item .q-t{font-size:14.5px;margin-bottom:10px;}
.q-item .q-t b{font-family:var(--mono);font-size:11px;color:var(--red);margin-right:8px;}
.opts{display:flex;gap:9px;flex-wrap:wrap;}
.opt{
  font-family:var(--sans);font-size:12.5px;text-align:left;padding:7px 13px;
  background:rgba(255,255,255,.42);border:1px solid var(--line);border-radius:2px;color:var(--ink-2);transition:.18s;
}
.opt:hover:not(:disabled){border-color:var(--blue);color:var(--blue);background:#fff;}
.opt:disabled{cursor:default;opacity:.72;}
.opt.correct{border-color:var(--green);color:var(--green);background:var(--green-soft);opacity:1;}
.opt.wrong{border-color:var(--red);color:var(--red);background:var(--red-soft);opacity:1;}
.q-fb{font-family:var(--sans);font-size:12px;margin-top:9px;display:none;}
.q-fb.show{display:block;}
.q-fb.ok{color:var(--green);}
.q-fb.bad{color:var(--red);}

/* 双栏 pros/cons */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.panel{background:rgba(255,255,255,.34);border:1px solid var(--line);padding:16px 18px;}
.panel h4{font-family:var(--sans);font-size:12.5px;letter-spacing:.12em;color:var(--red);margin-bottom:12px;}
.panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.9;}
.panel.con h4{color:var(--blue);}

/* 自测 */
.quiz{background:var(--paper-2);border:1px solid var(--line-2);box-shadow:var(--shadow);}
.quiz-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);}
.quiz-head .qt{font-size:16px;font-weight:700;letter-spacing:.06em;}
.quiz-head .qs{font-family:var(--sans);font-size:11px;color:var(--ink-3);}
.seg{display:flex;gap:0;margin-left:auto;border:1px solid var(--line-2);border-radius:2px;overflow:hidden;}
.seg button{font-family:var(--sans);font-size:12px;padding:7px 14px;background:transparent;border:none;color:var(--ink-2);}
.seg button + button{border-left:1px solid var(--line-2);}
.seg button.on{background:var(--red);color:#F6F0E3;}
.seg button:not(.on):hover{background:var(--paper-3);}
.quiz-body{padding:22px;}
.quiz-progress{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:18px;}
.quiz-progress .bar{flex:1;height:3px;background:var(--paper-dark);}
.quiz-progress .bar i{display:block;height:100%;background:var(--red);transition:width .3s;}
.quiz-q{font-size:19px;line-height:1.7;margin-bottom:6px;}
.quiz-q .lead{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--red);display:block;margin-bottom:10px;}
.quiz-sub{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-bottom:18px;}
.quiz-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.quiz-opt{
  font-family:var(--sans);font-size:15px;text-align:left;padding:12px 16px;
  background:rgba(255,255,255,.5);border:1px solid var(--line-2);border-radius:2px;color:var(--ink);transition:.18s;
}
.quiz-opt:hover:not(:disabled){border-color:var(--blue);background:#fff;transform:translateY(-1px);}
.quiz-opt:disabled{cursor:default;}
.quiz-opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700;}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.quiz-fb{margin-top:16px;padding:12px 16px;font-family:var(--sans);font-size:13px;border-left:3px solid var(--line-2);background:rgba(255,255,255,.4);display:none;}
.quiz-fb.show{display:block;}
.quiz-fb.ok{border-left-color:var(--green);color:var(--green);}
.quiz-fb.bad{border-left-color:var(--red);color:var(--red);}
.quiz-fb b{color:var(--ink);}
.quiz-foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.quiz-result{text-align:center;padding:10px 0 4px;}
.quiz-result .score{font-family:var(--mono);font-size:46px;color:var(--red);line-height:1.2;}
.quiz-result .score small{font-size:16px;color:var(--ink-3);}
.quiz-result h3{font-size:20px;margin:6px 0 12px;}
.quiz-result p{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);}
.wrong-words{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px;}

/* 占位 */
.placeholder{background:var(--paper-2);border:1px dashed var(--line-2);padding:38px 30px;text-align:center;}
.placeholder .ph-tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--red);margin-bottom:12px;}
.placeholder h3{font-size:22px;margin-bottom:10px;}
.placeholder p{font-family:var(--sans);font-size:13px;color:var(--ink-2);max-width:520px;margin:0 auto 8px;line-height:1.9;}
.placeholder .frame{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;}
.placeholder .frame div{border:1px solid var(--line);padding:12px 14px;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);background:rgba(255,255,255,.32);}
.placeholder .frame b{display:block;font-family:var(--serif);font-size:14px;color:var(--ink-2);margin-bottom:3px;}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-2);}
.pager button{font-family:var(--sans);font-size:12px;color:var(--blue);background:transparent;border:none;padding:6px 0;}
.pager button:hover{color:var(--red);}
.pager button:disabled{color:var(--ink-3);opacity:.5;cursor:default;}

      `“双11”购物狂欢的主要参与者是年轻的职场人群。许多受访者在调查中表示，他们会将自己购买到的商品的照片传到社交媒体上。23岁的胡玄玲表示，她期待在“双11”期间“晒”出自己的“战利品”，尤其是她以折扣价购买的热销产品。“那只会让这些超棒的商品看起来更好。”她说。`,
      `随着这一天越来越受欢迎，部分购物者甚至形成了自己的“血拼”套路。胡玄玲表示，她会与朋友们协同合作：“我和我的朋友们甚至有自己的策略，比如，我们会分组购买不同商品，保证每个人都能以很便宜的价格买到自己心仪的商品。非常有意思。”`,

      `同时，很多人已经意识到在购物时仔细考虑是非常重要的。由此，人们正在采取措施更明智地消费，避免购买太多东西，并且正在更看重质量而非数量。`

      {q:`3. Why do some shoppers use social media on November 11?`,o:['To post pictures of the food they have eaten.','To show pictures of what they have bought.','To send messages of thanks to shops.'],a:1,y:'课件 Exercise A 第 3 题答案 b：晒出所购商品。对应第 2 段 “posted photos of their purchases on social media.”'},
      {q:`4. What tactics do some shoppers use to get even more bargains?`,o:['They get together with friends and work as a team.','They borrow money from the bank on November 11th.','They don’t go to work that day.'],a:0,y:'课件 Exercise A 第 4 题答案 a：和朋友组队。对应第 3 段 “teaming up with her friends … splitting up into teams.”'},
      {q:`5. According to the writer, why will more cashless payments be made in China in the future?`,o:['People don’t like to carry money around with them.','People aren’t earning as much money as they did before.','More and more people are shopping online.'],a:2,y:'课件 Exercise A 第 5 题答案 c：网购越来越流行。对应第 4 段 “with online shopping becoming more and more popular.”'}
    ],

    /* —— Chatting 按表达功能积累句型（取自本单元听力对话与课件示例句）—— */
    PATTERNS: [
      {fn:'01 · 说明购物习惯与方式',frame:`I do a lot of my food shopping online.　·　We’re going to hire bicycles.`,ex:`It smells nice, but I have so little time that I’ve started to do a lot of my food shopping online. It’s convenient!`,zh:'先说习惯（线上/线下），再补一句理由（省时/方便），比干说“我喜欢网购”更具体。'},
      {fn:'02 · 比较价格与质量',frame:`A is more expensive than B, but …　·　the quality makes it worthwhile`,ex:`They’re more expensive than the supermarket, but the quality makes it worthwhile.`,zh:'用比较级把两边摆在一起，再用 but 转折补质量，是购物对话里最常用的结构。'},
      {fn:'03 · 表达偏好',frame:`I prefer to + 动词原形　·　I suppose (that) …`,ex:`I prefer to go to bricks-and-mortar stores. I suppose it’s good to see the food before you buy it.`,zh:'用 I prefer to … 说清立场，再用 I suppose … 补理由，立场+理由的框架和 U1 一致。'},
      {fn:'04 · 询问价格与看法',frame:`How about the (price)? Is it expensive?　·　What do Americans do to celebrate …?`,ex:`Oh! Really? How about the price? Is it expensive?`,zh:'用 How about …? 把话题引到具体维度（价格/方式），比直接问“你喜欢吗”更容易接话。'},
      {fn:'05 · 部分同意与转折',frame:`That does sound cheap, but …　·　Actually, not really!`,ex:`That does sound cheap, but I prefer to go to bricks-and-mortar stores. / Actually, not really! We don’t usually buy each other presents.`,zh:'先接住对方（That does sound cheap），再用 but / Actually 补自己的角度，语气自然不生硬。'},
      {fn:'06 · 表达惊讶',frame:`Oh! Really? I’m surprised!　·　I know it’s a big holiday, and I thought that meant shopping!`,ex:`Oh, I’m surprised! I know it’s a big holiday in America, and I thought that meant shopping!`,zh:'用 Oh! Really? / I’m surprised! 表达意外，再说出自己的预设，适合在对话里制造信息差。'},
      {fn:'07 · 说明节日意义',frame:`It’s more about + 动名词 / 名词`,ex:`It’s more about coming together with your family and enjoying food and quality time together.`,zh:'用 It’s more about … 把节日的“本质”说出来，比罗列活动更有层次。'},
      {fn:'08 · 收束与过渡',frame:`I guess + 从句　·　Right?`,ex:`I guess the food you’re talking about must be your traditional Thanksgiving dinner, right?`,zh:'用 I guess … 委婉确认，再接 right? 把话头抛回对方，保持对话流动。'}
    ],
    CHAT_TIPS: [
      `先听结构：听清对话里双方在比较什么（线上 vs 线下、价格 vs 质量、节日本质 vs 购物）。`,
      `抓填空线索：空格前后多是名词或介词短语，听时盯住备选词库（presents / food shopping / to celebrate）。`,
      `用比较句型：A is more expensive than B, but the quality makes it worthwhile，把两边摆在一起再转折。`,
      `表达偏好与惊讶：用 I prefer to … / Oh! Really? I’m surprised! 说清立场、制造信息差，不要只说 yes/no。`,
      `本页只做课前准备与句型积累；成对讨论、观点陈述与演示在课堂上完成。`
    ],

    /* —— The Pride of China · 中国茶（slide 86–92）—— */
    PRIDE_PASSAGE: [
      `Thousands of years ago, a leaf was brewed into a delicious drink. It is tea. China is the origin of tea. Here, tea isn’t just a drink. The spirit of tea, representing elegance, harmony and friendliness, is a vital part of Chinese culture.`,
      `Traveling with camels and sailing across the sea, tea has been taken to all over the world. The international trade of tea started as early as the Tang Dynasty. Tea linked people from different countries and backgrounds together. By integrating with different local customs, a variety of tea cultures were inspired. Today, thanks to international trade and e-commerce, tea is still one of the world’s best-selling goods. The latest trend among young people is Chinese-style milk tea, which offers a variety of unique ingredients like cream cheese and fruit. It has quickly gained popularity as a tasty new drink option and has also gone global.`,
      `This leaf has traveled a long way and continues to bloom, even today. According to the Food and Agriculture Organization (FAO) of the United Nations, tea is the world’s most consumed drink, only after water. In 2022, traditional tea processing techniques and associated social practices in China were added to the UNESCO list of intangible cultural heritage.`
    ],
    PRIDE_ZH: [
      `几千年前，一片叶子被煮制成一种美味的饮料。这就是茶。中国是茶的起源地。在这里，茶不仅仅是一种饮料。茶所代表的高雅、和谐和友善的精神，是中国文化中不可或缺的一部分。`,
      `随着大漠驼铃和海上扬帆，茶被带到了世界各地。茶叶国际贸易早在唐朝就已经开始。茶将来自不同国家和背景的人联系在一起。在与不同地方习俗的融合中，涌现出了各种各样的茶文化。如今，得益于国际贸易和电子商务，茶仍然是世界上最畅销的商品之一。最新的潮流是中式奶茶，它包含多种独特的配料，比如奶油奶酪和水果。奶茶作为一种美味饮品的新选择已迅速走红，并且走向全球。`,
      `这片叶子走过了漫长的旅程，直到今天依然繁盛。根据联合国粮农组织（FAO）的数据，茶是世界上消费量仅次于水的饮品。2022年，“中国传统制茶技艺及其相关习俗”被列入联合国教科文组织人类非物质文化遗产代表作名录。`
    ],
    PRIDE_CULTURE: `茶起源于中国，是中国最具代表性的文化符号之一。中国茶按发酵程度可分为绿茶、白茶、黄茶、青茶（乌龙茶）、红茶、黑茶六大类，以及再加工茶（如花茶）。唐代陆羽《茶经》系统总结了茶的栽培、制作与品饮，标志着茶文化的成熟。明清时期，茶叶成为海上丝绸之路与陆上丝绸之路的重要贸易商品，茶文化随之传播至日本、朝鲜半岛、东南亚及欧美，并与各地风俗融合，形成了诸如日本茶道、英式下午茶等丰富多彩的茶文化。2022年，“中国传统制茶技艺及其相关习俗”被列入联合国教科文组织人类非物质文化遗产代表作名录。`,

    /* —— 专题阅读理解小测（依据课件 slide 86–92 原文自拟，5 题单项选择）—— */
    PRIDE_QS: [
      {q:`What is tea in Chinese culture according to the passage?`,
       o:['Just a common daily drink.','A vital part representing elegance, harmony and friendliness.','Something only used in special ceremonies.'],a:1,
       y:'第 1 段：The spirit of tea, representing elegance, harmony and friendliness, is a vital part of Chinese culture.'},
      {q:`When did the international trade of tea start?`,
       o:['As early as the Tang Dynasty.','In the Ming Dynasty.','In modern times.'],a:0,
       y:'第 2 段：The international trade of tea started as early as the Tang Dynasty.'},
      {q:`What is the latest trend among young people mentioned in the passage?`,
       o:['Green tea.','Chinese-style milk tea with cream cheese and fruit.','Black tea.'],a:1,
       y:'第 2 段：The latest trend among young people is Chinese-style milk tea, which offers … cream cheese and fruit.'},
      {q:`According to the FAO, what is tea’s position among drinks worldwide?`,
       o:['The most consumed drink.','The most consumed, only after water.','A minor drink.'],a:1,
       y:'第 3 段：tea is the world’s most consumed drink, only after water.'},
      {q:`When were Chinese traditional tea processing techniques added to the UNESCO list?`,
       o:['In 2020.','In 2022.','In 2023.'],a:1,
       y:'第 3 段：In 2022, traditional tea processing techniques … were added to the UNESCO list of intangible cultural heritage.'}
    ],

      {t:'现在完成时表传播：has been taken to', frame:`主语 + has been taken to + 地点　强调动作对现在的影响`,

       zh:`随着大漠驼铃和海上扬帆，茶被带到了世界各地。`},

      `Ten days later, Bian Que visited the King and said, “Your disease has moved into your stomach. You must take action.” As before, the King ignored him. Another ten days later when Bian Que visited the King, he said nothing and went away. The King was surprised and sent a servant after him. Bian Que answered, “At first, the illness was only skin deep. Then it spread to the muscles and later to the internal organs. At that stage, I would still have been able to cure it. However, when the illness got into his bones, it was too late.” Five days later, the King felt pain all over his body and sent a servant for Bian Que. But Bian Que had escaped to the State of Qin. Soon after, the King died.`
    ],
    PRIDE_ZH: [
      `讳疾忌医。战国时，名医扁鹊拜访齐王，说：“陛下，您患病了，目前尚在病情早期。请在情况恶化之前进行治疗。”齐王笑了笑，说：“我很好。”十天后，扁鹊再次拜访齐王，说：“您的疾病已经扩散到肌肉了。您必须接受治疗。”和以前一样，齐王再次忽视了扁鹊的话。`,
      `又过了十天，扁鹊拜访齐王时，什么也没说就走了。齐王觉得很惊讶，派了一个仆人去追他。扁鹊答道：“起初，病症只是在皮肤上，然后扩散到了肌肉，后来到了内脏。在那个阶段，我尚且能治愈。然而，当病入骨髓时，就为时已晚。”五天后，齐王全身疼痛，派仆人去找扁鹊。但是扁鹊已经逃到了秦国。不久之后，齐王就去世了。`
    ],
    PRIDE_CULTURE: `扁鹊，战国时期医学家，中医脉诊法的创始人，游遍各地行医，尤精望诊与脉诊，《史记》《战国策》皆载其传记。成语“讳疾忌医”即源于此故事，比喻隐瞒疾病、不愿医治，也引申为掩饰缺点、不愿改正。与西方医学不同，中医（TCM）强调“治未病”与整体观念：穴位（acupoints）、针灸（acupuncture）、望闻问切（four diagnostic methods：inspection, listening and smelling, inquiry, palpation）是其特色诊疗手段；《本草纲目》（Compendium of Materia Medica）则是中药学的集大成之作。老子（Laozi）所著《道德经》开创道家（Daoism），主张自然、朴素与无为，与儒家强调礼仪秩序形成对照，深刻影响了中国的哲学、医学与艺术。`,

,"lv":"#","eg":"The workers were glorying in their new-found freedom.","egZh":"工人们因新获得的自由而无比喜悦。"},{"w":"sense","pos":"v.","zh":"检测并记录","lv":"","eg":"The equipment can sense the presence of toxic gases.","egZh":"该设备能检测出有毒气体。"},{"w":"capable of doing sth","pos":"phrase","zh":"有能力做某事","lv":"","eg":"She was perfectly capable of taking care of herself.","egZh":"她完全能照顾自己。"},{"w":"catch up on","pos":"phrase","zh":"赶做，补做","lv":"","eg":"Summer is the perfect time to catch up on the new books you meant to read.","egZh":"夏天是把想读却没读的新书恶补一下的最佳时机。"},{"w":"have a knock-on effect on sth","pos":"phrase","zh":"对某物引起连锁反应","lv":"","eg":"The bank’s decision will have a knock-on effect on interest rates.","egZh":"银行的决定会对利率产生连锁反应。"},{"w":"let sb down","pos":"phrase","zh":"使某人失望","lv":"","eg":"You let me down doing a thing like that.","egZh":"你做那样的事使我太失望了。"},{"w":"rely on","pos":"phrase","zh":"依靠，信赖","lv":"","eg":"We relied on computers to do this work.","egZh":"过去我们依赖电脑来做这项工作。"}],"GLOSS":{"input":{"w":"input","pos":"n.","zh":"投入","def":"ideas, advice, money, or effort put into a job or activity to help it succeed; also information put into a computer","eg":"I’d appreciate your input on this.","egZh":"我将感激你在这方面的投入。","src":"Reading · Words & Expressions"},"capable":{"w":"capable of doing sth","pos":"phrase","zh":"有能力做某事","def":"having the ability or power to do something","eg":"These are vehicles capable of sensing the environment.","egZh":"这些汽车能够感知环境。","src":"Reading · Words & Expressions"},"breed":{"w":"breed","pos":"n.","zh":"类型，种类","def":"a particular type or kind of something","eg":"this new breed of vehicle","egZh":"这种新型车辆","src":"Reading · Words & Expressions"},"knock-on":{"w":"have a knock-on effect on sth","pos":"phrase","zh":"对某物引起连锁反应","def":"cause a series of related effects on something","eg":"This will have a knock-on effect on the amount of traffic.","egZh":"这会对道路上的交通量产生连锁反应。","src":"Reading · Words & Expressions"},"rely":{"w":"rely on","pos":"phrase","zh":"依靠，信赖","def":"depend on with confidence","eg":"I think we rely too much on technology.","egZh":"我认为我们过于依赖技术。","src":"Reading · Words & Expressions"},"letdown":{"w":"let sb down","pos":"phrase","zh":"使某人失望","def":"fail to support or help someone when needed","eg":"Computers can let us down when we most need them.","egZh":"电脑会在我们最需要的时候让我们失望。","src":"Reading · Words & Expressions"},"fatal":{"w":"fatal","pos":"adj.","zh":"致命的，灾难性的","def":"resulting in death or causing failure","eg":"to avert a fatal accident","egZh":"避免致命事故","src":"Reading · Words & Expressions"},"newfound":{"w":"new-found","pos":"adj.","zh":"新获得的，新发现的","def":"recently obtained, found, or achieved","eg":"all the new-found hours of leisure","egZh":"所有新获得的休闲时光","src":"Reading · Words & Expressions"},"ln1":{"isNote":true,"w":"段② 长句 · 多形容词修饰顺序","sent":"Think of what I could use all these hours for: learning new languages, reading books or even catching up on sleep in a fashionable, comfortable driverless car!","zh":"想想看我能用这些时间做些什么：在一辆时尚、舒服的无人驾驶汽车里学习新语言，读书，甚至补充睡眠！","def":"多个形容词修饰同一名词时遵循 OSSCACOMP 顺序（观点→尺寸→形状→状态→年龄→颜色→产地→材料→用途），同类用逗号隔开。","points":["fashionable","comfortable","driverless"],"src":"Grammar Focus · The order of adjectives"}},"PASSAGE":[{"no":"①","text":"With the release of the Intelligent Vehicle Innovation & Development Strategy, we are creating a world where intelligent or driverless vehicles become the future of transportation. These are vehicles [[capable|capable of sensing the environment]] and driving themselves with little human [[input|input]]. What do you think about driverless cars? Are you ready for the new ride? Let me know your thoughts in the comment section."},{"no":"②","text":"Driverless cars can’t come fast enough! I really just can’t wait for driverless cars to become a reality. Do you know how long I spend driving per day in Beijing? About two hours. That means over the course of my lifetime, I spend more than 35,000 hours driving a car. What a waste of time! Think of what I could use all these hours for: learning new languages, reading books or even catching up on sleep in a [[ln1|fashionable, comfortable driverless car]]! Another great thing about driverless cars is that car sharing will become a reality with this new [[breed|breed of vehicle]], and this will have a [[knock-on|knock-on effect]] on the amount of traffic we see on our roads!"},{"no":"③","text":"An accident is waiting to happen! Well, I think that driverless cars are a terrible idea. They just seem so dangerous. I think we [[rely|rely too much on technology]], and we all know that computers can [[letdown|let us down]] when we most need them. So, what will happen if your car has glitches on the highway, driving at 80 kilometers per hour? Will passengers be prepared to do something to avert a [[fatal|fatal accident]]? Of course not! They’ll be too busy sleeping, reading, video-gaming, enjoying all the [[newfound|new-found hours of leisure]] promised to them by this technology."}],"PASSAGE_ZH":[{"no":"①","text":"随着《智能汽车创新发展战略》的发布，我们正在创造一个世界，在这个世界里，智能汽车或无人驾驶汽车将成为交通运输的未来。这些汽车能够感知环境，驾驶过程中几乎不需要人工投入。你如何看待无人驾驶汽车？你准备好迎接新旅程了吗？在评论区告诉我你的想法吧。"},{"no":"②","text":"萨莉：无人驾驶汽车来得还不够快！我真的等不及想要无人驾驶汽车成为现实。你知道我在北京每天在开车上花费多少时间吗？2个小时左右。这意味着我一生中有35,000多个小时都在开车。多浪费时间啊！想想我能用这些时间做些什么：在一辆时尚、舒适的无人驾驶汽车里学习新语言，读书，甚至补充睡眠！无人驾驶汽车的另一大优点是，这种汽车将使汽车共享成为现实，这会对我们如今道路上的交通量产生连锁反应。"},{"no":"③","text":"鲁思：势必会发生事故！我认为无人驾驶汽车是一个糟糕的想法。它们看起来太危险了。我认为人类过于依赖技术了，我们都知道，电脑总是在我们最需要的时候让我们失望。所以，当你的无人驾驶汽车以每小时80公里的速度行驶在公路上时，如果此时出现一些小故障，会发生什么呢？乘客能作好应对致命事故的准备吗？当然不能！他们将会忙着睡觉，阅读，玩电子游戏，忙着享受这项技术带给他们的新的休闲时光。"}],"READING_QS":[{"q":"According to Sally, how much time does she spend driving per day in Beijing?","o":["Less than one hour","About two hours","More than three hours"],"a":1,"y":"文中 Sally 明确说 \"About two hours\"，对应第33页判断题第1题判 F。"},{"q":"What does Sally think is another great thing about driverless cars?","o":["They will be cheaper to buy","Car sharing will become a reality","They will never break down"],"a":1,"y":"段落②提到 car sharing will become a reality with this new breed of vehicle。"},{"q":"What is Ruth’s attitude toward driverless cars?","o":["She supports them","She is worried they are dangerous","She thinks they are too slow"],"a":1,"y":"段落③ Ruth 认为 driverless cars are a terrible idea，且 seem so dangerous。"},{"q":"According to Ruth, what will passengers be doing when an accident happens?","o":["Sleeping, reading or gaming","Driving carefully","Calling for help"],"a":0,"y":"段落③ \"They’ll be too busy sleeping, reading, video-gaming...\"。"}],"PATTERNS":[{"fn":"01 · 比较两种选择","frame":"… are more environmentally friendly than …","ex":"They’re more environmentally friendly.","zh":"用于比较电动车与汽油车的优劣。"},{"fn":"02 · 表达个性化需求","frame":"I’d like something unique.","ex":"But Frank, electric cars look similar! I’d like something unique.","zh":"表达对产品外观或个性的偏好。"},{"fn":"03 · 用反问建议省钱","frame":"Wouldn’t you like to save some money?","ex":"Wouldn’t you like to save some money though, Anna?","zh":"用反问引导对方考虑成本。"},{"fn":"04 · 图表描述开头","frame":"It shows … around the world.","ex":"It shows energy consumption around the world.","zh":"描述图表时先总述内容。"},{"fn":"05 · 表达因果分析","frame":"This is probably due to …","ex":"This is probably due to the world’s growing population.","zh":"解释数据变化的原因。"}],"CHAT_TIPS":["听前先浏览题干中的空缺，预测所填词的词性（名词 / 动词 / 形容词 / 短语）。","注意口语中的连读与弱读，如 \"What’s wrong with\" 与 \"looking for\"。","对话里 wheels 是提喻（synecdoche），用部分代整体，指代 car。","\"electric cars are better for the planet\" 中 for the planet 意为\"对环境 / 地球更好\"。","听完后可对照脚本与译文，重点模仿 \"talked me into it\" 等口语搭配。"],"PRIDE_PASSAGE":[{"no":"①","text":"According to legend, Wan Hu, an official in the Ming Dynasty, decided to use China’s advanced power and fireworks technology to travel to outer space. He had a chair built with 47 flame rockets attached. One day, Wan Hu climbed into his rocket chair and held onto large kites. Despite the fact that this was very dangerous, no one could talk Wan Hu out of it. Although there was no aviation technology at the time, his design was very innovative. Therefore, he is regarded as the first person in the world to explore the universe."},{"no":"②","text":"Although Wan Hu failed because of explosion, the tale of his risky attempt to explore space has motivated many to pursue what was once believed to be impossible. As humankind makes progress with space exploration, it seems that Wan Hu’s dream has been fulfilled by others many years later. In the 1970s, the International Astronomical Union (IAU) named a lunar crater after Wan Hu to recognize his daring attempt at space travel. The story of Wan Hu suggests that space exploration began far earlier than we believe."}],"PRIDE_ZH":[{"no":"①","text":"相传，明朝官员万户决定利用中国先进的能源和烟花技术前往外太空。他制作了一把椅子，上面安装了47枚火箭。一天，万户爬上火箭椅，举着大风筝。尽管这样做非常危险，但没有人能劝万户放弃。虽然当时没有航空技术，但他的设计非常具有开创性。因此，他被誉为世界上第一个探索宇宙的人。"},{"no":"②","text":"虽然万户的实验因爆炸而失败，但他冒险探索太空的故事激励了许多人去追求曾经被认为是不可能的事。随着人类在太空探索方面的进步，万户的梦想似乎在多年后的今天被其他人实现了。20世纪70年代，国际天文学联合会（IAU）以万户的名字命名了一个月球环形山，以表彰他对太空旅行的大胆尝试。万户的故事说明，人类探索太空的时间远比我们认为的要早。"}],"PRIDE_CULTURE":"万户（Wan Hu）是中国明代（1368–1644）传说中试图借助火箭与风筝飞向太空的官员。尽管尝试以爆炸告终，但他的故事体现了中华民族勇于探索、敢为人先的精神。20世纪70年代，国际天文学联合会（IAU，1919年成立的天文学国际学术团体，中国天文学会于1935年加入）以万户之名命名月球环形山，使这一东方传奇被世界铭记。本单元以\"中国智造\"与\"探索精神\"呼应智能汽车主题，展现中国人从古代飞天梦到现代科技自立自强的延续。","PRIDE_QS":[{"q":"Who is Wan Hu regarded as?","o":["The first emperor to fly","The first person in the world to explore the universe","A famous Ming poet"],"a":1,"y":"段落① \"he is regarded as the first person in the world to explore the universe.\""},{"q":"Why did the IAU name a lunar crater after Wan Hu?","o":["To recognize his daring attempt at space travel","Because he succeeded in flying to space","To mark the invention of fireworks"],"a":0,"y":"段落② \"named a lunar crater after Wan Hu to recognize his daring attempt at space travel.\""},{"q":"What does the story of Wan Hu suggest?","o":["Space exploration is a modern idea","Space exploration began far earlier than we believe","Fireworks were invented in the 1970s"],"a":1,"y":"段落② \"The story of Wan Hu suggests that space exploration began far earlier than we believe.\""}],"PRIDE_CET4":[{"w":"advanced","pos":"adj.","zh":"先进的","eg":"China’s advanced power and fireworks technology"},{"w":"official","pos":"n.","zh":"官员","eg":"Wan Hu, an official in the Ming Dynasty"},{"w":"attach","pos":"v.","zh":"附上，安装","eg":"with 47 flame rockets attached"},{"w":"innovative","pos":"adj.","zh":"创新的，开创性的","eg":"his design was very innovative"},{"w":"explore","pos":"v.","zh":"探索","eg":"the first person in the world to explore the universe"},{"w":"fulfill","pos":"v.","zh":"实现","eg":"Wan Hu’s dream has been fulfilled by others"},{"w":"attempt","pos":"n.","zh":"尝试","eg":"his risky attempt to explore space"},{"w":"recognize","pos":"v.","zh":"认可，表彰","eg":"to recognize his daring attempt at space travel"},{"w":"crater","pos":"n.","zh":"环形山","eg":"named a lunar crater after Wan Hu"},{"w":"universe","pos":"n.","zh":"宇宙","eg":"explore the universe"}],"PRIDE_PHRASES":[{"p":"talk sb out of sth","zh":"说服某人不做某事","eg":"no one could talk Wan Hu out of it"},{"p":"be regarded as","zh":"被视为，被誉为","eg":"he is regarded as the first person to explore the universe"},{"p":"name A after B","zh":"以 B 的名字命名 A","eg":"named a lunar crater after Wan Hu"},{"p":"pursue what was once believed to be impossible","zh":"追求曾经被认为不可能的事","eg":"motivated many to pursue what was once believed to be impossible"},{"p":"in the 1970s","zh":"在20世纪70年代","eg":"In the 1970s, the IAU named a lunar crater after Wan Hu"}],"PRIDE_PATTERNS":[{"t":"让步状语从句 Although","frame":"Although + 从句, 主句","eg":"Although Wan Hu failed because of explosion, the tale … has motivated many …","zh":"用 although 引出让步，强调转折后的结果。"},{"t":"被动结构 be regarded as","frame":"主语 + be regarded as + 名词","eg":"he is regarded as the first person in the world to explore the universe","zh":"表达\"被视为 / 被誉为\"。"},{"t":"name A after B","frame":"name + 宾语 + after + 人名","eg":"the IAU named a lunar crater after Wan Hu","zh":"表示\"以……的名字命名\"。"}],"GAP_ANSWERS":{"vf":["For Sale","practical","second-hand","fortune","barely","test drive"],"chatting":["wrong","looking for","for the planet"]},"QUESTIONS":{"vf":[{"q":"What is Natalie selling?","opts":["A new electric car","Her SUV with a \"For Sale\" sticker","A highway test service"],"a":1,"why":"对话开头 Sam 说看到 SUV 上贴着 \"For Sale\" 标签，Natalie 确认出售。"},{"q":"Why does Natalie want to sell the SUV?","opts":["It is too old to run","It is not practical for her now","She wants to buy a fortune"],"a":1,"why":"Natalie 说 \"It just isn’t practical for me to run it now as I live near my company.\""},{"q":"What does Sam want to buy?","opts":["A reliable second-hand SUV","A brand-new car","A test drive only"],"a":0,"why":"Sam 说 \"I want to buy a second-hand SUV … something reliable\"。"},{"q":"Which word fills gap (4)?","opts":["fortune","highway","mileage"],"a":0,"why":"原句 \"isn’t going to cost me a fortune in repair bills\"，搭配 cost a fortune。"}],"chatting":[{"q":"What’s wrong with Dan’s current car?","opts":["It is not energy-efficient","It is too big","It has no GPS"],"a":0,"why":"Dan 说 \"It’s not very energy-efficient.\""},{"q":"What kind of car is Dan considering?","opts":["A gas car","An electric one","A driverless car"],"a":1,"why":"Dan 说 \"I wondered about getting an electric one.\""},{"q":"What does Molly finally agree to do?","opts":["Sell her car","Go and have a look at electric cars","Buy a gas car"],"a":1,"why":"Molly 说 \"OK, you’ve talked me into it! Shall we go and have a look?\""}]},"SP_GROUPS":[{"group":"Grammar Focus · The order of adjectives (形容词顺序)","cards":[{"no":"1","title":"OSSCACOMP 形容词顺序","sent":"Think of what I could use all these hours for … in a fashionable, comfortable driverless car!","zh":"多个形容词修饰名词时按 观点→尺寸→形状→状态→年龄→颜色→产地→材料→用途 排列，同类用逗号隔开。","items":[{"lb":"Opinion 观点","df":"对事物的主观评价","egs":[["fashionable, comfortable driverless car","时尚、舒适的无人驾驶汽车"],["a nice young woman","友善的年轻女人"]]},{"lb":"Size / Shape 尺寸 / 形状","df":"大小与外形","egs":[["a big gray woolen sweater","大码的灰色羊毛毛衣"],["beautiful green mountains","美丽的青山"]]},{"lb":"Material 材料","df":"制作材料","egs":[["a little white wooden house","白色的小木屋"],["Italian metal sports car","意大利金属跑车"]]}],"src":"Grammar Focus · The order of adjectives"}]},{"group":"Language notes · 课文长句与短语 (Reading)","cards":[{"no":"1","title":"input / capable of","sent":"These are vehicles capable of sensing the environment and driving themselves with little human input.","zh":"这些汽车能够感知环境，驾驶过程中几乎不需要人工投入。","items":[{"lb":"input n.","df":"投入（意见 / 资金 / 努力）或计算机输入","egs":[["I’d appreciate your input on this.","我将感激你在这方面的投入。"]]},{"lb":"capable of doing sth","df":"有能力做某事","egs":[["capable of sensing the environment","能够感知环境"]]}],"src":"Reading · Words & Expressions"},{"no":"2","title":"rely on / let sb down / knock-on effect","sent":"… we rely too much on technology … this will have a knock-on effect on the amount of traffic …","zh":"我们过于依赖技术……这会对交通量产生连锁反应。","items":[{"lb":"rely on","df":"依靠，信赖","egs":[["We relied on computers to do this work.","我们依赖电脑来做这项工作。"]]},{"lb":"let sb down","df":"使某人失望","egs":[["computers can let us down","电脑会让我们失望"]]},{"lb":"have a knock-on effect on sth","df":"对某物引起连锁反应","egs":[["have a knock-on effect on the economy","对经济产生连锁反应"]]}],"src":"Reading · Words & Expressions"},{"no":"3","title":"fatal / new-found / glitch","sent":"Will passengers be prepared to do something to avert a fatal accident? … enjoying all the new-found hours of leisure …","zh":"乘客能作好应对致命事故的准备吗？……享受新获得的休闲时光……","items":[{"lb":"fatal adj.","df":"致命的，灾难性的","egs":[["a fatal flaw in the plan","计划中的致命缺陷"]]},{"lb":"new-found adj.","df":"新获得的，新发现的","egs":[["enjoy new-found freedom","享受新获得的自由"]]},{"lb":"glitch n.","df":"小故障，小毛病","egs":[["Manufacturing glitches limited output","生产故障影响了产量"]]}],"src":"Reading · Words & Expressions"}]}]},"content":{"unit":{"title":"Intelligent Vehicles","zh":"智能汽车","book":"New Era English for Careers · 用英语讲中国故事","source":"上学期 U5_教学课件_VR版（新版）"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段二手车买卖对话，补全空缺，再核对对话理解。","audio":"assets/audio/u5-vocabulary-focus-exC.mp3","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["For Sale","practical","second-hand","fortune","barely","test drive"],"gaps":[{"who":"Sam","html":"Hey, Natalie. I noticed your SUV has a \"<input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">\" sticker on it."},{"who":"Natalie","html":"Yeah, that’s right. Are you interested?"},{"who":"Sam","html":"Sure! It looks nice."},{"who":"Natalie","html":"It’s a great SUV, and I hesitated before putting it up for sale. It just isn’t <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> for me to run it now as I live near my company."},{"who":"Sam","html":"Well, I want to buy a <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> SUV. I’d like something reliable that isn’t going to cost me a <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> in repair bills."},{"who":"Natalie","html":"Well, this SUV runs pretty well. It’s <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> two years old, and the mileage is low."},{"who":"Sam","html":"Can I take it for a <input class=\"gap\" data-gap=\"6\" placeholder=\"(6)\" autocomplete=\"off\">?"},{"who":"Natalie","html":"Sure! Let’s go for a drive on the highway."}],"script":[["Sam","Hey, Natalie. I noticed your SUV has a \"For Sale\" sticker on it."],["Natalie","Yeah, that’s right. Are you interested?"],["Sam","Sure! It looks nice."],["Natalie","It’s a great SUV, and I hesitated before putting it up for sale. It just isn’t practical for me to run it now as I live near my company."],["Sam","Well, I want to buy a second-hand SUV. I’d like something reliable that isn’t going to cost me a fortune in repair bills."],["Natalie","Well, this SUV runs pretty well. It’s barely two years old, and the mileage is low."],["Sam","Can I take it for a test drive?"],["Natalie","Sure! Let’s go for a drive on the highway."]],"translation":[["萨 window.__PENDING_UNITS.push({"id":"s2-u1","readyNo":1,"data":{"WORDS":[{"w":"access","pos":"n.","zh":"进入权，使用权","lv":"","eg":"You need a password to get access to the computer system.","egZh":"进入这个计算机系统需要密码。"},{"w":"benefit","pos":"n.","zh":"（常用复数）福利；补贴","lv":"","eg":"The benefits include free health insurance.","egZh":"福利包括免费的健康保险。"},{"w":"dentist","pos":"n.","zh":"牙科医生","lv":"","eg":"I need to go to see the dentist.","egZh":"我需要去看牙医。"},{"w":"gym","pos":"n.","zh":"体育馆，健身房","lv":"","eg":"I work out at the gym most days.","egZh":"我多数日子都在健身俱乐部锻炼身体。"},{"w":"insurance","pos":"n.","zh":"保险","lv":"","eg":"Can you claim for the loss on your insurance?","egZh":"你能向你投保的公司要求赔偿这一损失吗？"},{"w":"salary","pos":"n.","zh":"（通常按月发的）薪水，工资","lv":"","eg":"She earns a high salary.","egZh":"她工资很高。"},{"w":"secretary","pos":"n.","zh":"秘书","lv":"","eg":"Make another appointment with the secretary.","egZh":"同秘书再预约一次吧。"},{"w":"vacation","pos":"n.","zh":"假期；休假","lv":"","eg":"She is on vacation with her family in Paris.","egZh":"她和家人正在巴黎度假。"},{"w":"bug","pos":"n.","zh":"故障；毛病","lv":"","eg":"There is a bug in this software.","egZh":"这个软件有故障。"},{"w":"collect","pos":"v.","zh":"收集；采集","lv":"","eg":"Tom likes to collect stamps.","egZh":"汤姆喜欢集邮。"},{"w":"definite","pos":"adj.","zh":"清楚的，明确的","lv":"","eg":"Can you give me a definite answer by tomorrow?","egZh":"你最晚明天能给我一个确定的答复吗？"},{"w":"discipline","pos":"n.","zh":"专业，科目","lv":"","eg":"Engineering and technology are disciplines distinct from one another and from science.","egZh":"工程学和工艺学互不相同，也有别于自然学科。"},{"w":"diver","pos":"n.","zh":"潜水员；潜水者","lv":"","eg":"He is a deep-sea diver.","egZh":"他是一名深海潜水员。"},{"w":"ethical","pos":"adj.","zh":"合乎道德的；道德上正确的","lv":"","eg":"Is it ethical to promote cigarettes through advertising?","egZh":"利用广告推销香烟合乎道德吗？"},{"w":"hacker","pos":"n.","zh":"（计算机）黑客","lv":"","eg":"A hacker had managed to get into the system.","egZh":"一个黑客侵入了系统。"},{"w":"plus","pos":"n.","zh":"有利因素（条件）","lv":"","eg":"Experience of any career in sales is a big plus.","egZh":"任何销售领域的工作经验都是一大优势。"},{"w":"remove","pos":"v.","zh":"消除；除掉","lv":"","eg":"Three children were removed from the school for persistent bad behavior.","egZh":"三个孩子因持续行为不检被学校开除。"},{"w":"sculptor","pos":"n.","zh":"雕刻家；雕塑家","lv":"","eg":"He is one of the best known sculptors.","egZh":"他是最著名的雕刻家之一。"},{"w":"sculpture","pos":"n.","zh":"雕塑；雕像","lv":"","eg":"There are many famous sculptures in this city.","egZh":"这座城市里有许多著名的雕像。"},{"w":"unusual","pos":"adj.","zh":"不寻常的","lv":"","eg":"She has a very unusual name.","egZh":"她的名字很不寻常。"},{"w":"pick up","pos":"phrase","zh":"捡起；拿起","lv":"","eg":"As she picked up the envelope, a key dropped out.","egZh":"她捡起信封时，一把钥匙掉了出来。"},{"w":"focused","pos":"adj.","zh":"集中注意力的，聚精会神的","lv":"#","eg":"I suppose you need to be very focused.","egZh":"我想你需要很专注。"},{"w":"prepared","pos":"adj.","zh":"有准备的","lv":"#","eg":"I need to be well prepared.","egZh":"我需要做好充分的准备。"},{"w":"tiring","pos":"adj.","zh":"令人困倦的，令人疲劳的","lv":"#","eg":"It's tiring and the hours are long.","egZh":"做导游很累，工作时间也很长。"},{"w":"typical","pos":"adj.","zh":"一贯的，平常的","lv":"","eg":"Every day is a little different, not typical.","egZh":"每天都有点不同，并不平常。"},{"w":"place of interest","pos":"phrase","zh":"风景名胜","lv":"","eg":"show my group places of interest","egZh":"带我的团队参观风景名胜"},{"w":"tour guide","pos":"n.","zh":"导游","lv":"","eg":"How's life as a tour guide?","egZh":"当导游感觉如何？"},{"w":"apply for","pos":"phrase","zh":"申请","lv":"","eg":"I am writing to apply for the position.","egZh":"我写信申请这个职位。"},{"w":"artificial intelligence","pos":"n.","zh":"人工智能","lv":"","eg":"It's related to my major in artificial intelligence.","egZh":"它和我学的人工智能专业相关。"},{"w":"be dedicated to","pos":"phrase","zh":"致力于","lv":"","eg":"an organization dedicated to environmental protection","egZh":"一个致力于环保的组织"},{"w":"characteristic","pos":"n.","zh":"特色，特征","lv":"","eg":"the cultural characteristics of each region","egZh":"各地区的文化特色"},{"w":"developer","pos":"n.","zh":"开发者","lv":"","eg":"I applied for a developer position.","egZh":"我申请了开发岗。"},{"w":"diversity","pos":"n.","zh":"多样性，多元化","lv":"","eg":"the diversity of Chinese regional culture","egZh":"中国地域文化的多样性"},{"w":"gain","pos":"v.","zh":"获得","lv":"","eg":"I should gain a lot of practical work experience.","egZh":"我应该能获得不少实际工作经验。"},{"w":"gaming company","pos":"n.","zh":"游戏公司","lv":"","eg":"I sent my résumé to a gaming company.","egZh":"我给一家游戏公司投了简历。"},{"w":"insight","pos":"n.","zh":"洞察力，领悟","lv":"","eg":"It will give me insight into the culture.","egZh":"这有助于我了解这种文化。"},{"w":"internship","pos":"n.","zh":"实习","lv":"","eg":"Have you been looking for an internship lately?","egZh":"你最近在找实习吗？"},{"w":"involve","pos":"v.","zh":"涉及，包括","lv":"","eg":"What does the job involve?","egZh":"这份工作具体有什么内容？"},{"w":"lately","pos":"adv.","zh":"最近","lv":"","eg":"Have you been looking for an internship lately?","egZh":"你最近在找实习吗？"},{"w":"position","pos":"n.","zh":"职位，岗位","lv":"","eg":"What position did you apply for?","egZh":"你申请了什么岗位？"},{"w":"practical","pos":"adj.","zh":"实用的","lv":"","eg":"a lot of practical work experience","egZh":"不少实际工作经验"},{"w":"region","pos":"n.","zh":"区域","lv":"","eg":"environmental projects in different regions","egZh":"不同地区的环保项目"},{"w":"résumé","pos":"n.","zh":"简历","lv":"","eg":"I just sent my résumé to a gaming company.","egZh":"我刚给一家游戏公司投了简历。"},{"w":"satisfaction","pos":"n.","zh":"满足","lv":"","eg":"gaining knowledge, satisfaction, and a sense of life values","egZh":"获得知识、满足感和人生价值感"},{"w":"voluntary","pos":"adj.","zh":"志愿的","lv":"","eg":"They mainly do voluntary environmental work.","egZh":"他们主要做一些志愿环保工作。"},{"w":"worthwhile","pos":"adj.","zh":"有价值的，值得做的","lv":"","eg":"That sounds worthwhile.","egZh":"那很有意义。"}],"GLOSS":{"unusual":{"w":"unusual","pos":"adj.","zh":"不寻常的","def":"此处用于 something unusual 表示\"与众不同的事情\"，形容词修饰不定代词时后置。","eg":"She has a very unusual name.","egZh":"她的名字很不寻常。","src":"Reading · Words & Expressions"},"ethical":{"w":"ethical","pos":"adj.","zh":"合乎道德的；道德上正确的","def":"ethical hacker 指\"道德黑客\"，即以合法、正当方式运用黑客技术帮助企业的安全人员。","eg":"Is it ethical to promote cigarettes through advertising?","egZh":"利用广告推销香烟合乎道德吗？","src":"Reading · Words & Expressions"},"salary":{"w":"salary","pos":"n.","zh":"（通常按月发的）薪水，工资","def":"earn a salary of up to 200,000 dollars a year 年薪高达 20 万美元。","eg":"She earns a high salary.","egZh":"她工资很高。","src":"Vocabulary Focus · Words & Expressions"},"getinto":{"w":"get into","pos":"phrase","zh":"进入；陷入","def":"此处指\"进入（电脑系统）\"。","eg":"Ethical hackers get into the computer systems of companies.","egZh":"道德黑客会进入公司的电脑系统。","src":"Reading · 拓展词汇"},"remove":{"w":"remove","pos":"v.","zh":"消除；除掉","def":"remove bugs 清除（系统中的）故障。","eg":"help companies find and remove bugs in their computer systems","egZh":"帮助公司找到并清除计算机系统中的故障","src":"Reading · Words & Expressions"},"bug":{"w":"bug","pos":"n.","zh":"故障；毛病","def":"计算机术语，指程序缺陷或系统故障。","eg":"There is a bug in this software.","egZh":"这个软件有故障。","src":"Reading · Words & Expressions"},"plus":{"w":"plus","pos":"n.","zh":"有利因素（条件）","def":"a degree in computer science is a plus 拥有计算机科学学位是一个加分项。","eg":"Experience of any career in sales is a big plus.","egZh":"任何销售领域的工作经验都是一大优势。","src":"Reading · Words & Expressions"},"definite":{"w":"definite","pos":"adj.","zh":"清楚的，明确的","def":"a definite advantage 明显 / 绝对的优势。","eg":"Diving experience is a definite advantage.","egZh":"潜水经验是一个绝对的优势。","src":"Reading · Words & Expressions"},"discipline":{"w":"discipline","pos":"n.","zh":"专业，科目","def":"an artistic discipline 艺术学科。","eg":"A background in an artistic discipline will also be an advantage.","egZh":"有艺术学科的背景也会是一个优势。","src":"Reading · Words & Expressions"},"pickup":{"w":"pick up","pos":"phrase","zh":"捡起；拿起","def":"此处指\"捡（高尔夫球）\"。","eg":"A diver who picks up golf balls from water...","egZh":"一个从水里捡高尔夫球的潜水员……","src":"Reading · Words & Expressions"},"morethan":{"w":"more than","pos":"phrase","zh":"超过","def":"表示数量\"超过、多于\"。","eg":"They could earn more than 100,000 dollars a year.","egZh":"他们一年的收入可以超过 10 万美元。","src":"Reading · 语言解析"},"ln1":{"isNote":true,"w":"段① 语言点 · something unusual","sent":"How about trying something unusual?","zh":"尝试一些不寻常的工作怎么样？","def":"形容词修饰不定代词（something / anything / nothing 等）时要后置。","points":["something unusual","形容词后置"],"src":"Reading · 语言解析 1"},"ln2":{"isNote":true,"w":"段① 语言点 · It is + adj. + to do","sent":"Is it possible to be a hacker and an honest person at the same time?","zh":"一个人是否可以在做黑客的同时也是一个诚实的人？","def":"It is + adj. + to do sth 中 It 是形式主语，to do 是真实主语；at the same time 意为\"同时\"。","points":["It is possible to do","at the same time"],"src":"Reading · 语言解析 2"},"ln3":{"isNote":true,"w":"段① 语言点 · be interested in / a plus","sent":"If you're interested in a career as an ethical hacker, a degree in computer science is a plus.","zh":"如果你对道德黑客这个职业感兴趣，拥有计算机科学学位是一个加分项。","def":"be interested in 对……感兴趣；a plus 有利因素 / 加分项。","points":["be interested in","a plus"],"src":"Reading · 语言解析 3"},"ln4":{"isNote":true,"w":"段② 语言点 · pick up / per week","sent":"A diver who picks up golf balls from water typically works four days per week, and collects about 4,000 balls per day.","zh":"一个从水里捡高尔夫球的潜水员通常每周工作四天，每天捡大约 4,000 个球。","def":"pick up 捡起；per week 每周（= a week）。","points":["pick up","per week"],"src":"Reading · 语言解析 4"},"ln5":{"isNote":true,"w":"段② 语言点 · more than","sent":"They could earn more than 100,000 dollars a year.","zh":"他们一年的收入可以超过 10 万美元。","def":"more than 超过、多于。","points":["more than"],"src":"Reading · 语言解析 5"},"ln6":{"isNote":true,"w":"段③ 语言点 · try doing","sent":"If you love art and food, maybe you should try the job of making sculptures out of cheese.","zh":"如果你喜欢艺术，也喜欢食物，或许你应该尝试用奶酪制作雕塑的工作。","def":"try doing 尝试做……（强调试试看）。","points":["try doing"],"src":"Reading · 语言解析 6"}},"PASSAGE":[{"no":"①","text":"What career will you choose when you finish college? [[ln1|How about trying something unusual]]? Here are three jobs which may give you something interesting to talk about at parties!\n\nEthical hacker\n[[ln2|Is it possible to be a hacker and an honest person at the same time]]? Yes, it is. If you [[ethical|pursue a career as an ethical hacker]], you have to put your knowledge of computer systems to good use. You'll work in an office and earn a [[salary|salary]] of up to 200,000 dollars a year. Ethical hackers [[getinto|get into]] the computer systems of companies just as real hackers do. The difference is that you'll help companies find and [[remove|remove]] [[bug|bugs]] in their computer systems. [[ln3|If you're interested in a career as an ethical hacker, a degree in computer science is a plus]]."},{"no":"②","text":"Golf ball diver\nPicking up golf balls sounds like dirty and tiring work. [[ln4|A diver who picks up golf balls from water typically works four days per week, and collects about 4,000 balls per day]]. [[ln5|They could earn more than 100,000 dollars a year]]. Diving experience is a [[definite|definite]] advantage if you're looking for a career in golf ball diving. You should also be prepared to deal with the occasional fierce creature of the deep. In Florida, for example, golf ball divers may have to deal with alligators!"},{"no":"③","text":"Cheese sculptor\n[[ln6|If you love art and food, maybe you should try the job of making sculptures out of cheese]]. Food-based sculptures are becoming very popular at weddings and parties nowadays. And if you get hungry while you work, food is never far away. If this sounds like your dream job, you'll need to be creative and good with your hands. A background in an artistic [[discipline|discipline]] will also be an advantage."}],"PASSAGE_ZH":[{"no":"①","text":"大学毕业后，你会选择什么职业？尝试一些不寻常的工作怎么样？这里有三份工作，可能会让你在聚会上有一些有趣的话题可聊！\n\n道德黑客\n一个人是否可以在做黑客的同时也是一个诚实的人？是可以的。如果你从事道德黑客的职业，你必须充分利用你的计算机系统知识。你会在办公室工作，并收获高达 20 万美元的年薪。道德黑客和真正的黑客一样，要进入公司的电脑系统。不同的是，你要帮助公司找到并清除计算机系统中的故障。如果你对道德黑客这个职业感兴趣，拥有计算机科学学位是一个加分项。"},{"no":"②","text":"高尔夫球潜水员\n捡高尔夫球听起来是个又脏又累的工作。一个从水里捡高尔夫球的潜水员通常每周工作四天，每天捡大约 4,000 个球。他们一年的收入可以超过 10 万美元。如果你想成为一名高尔夫球潜水员，拥有潜水经验是一个绝对的优势。你还得有能力应对偶尔出现的深水猛兽。比如，在佛罗里达州，高尔夫球潜水员可能要与短吻鳄打交道！"},{"no":"③","text":"奶酪雕塑师\n如果你喜欢艺术，也喜欢食物，或许你应该尝试用奶酪制作雕塑的工作。如今，以食物为基础的雕塑在婚礼和派对上变得非常流行。而且，如果你在工作的时候饿了，食物永远就在不远处。如果你觉得这是你梦想中的工作，你就需要有创意和良好的动手能力。有艺术学科的背景对于这份工作也会是一个优势。"}],"READING_QS":[{"q":"According to the text, what do real hackers and ethical hackers have in common?","o":["They both work in offices.","They both get into the computer systems of companies.","They both earn high salaries."],"a":1,"y":"原文：Ethical hackers get into the computer systems of companies just as real hackers do."},{"q":"Does an ethical hacker need a certain type of qualification?","o":["Yes, always.","No, never.","Sometimes but not always."],"a":2,"y":"原文提到 a degree in computer science is a plus（加分项），并非硬性必需，故选 Sometimes but not always。"},{"q":"If you want to be a golf ball diver, __________ is a plus.","o":["diving experience","a degree in computer science","a background in an artistic discipline"],"a":0,"y":"原文：Diving experience is a definite advantage if you're looking for a career in golf ball diving."},{"q":"What is dangerous about a golf ball diver's job?","o":["Underwater creatures.","The water is sometimes not deep enough to dive safely.","You risk getting too cold after spending hours outside underwater."],"a":0,"y":"原文提到要应对 alligators（短吻鳄）等深水猛兽，指水下生物的危险。"},{"q":"Where is a cheese sculptor likely to work?","o":["At an art school or art college.","At weddings or parties.","At a dairy farm."],"a":1,"y":"原文：Food-based sculptures are becoming very popular at weddings and parties."},{"q":"According to the text, what is the main perk of the cheese sculptor's job?","o":["The high salary and working conditions.","You're never too far away from food.","The chance to travel and meet interesting people."],"a":1,"y":"原文：if you get hungry while you work, food is never far away."}],"PATTERNS":[{"fn":"01 · 询问职业近况","frame":"How's life as a ...?","ex":"How's life as a tour guide?","zh":"用于询问对方从事某职业的生活 / 工作情况。"},{"fn":"02 · 表达日常状态","frame":"Every day is a little different.","ex":"Well, every day is a little different.","zh":"描述日常工作的多样性。"},{"fn":"03 · 表达逐渐适应","frame":"I'm getting used to it.","ex":"It's tiring ... but I'm getting used to it.","zh":"get used to 渐渐习惯某事。"},{"fn":"04 · 带团参观","frame":"show my group places of interest","ex":"... show my group places of interest.","zh":"带团参观风景名胜。"},{"fn":"05 · 开启招聘话题","frame":"Have you heard the news?","ex":"Hi Cal. Have you heard the news?","zh":"用\"你听说那个消息了吗？\"开启关于校园招聘的对话。"},{"fn":"06 · 询问意向岗位","frame":"What kind of position would you be after?","ex":"What kind of position would you be after?","zh":"询问对方想应聘什么类型的职位。"},{"fn":"07 · 说明求职准备","frame":"I'm going to take an up-to-date copy of my résumé.","ex":"Well, I'm going to take an up-to-date copy of my résumé.","zh":"表示带一份最新简历前往招聘会。"},{"fn":"08 · 说明实践收获","frame":"This job would give me a really good chance to ...","ex":"This job would give me a really good chance to practice what I have learned.","zh":"说明工作带来的实践机会。"}],"CHAT_TIPS":["听对话前先浏览空格前后的内容，预测所填词性（名词 / 形容词 / 短语），如 tour guide、places of interest。","注意固定搭配与短语的整体发音，例如 get used to、places of interest，不要逐词拼写。","对话中 Carl / Lena 的问答节奏较快，听第二遍时重点关注空缺句的语调与重音。","补全后默读整段对话，检查语法与时态是否通顺，再对照脚本（Script）核对。","把填好的句子跟读（shadow reading），模仿语音语调，巩固词汇与句型。"],"PRIDE_PASSAGE":[{"no":"①","text":"During the Warring States Period, the State of Qin attacked the State of Zhao. Handan, the capital of Zhao, found itself under siege, so the King of Zhao sent Lord Pingyuan to the State of Chu for help. Lord Pingyuan planned to select a team of 20 men to go with him, but he found only 19 men who were capable of the task. At this time, a man named Mao Sui volunteered to join the team."},{"no":"②","text":"\"How long have you been with me?\" Lord Pingyuan asked. \"Three years,\" Mao Sui said. \"A capable man is like an awl,\" said Lord Pingyuan. \"Once you put it into a cloth bag, its tip will immediately come out. Why haven't I heard of your name in these three years?\" \"Because until today, I have never been put into that cloth bag like an awl,\" Mao Sui answered. People laughed at Mao Sui behind his back. But Lord Pingyuan decided to include him in his team. His decision proved right."},{"no":"③","text":"When the team arrived in the State of Chu, Lord Pingyuan and the King of Chu talked from morning till noon, but did not reach an agreement. At last, Mao Sui approached the King of Chu, brandishing a sword. He explained the gains and losses of their alliance against the State of Qin in an agitated tone. Finally, the King of Chu promised to help the State of Zhao. On returning home, Mao Sui became a hero."}],"PRIDE_ZH":[{"no":"①","text":"战国时期，秦国出兵攻打赵国，包围了赵都邯郸，于是赵王派平原君前往楚国，请求援救。平原君打算挑选出二十人和他一同前往，但他发现只有十九人能胜任这项任务。这时，有一个名叫毛遂的人主动向平原君自我推荐，请求加入前往楚国的行列。"},{"no":"②","text":"平原君问：\"你在我门下多久了？\"毛遂回答：\"三年了。\"平原君说：\"一个真正有才能的人，就好像一把放在袋子里的锥子一样，立刻就会显露出锋利的锥尖。而你在我门下三年了，为什么我却没听说过你的名字？\"毛遂答道：\"因为直到今天，我还从来没有像锥子一样被放进那个袋子里。\"人们在背后嘲笑毛遂。但是平原君决定把他收归麾下。事实证明他的决定是正确的。"},{"no":"③","text":"到了楚国，平原君和楚王会谈，从早上到中午都没有达成协议。最后，毛遂持剑走到楚王面前，极力说明赵、楚联合抗秦的利害关系。楚王终于被说服，答应赵国出兵援救。回国后，毛遂成了英雄。"}],"PRIDE_CULTURE":"「毛遂自荐」出自《史记·平原君虞卿列传》，是中国历史上主动自我推荐、勇于担当的经典典故。在重视谦逊内敛的传统文化中，毛遂的故事提醒人们：真正的人才应当既有实力，也懂得在关键时刻展现自我、把握机遇。它与本单元\"求职准备\"的主题高度契合——现代求职同样需要在适度谦虚的基础上，主动展示自己的能力（如撰写简历、在面试中清晰表达优势）。这一精神也被视为中华文明中\"自信担当\"与工匠精神的一种体现。","PRIDE_QS":[{"q":"What did Lord Pingyuan mean by saying \"A capable man is like an awl\"?","o":["A capable man should hide his talent.","A truly talented person will reveal their ability naturally.","A man must carry an awl to show his skill."],"a":1,"y":"毛遂以锥子自比：有才能的人一旦被任用（放入袋中），锋芒自然显露。"},{"q":"Why had Lord Pingyuan never heard of Mao Sui before?","o":["Because Mao Sui had never been given a chance to show his ability.","Because Mao Sui was not capable at all.","Because Mao Sui had just arrived."],"a":0,"y":"毛遂答：\"until today, I have never been put into that cloth bag like an awl\"，意指从未获得展示才华的机会。"},{"q":"What was the result of Mao Sui's volunteering?","o":["He was rejected by Lord Pingyuan.","He persuaded the King of Chu and became a hero.","He returned home in failure."],"a":1,"y":"毛遂持剑陈说利害，楚王答应出兵，回国后他成了英雄。"}],"PRIDE_CET4":[{"w":"volunteer","pos":"v./n.","zh":"自愿（做）；志愿者","eg":"a man named Mao Sui volunteered to join the team"},{"w":"capable","pos":"adj.","zh":"有能力的，能干的","eg":"only 19 men who were capable of the task"},{"w":"select","pos":"v.","zh":"选择，挑选","eg":"Lord Pingyuan planned to select a team of 20 men"},{"w":"agreement","pos":"n.","zh":"协议，一致","eg":"did not reach an agreement"},{"w":"attack","pos":"v.","zh":"进攻，袭击","eg":"the State of Qin attacked the State of Zhao"},{"w":"capital","pos":"n.","zh":"首都，首府","eg":"Handan, the capital of Zhao"},{"w":"include","pos":"v.","zh":"包括，包含","eg":"Lord Pingyuan decided to include him in his team"},{"w":"approach","pos":"v.","zh":"接近，靠近","eg":"Mao Sui approached the King of Chu"},{"w":"promise","pos":"v.","zh":"承诺，答应","eg":"the King of Chu promised to help"},{"w":"hero","pos":"n.","zh":"英雄","eg":"Mao Sui became a hero"},{"w":"siege","pos":"n.","zh":"包围，围困","eg":"Handan found itself under siege"}],"PRIDE_PHRASES":[{"p":"volunteer to do","zh":"自愿做某事","eg":"Mao Sui volunteered to join the team."},{"p":"be capable of","zh":"有能力做……","eg":"men who were capable of the task"},{"p":"under siege","zh":"被围困","eg":"Handan found itself under siege"},{"p":"a team of","zh":"一组 / 一支……","eg":"select a team of 20 men"},{"p":"laugh at","zh":"嘲笑","eg":"People laughed at Mao Sui behind his back."},{"p":"prove right","zh":"证明（决定）正确","eg":"His decision proved right."},{"p":"from morning till noon","zh":"从早到午","eg":"talked from morning till noon"},{"p":"brandish a sword","zh":"挥剑","eg":"Mao Sui approached ..., brandishing a sword."}],"PRIDE_PATTERNS":[{"t":"原因状语从句 · so","frame":"..., so + 主语 + 谓语","eg":"Handan found itself under siege, so the King of Zhao sent Lord Pingyuan to the State of Chu for help.","zh":"用 so 连接结果，表示\"因此 / 于是\"。"},{"t":"比喻结构 · like","frame":"A is like B","eg":"A capable man is like an awl.","zh":"用 like 作比喻，说明人才终将显露锋芒。"},{"t":"时间状语 · not ... until","frame":"not ... until + 时间 / 从句","eg":"Until today, I have never been put into that cloth bag.","zh":"not ... until 表示\"直到……才\"。"},{"t":"现在分词作伴随状语","frame":"主语 + 谓语, + V-ing ...","eg":"Mao Sui approached the King of Chu, brandishing a sword.","zh":"brandishing 为现在分词作伴随状语，描述与主句动作同时发生的情况。"}],"GAP_ANSWERS":{"vf":["role","salary","benefits","access","covering"],"chatting":["getting used to it","a little different","places of interest","be very focused","tour guide training"]},"QUESTIONS":{"vf":[{"q":"What is Sara's new job?","opts":["A secretary in a sales company.","A sales representative.","A dentist."],"a":0,"why":"对话原文：I'm working as a secretary in a sales company."},{"q":"Besides paid vacation and free health insurance, what other benefit does Sara mention?","opts":["A company car.","24-hour access to the company gym.","Free meals."],"a":1,"why":"对话原文提到 free health insurance and 24-hour access to the company gym。"},{"q":"What does Tim need to send to apply for the sales representative position?","opts":["A résumé or covering letter.","A phone call.","A gift."],"a":0,"why":"对话原文：You need to send a résumé or covering letter."}],"chatting":[{"q":"What is Lena's job?","opts":["A tour guide.","A secretary.","A dentist."],"a":0,"why":"对话开头：How's life as a tour guide?"},{"q":"How many people are usually in Lena's group?","opts":["About 20.","About 50.","About 100."],"a":1,"why":"对话原文：there are usually about 50 people."},{"q":"What helps Lena answer difficult questions?","opts":["Her tour guide training.","Her salary.","Her car."],"a":0,"why":"对话原文：I learned a lot in my tour guide training."}]},"SP_GROUPS":[{"group":"Grammar Focus · should / have to 的用法","cards":[{"no":"1","title":"should 提出建议","sent":"You should eat more vegetables for a healthy diet.","zh":"为了健康的饮食，你应该多吃蔬菜。","items":[{"lb":"功能","df":"提出建议或意见，后接动词原形；否定 shouldn't","egs":[["You should be on time for the meeting.","你应该准时参加会议。"],["Children shouldn't be allowed to play in the street.","儿童不应该被允许在街上玩耍。"]]}],"src":"Grammar Focus · should"},{"no":"2","title":"have to 表达义务","sent":"I have to finish this report by tomorrow.","zh":"我必须在明天之前完成这份报告。","items":[{"lb":"功能","df":"表示必须遵守的义务 / 规定，后接动词原形；三单 has to，否定 don't / doesn't have to","egs":[["He doesn't have to buy a new phone.","他没有必要买一部新手机。"],["We don't have to finish the project by tomorrow.","我们不必在明天之前完成这个项目。"]]}],"src":"Grammar Focus · have to"}]},{"group":"Reading · Language notes（课文长句）","cards":[{"no":"1","title":"something unusual（形容词后置）","sent":"How about trying something unusual?","zh":"尝试一些不寻常的工作怎么样？","items":[{"lb":"用法","df":"形容词修饰不定代词(something / anything / nothing)时后置","egs":[["Peter is doing something important.","彼得正在做一些重要的事情。"],["There is nothing new in today's newspaper.","今天的报纸上没什么新消息。"]]}],"src":"Reading · 语言解析 1"},{"no":"2","title":"It is + adj. + to do","sent":"Is it possible to be a hacker and an honest person at the same time?","zh":"一个人是否可以在做黑客的同时也是一个诚实的人？","items":[{"lb":"结构","df":"It 为形式主语，to do 为真实主语","egs":[["It is useful to learn English.","学英语是有用的。"],["It is necessary to have some money of one's own.","拥有一些属于自己的钱是必要的。"]]}],"src":"Reading · 语言解析 2"},{"no":"3","title":"at the same time","sent":"... an honest person at the same time","zh":"同时","items":[{"lb":"释义","df":"同时","egs":[["Don't speak at the same time.","大家不要同时说话。"],["He is lazy, but at the same time, he is very smart.","这孩子懒惰，但同时很聪明。"]]}],"src":"Reading · 语言解析 2"},{"no":"4","title":"be interested in","sent":"If you're interested in a career as an ethical hacker...","zh":"如果你对道德黑客这个职业感兴趣","items":[{"lb":"用法","df":"对……感兴趣，in 后接名词 / 动名词","egs":[["I am interested in math.","我对数学感兴趣。"],["Tony is interested in playing golf.","托尼对打高尔夫球感兴趣。"]]}],"src":"Reading · 语言解析 3"},{"no":"5","title":"pick up","sent":"A diver who picks up golf balls from water...","zh":"一个从水里捡高尔夫球的潜水员","items":[{"lb":"释义","df":"捡起；拿起","egs":[["He picked up his hat and went away.","他捡起帽子走了。"]]}],"src":"Reading · 语言解析 4"},{"no":"6","title":"per week / 频度表达","sent":"... works four days per week ...","zh":"每周工作四天","items":[{"lb":"释义","df":"per week = a week；类似 five days a week, three times a day","egs":[["We go to school five days a week.","我们每周上学五天。"],["Take the medicine three times a day.","每天吃三次药。"]]}],"src":"Reading · 语言解析 4"},{"no":"7","title":"more than","sent":"They could earn more than 100,000 dollars a year.","zh":"他们一年的收入可以超过 10 万美元","items":[{"lb":"释义","df":"超过；多于","egs":[["I have known him for more than 20 years.","我认识他已有 20 多年了。"],["We have learned more than 2,000 words.","我们已学会了 2,000 多个单词。"]]}],"src":"Reading · 语言解析 5"},{"no":"8","title":"try doing","sent":"... maybe you should try the job of making sculptures out of cheese.","zh":"或许你应该尝试用奶酪制作雕塑的工作","items":[{"lb":"用法","df":"try doing 尝试做……（强调试试看）","egs":[["I'll try making a model plane.","我会尝试做一架飞机模型。"],["Mateo tried looking for a new job.","玛特奥试着找一份新工作。"]]}],"src":"Reading · 语言解析 6"}]}]},"content":{"unit":{"title":"Looking for jobs","zh":"求职准备","book":"New Era English for Careers · 用英语讲中国故事","source":"U1（VR版）_教学课件_202501.pptx"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段 Tim 与 Sara 的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u1-vocabulary-focus-exC.wav","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["role","salary","benefits","access","covering"],"gaps":[{"who":"Tim","html":"Hi, Sara. How's the job?"},{"who":"Sara","html":"Hi, Tim. I'm working as a secretary in a sales company."},{"who":"Tim","html":"That's great. Are you enjoying your new (1) <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">?"},{"who":"Sara","html":"Yes. I much prefer it to my old job. The (2) <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> is much better, and the hours are shorter too."},{"who":"Tim","html":"Are there any (3) <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">?"},{"who":"Sara","html":"Yes. There are great benefits too. I have a paid vacation as well as free health insurance and 24-hour (4) <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> to the company gym."},{"who":"Tim","html":"Sounds amazing! I really need a new car, but I don't think I'll ever be able to afford one on my wage."},{"who":"Sara","html":"Actually, there's a sales representative position available at my company right now. For that position you get a company car too."},{"who":"Tim","html":"Wow! How do I apply?"},{"who":"Sara","html":"You need to send a résumé or (5) <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> letter. Look at the company website to find out more."},{"who":"Tim","html":"I'll go and check it out right away."},{"who":"Sara","html":"Great! Let me know if you decide to apply and I'll give you some tips for the interview."}],"script":[["Tim","Hi, Sara. How's the job?"],["Sara","Hi, Tim. I'm working as a secretary in a sales company."],["Tim","That's great. Are you enjoying your new role?"],["Sara","Yes. I much prefer it to my old job. The salary is much better, and the hours are shorter too."],["Tim","Are there any benefits?"],["Sara","Yes. There are great benefits too. I have a paid vacation as well as free health insurance and 24-hour access to the company gym."],["Tim","Sounds amazing! I really need a new car, but I don't think I'll ever be able to afford one on my wage."],["Sara","Actually, there's a sales representative position available at my company right now. For that position you get a company car too."],["Tim","Wow! How do I apply?"],["Sara","You need to send a résumé or covering letter. Look at the company website to find out more."],["Tim","I'll go and check it out right away."],["Sara","Great! Let me know if you decide to apply and I'll give you some tips for the interview."]],"translation":[["蒂姆","你好，萨拉。你的工作怎么样了？"],["萨拉","你好，蒂姆。我现在在一家销售公司做秘书。"],["蒂姆","太好了，你喜欢你的新职位吗？"],["萨拉","喜欢，比起以前的工作，我更喜欢现在这一份工作。这份工作的工资高得多，工作时间也更短一些。"],["蒂姆","有没有什么福利？"],["萨拉","有的，公司的福利也很好。有一个带薪假期、免费的健康保险，还可以 24 小时使用公司的健身房。"],["蒂姆","听起来好棒！我真的很需要一辆新车，但我认为以我的工资不能负担得起。"],["萨拉","事实上，我们公司现在就有一个销售代表的职位。这个职位也可以用公司的车。"],["蒂姆","哇！我要怎么申请这个职位？"],["萨拉","你需要发送一份简历或者求职信。你可以看看公司网站，了解更多信息。"],["蒂姆","我马上就去看看。"],["萨拉","太棒了！如果你决定申请这个职位，请告诉我，我会告诉你一些面试技巧。"]],"note":"词库：role, salary, benefits, access, covering。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Do you want to try?","lead":"听读课文，了解三种不寻常的工作：道德黑客、高尔夫球潜水员、奶酪雕塑师。","audio":"assets/audio/s2-u1-reading-passage.mp3","audioLabel":"课文原声 · Do you want to try?"},"chatting":{"title":"Chatting · Exercise A","lead":"听一段 Carl 与 Lena 的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u1-chatting-listening.wav","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["getting used to it","a little different","places of interest","be very focused","tour guide training"],"gaps":[{"who":"Carl","html":"Hi, Lena. How's life as a tour guide?"},{"who":"Lena","html":"I love it! It's tiring and the hours are long, especially in summer, but I'm (1) <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">."},{"who":"Carl","html":"So what's a typical day like for you?"},{"who":"Lena","html":"Well, every day is (2) <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\">. Sometimes I have to do a walking tour of the city and show my group (3) <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">. Other times, we go on a bus tour and see the sights that way."},{"who":"Carl","html":"Do you usually have a lot of people in your group?"},{"who":"Lena","html":"Yes, there are usually about 50 people, so I need to be careful I don't lose anyone!"},{"who":"Carl","html":"I suppose you need to (4) <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\">! And do people ask a lot of questions?"},{"who":"Lena","html":"Yes, they do, so I need to be well prepared. Luckily, I learned a lot in my (5) <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\">, but I sometimes get a question which is difficult to answer."},{"who":"Carl","html":"Sounds interesting."},{"who":"Lena","html":"Yes. It's fun. The pay isn't bad either!"}],"script":[["Carl","Hi, Lena. How's life as a tour guide?"],["Lena","I love it! It's tiring and the hours are long, especially in summer, but I'm getting used to it."],["Carl","So what's a typical day like for you?"],["Lena","Well, every day is a little different. Sometimes I have to do a walking tour of the city and show my group places of interest. Other times, we go on a bus tour and see the sights that way."],["Carl","Do you usually have a lot of people in your group?"],["Lena","Yes, there are usually about 50 people, so I need to be careful I don't lose anyone!"],["Carl","I suppose you need to be very focused! And do people ask a lot of questions?"],["Lena","Yes, they do, so I need to be well prepared. Luckily, I learned a lot in my tour guide training, but I sometimes get a question which is difficult to answer."],["Carl","Sounds interesting."],["Lena","Yes. It's fun. The pay isn't bad either!"]],"translation":[["卡尔","你好，莉娜。当导游感觉如何？"],["莉娜","我很喜欢！虽然做导游很累，工作时间也很长，尤其是夏天，但我已经习惯了。"],["卡尔","那么，你做导游每天的日常是怎么样的？"],["莉娜","嗯，每天都有点不同。有时候，我得带着我的团队在城市里走走看看，去参观景点。其他时候，我们会乘车游览，用这种方式看风景。"],["卡尔","你的团队里通常会有很多人吗？"],["莉娜","是的，通常有 50 人左右，所以我得小心不要落下谁！"],["卡尔","我想你需要很专注吧！那大家会不会问很多问题？"],["莉娜","会的，所以我需要做好充分的准备。幸运的是，我在导游培训中学到了很多东西，但有时也会遇到难以回答的问题。"],["卡尔","听起来很有意思。"],["莉娜","是的，很有意思。薪水也不低！"]],"note":"词库：getting used to it, a little different, places of interest, be very focused, tour guide training。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · Mao Sui Volunteering His Services","lead":"阅读中国典故「毛遂自荐」，理解主动担当、自信展示自我的精神，并与本单元求职主题相联系。","audio":"assets/audio/s2-u1-pride-of-china.mp3","audioLabel":"专题原声 · Mao Sui Volunteering His Services","note":"本专题讲述毛遂自荐的典故，与本单元求职主题呼应：主动担当、自信展示自我。文本来自课件 slides 68–74。"}}});
