window.__PENDING_UNITS.push({"id":"s2-u5","readyNo":5,"data":{"WORDS":[{"w":"bad-mouth","pos":"v.","zh":"说坏话；背后诋毁","lv":"","eg":"Both men continually bad-mouth each other.","egZh":"两个男人继续彼此诽谤。"},{"w":"cite","pos":"v.","zh":"引证；举出（示例）","lv":"","eg":"She cites a favourite poem by George Herbert.","egZh":"她引用了一首她所喜爱的乔治·赫伯特的诗。"},{"w":"discriminatory","pos":"adj.","zh":"歧视的；区别对待的","lv":"","eg":"These reforms will abolish racially discriminatory laws.","egZh":"这些改革将废除种族歧视法律。"},{"w":"hinder","pos":"v.","zh":"阻碍；妨碍","lv":"","eg":"Further investigation was hindered by the loss of all documentation.","egZh":"由于有关此案的材料全部丢失，进一步的调查受到了阻碍。"},{"w":"post","pos":"v.","zh":"发帖","lv":"","eg":"I never post anything on the Internet that I wouldn’t want my boss to see.","egZh":"我从来没有在互联网上发布任何我不想让我老板看到的东西。"},{"w":"provocative","pos":"adj.","zh":"有挑逗性的；煽动的","lv":"","eg":"Her smile is too provocative to be forgotten.","egZh":"她的笑撩人得让人忘不掉。"},{"w":"recruiter","pos":"n.","zh":"招聘人员","lv":"","eg":"If you don’t know the recruiter’s name, simply list the company name.","egZh":"如果你不知道招聘人员的名字，简单地写上公司名字和地址吧。"},{"w":"tempting","pos":"adj.","zh":"诱人的；吸引人的","lv":"","eg":"This is a tempting job offer.","egZh":"这是个很诱人的工作机会。"},{"w":"vent","pos":"v.","zh":"发泄；宣泄","lv":"","eg":"She vents her anger on the family.","egZh":"她在家人身上出气。"},{"w":"wary","pos":"adj.","zh":"小心谨慎的","lv":"","eg":"People did not teach their children to be wary of strangers.","egZh":"人们以前没教过自己的孩子们要提防陌生人。"},{"w":"alcohol abuse","pos":"phrase","zh":"酗酒","lv":"","eg":"Alcohol abuse is not just a health issue, it is a public order issue.","egZh":"酗酒不仅仅是健康问题，也是公共秩序问题。"},{"w":"catch sb’s eye","pos":"phrase","zh":"引起某人的注意","lv":"","eg":"His magic can really catch students’ eye.","egZh":"他的魔术真的能吸引很多同学的眼球。"},{"w":"let off steam","pos":"phrase","zh":"发泄感情；宣泄不满","lv":"","eg":"He let off steam by yelling at the clerk.","egZh":"他对一个职员大吼大叫借以发泄怨气。"},{"w":"watch out for","pos":"phrase","zh":"密切注意；小心提防","lv":"","eg":"He called out to them to watch out for the unexploded mine.","egZh":"他冲他们大喊，叫他们小心哑雷。"},{"w":"enable","pos":"v.","zh":"使能够，使有机会","lv":"","eg":"The new test enables doctors to detect the disease early.","egZh":"新的检测手段使医生们能够及早查出这种疾病。"},{"w":"hinder (key)","pos":"v.","zh":"阻碍；妨碍","lv":"","eg":"Social media can help and not hinder your chances.","egZh":"社交媒体可以帮助而不是阻碍你找工作。"}],"GLOSS":{"enable":{"w":"enable","pos":"v.","zh":"使能够，使有机会","def":"make possible; make able","eg":"The new test enables doctors to detect the disease early.","egZh":"新的检测手段使医生们能够及早查出这种疾病。","src":"Reading · Words & Expressions"},"connections":{"w":"make connections","pos":"phrase","zh":"建立联系","def":"to establish contact or relationships","eg":"We are not able to make connections between current events and past events.","egZh":"如果我们不置身事外，很难将二者联系起来。","src":"Reading · Language notes"},"hinder":{"w":"hinder","pos":"v.","zh":"阻碍；妨碍","def":"to make difficult; to obstruct","eg":"Further investigation was hindered by the loss of all documentation.","egZh":"由于材料全部丢失，进一步的调查受到了阻碍。","src":"Reading · Words & Expressions"},"two_in_five":{"isNote":true,"w":"分数表达 · two in five","sent":"two in five companies use your online profile","zh":"每五家公司里就有两家","def":"英语分数表达之一：\"基数词＋介词＋基数词\"，介词 in/out of/of/to 前的数词为分子，后为分母","points":["two in five","two thirds"],"src":"Reading · Language notes"},"evaluate":{"w":"evaluate","pos":"v.","zh":"评估；评价","def":"to judge or calculate the quality or value of","eg":"Employers use your online profile to evaluate your personal qualities.","egZh":"雇主用你的线上资料来评估你的个人素质。","src":"Reading"},"come_across":{"w":"come across","pos":"phrase","zh":"偶然遇见；无意中发现","def":"to find or meet by chance","eg":"They come across online content which made them decide not to hire.","egZh":"他们看到网上内容后决定不录用。","src":"Reading"},"wary":{"w":"be wary of","pos":"phrase","zh":"谨慎，小心做","def":"to be careful about something","eg":"They taught her to be wary of strangers.","egZh":"他们教育她要提防陌生人。","src":"Reading · Language notes"},"provocative":{"w":"provocative","pos":"adj.","zh":"有挑逗性的；煽动的","def":"causing a strong reaction","eg":"They had posted provocative or inappropriate photos.","egZh":"他们发布了挑逗性或不当照片。","src":"Reading · Words & Expressions"},"alcohol_abuse":{"w":"alcohol abuse","pos":"phrase","zh":"酗酒","def":"drinking too much alcohol habitually","eg":"evidence of alcohol abuse","egZh":"酗酒的证据","src":"Reading · Words & Expressions"},"vent":{"w":"vent","pos":"v.","zh":"发泄；宣泄","def":"to express a strong negative feeling","eg":"vent your anger with a former employer","egZh":"向以前的雇主发泄怒气","src":"Reading · Words & Expressions"},"tempting":{"w":"tempting","pos":"adj.","zh":"诱人的；吸引人的","def":"attractive; hard to resist","eg":"It can be tempting to let off steam.","egZh":"发泄情绪可能很诱人。","src":"Reading · Words & Expressions"},"let_off_steam":{"w":"let off steam","pos":"phrase","zh":"发泄感情；宣泄不满","def":"to release strong feelings or energy","eg":"It can be tempting to let off steam.","egZh":"发泄情绪可能很诱人。","src":"Reading · Words & Expressions"},"cite":{"w":"cite","pos":"v.","zh":"引证；举出（示例）","def":"to mention something as an example","eg":"employers cite bad-mouthing previous employers","egZh":"雇主举出说前任雇主坏话作为理由","src":"Reading · Words & Expressions"},"bad_mouth":{"w":"bad-mouth","pos":"v.","zh":"说坏话；背后诋毁","def":"to speak badly of someone","eg":"bad-mouthing previous employers","egZh":"说前任雇主的坏话","src":"Reading · Words & Expressions"},"watch_out":{"w":"watch out for","pos":"phrase","zh":"密切注意；小心提防","def":"to look out for; to be alert to","eg":"He called out to them to watch out for the unexploded mine.","egZh":"他冲他们大喊，叫他们小心哑雷。","src":"Reading · Words & Expressions"},"discriminatory":{"w":"discriminatory","pos":"adj.","zh":"歧视的；区别对待的","def":"treating a person or group unfairly","eg":"discriminatory comments relating to race or gender","egZh":"涉及种族或性别的歧视性言论","src":"Reading · Words & Expressions"},"by_all_means":{"w":"by all means","pos":"phrase","zh":"一定，无论如何","def":"certainly; at all costs","eg":"You must bring him here by all means.","egZh":"你们一定要设法把他带到这里来。","src":"Reading · Language notes"},"catch_eye":{"w":"catch sb’s eye","pos":"phrase","zh":"引起某人的注意","def":"to attract someone’s attention","eg":"Lizzy catches the eye of wealthy landowner Mr. Darcy.","egZh":"莉齐引起了富有的地主达西先生的注意。","src":"Reading · Words & Expressions"}},"PASSAGE":[{"no":"①","text":"Nowadays social media is a key element in the job search. [[enable|It enables you]] to find vacancies and [[connections|make connections]] more easily in your chosen field. So, how can you use social media to help and not [[hinder|hinder]] your chances?"},{"no":"②","text":"Around 37% of employers use social media to research potential employees, which means that [[two_in_five|two in five companies]] use your online profile to [[evaluate|evaluate]] your personal qualities, and make decisions about whether or not they should hire you. This can be good news or bad news. It’s good news if your online profile is totally clean, reflecting a wide range of achievements and interests. However, 34% of employers say that they [[come_across|come across]] online content which has made them decide not to offer a potential candidate the job."},{"no":"③","text":"[[wary|What kind of content should job seekers be wary of posting online]]? First, a large number of recruiters have admitted to not offering jobs to the candidates who had posted [[provocative|provocative or inappropriate photos]]. Second, about 45% of employers say that they decide not to hire someone because of evidence of [[alcohol_abuse|drinking or drug use]]. Besides, have you ever gone online to [[vent|vent your anger]] with a former employer? Although it can be [[tempting|tempting]] to [[let_off_steam|let off steam]], employers also [[cite|cite]] [[bad_mouth|bad-mouthing previous employers]] as a reason for not offering candidates jobs."},{"no":"④","text":"And another thing which recruiters [[watch_out|watch out for]] is [[discriminatory|discriminatory]] comments relating to race or gender."},{"no":"⑤","text":"[[by_all_means|By all means]], use social media to help you [[catch_eye|catch a potential employer’s eye]]. Just make sure they notice you for the right reasons."}],"PASSAGE_ZH":[{"no":"①","text":"如今，社交媒体已成为求职的一个关键因素。它能让你更容易地找到空缺岗位，并在你所选择的领域里建立联系。因此，你要如何利用社交媒体来帮助自己，而不是阻碍自己找工作呢？"},{"no":"②","text":"大约37%的雇主会利用社交媒体来调查潜在员工，这意味着每五家公司里就有两家会用你的线上资料来对你的个人素质进行评估，并由此决定是否应雇佣你。对求职者来说，这可能是好消息，也可能是坏消息。如果你的线上资料非常干净，能展现你广泛的成就和兴趣，那这对你来说就是好消息。然而，有34%的雇主表示他们在网上看到过一些内容，让他们决定放弃录用潜在候选人。"},{"no":"③","text":"求职者应该警惕在网上发布什么样的内容呢？首先，很多招聘人员承认，他们不会为那些发布挑逗性或者不当照片的求职者提供工作。其次，大约有45%的雇主表示会因为网上有证据表明求职者酗酒而决定不雇佣这位雇员。另外，你是否曾在互联网上向前雇主发泄过你的怒气？尽管发泄情绪可能很诱人，招聘人员还是会以说前任雇主的坏话为理由不给求职者提供工作。"},{"no":"④","text":"另外，招聘人员还会关注求职者发布的有关种族或性别的歧视性言论。"},{"no":"⑤","text":"总之，应当利用社交媒体来帮助你吸引潜在雇主的注意，只要确保他们是出于正确的原因注意到你。"}],"READING_QS":[{"q":"According to the passage, about what percentage of employers use social media to research potential employees?","o":["About 34%","About 37%","About 45%"],"a":1,"y":"课文第一段提到 \"Around 37% of employers use social media to research potential employees.\""},{"q":"What kind of online content should job seekers be wary of posting?","o":["Photos of their achievements and interests","Provocative or inappropriate photos","Daily study notes"],"a":1,"y":"课文指出招聘者不会为发布挑逗性或不当照片的求职者提供工作。"},{"q":"What does the writer advise job seekers to do \"by all means\"?","o":["Avoid social media entirely","Use social media to catch a potential employer’s eye for the right reasons","Post as many personal photos as possible"],"a":1,"y":"结尾段 \"By all means, use social media to help you catch a potential employer’s eye\" 强调用正确理由吸引雇主注意。"}],"PATTERNS":[{"fn":"01 · 说明社交媒体的使用频率","frame":"I use social media almost every day.","ex":"I use social media almost every day to follow industry news.","zh":"表达自己使用社交媒体的频率。"},{"fn":"02 · 比较浏览与发布习惯","frame":"I read other people’s posts more often than posting myself.","ex":"I like both of them, but I read other people’s posts more often than posting myself.","zh":"描述自己更多是浏览他人帖子而非自己发布。"},{"fn":"03 · 表达对个人信息谨慎","frame":"I am pretty careful not to disclose personal information on social media.","ex":"I am pretty careful not to disclose personal information on social media.","zh":"强调不在社交媒体上泄露个人隐私。"},{"fn":"04 · 说明用社交媒体求职","frame":"Social media is the place to find interesting work.","ex":"Social media is the place to find interesting work, but there is a lot of spam here.","zh":"说明社交媒体是寻找有趣工作的地方（求职语境高频搭配）。"},{"fn":"05 · 评价个人网络形象","frame":"How clean is your online footprint?","ex":"Well, how clean is your online footprint?","zh":"用 \"online footprint\"（网络足迹）询问对方网络形象是否干净。"}],"CHAT_TIPS":["注意 \"online footprint\"（网络足迹）指个人在网络上留下的所有活动痕迹，雇主常借此评估求职者。","对话中 Lucy 不断用追问（\"What do you mean?\" / \"Is there anything a recruiter would be unhappy about?\"）引导 Sam 反思自己的网络形象。","\"find interesting work\" 是求职语境里的常见搭配，注意与 \"find a job\" 在语体上的差异。","\"positive and professional impression\" 是雇主期望的线上印象，记住 positive 与 professional 的搭配。","\"bother looking at\" 中 bother 后接动名词，注意其否定反问句的语调与含义。"],"PRIDE_PASSAGE":[{"no":"①","text":"Guochao, which means \"Chinese fashion trend\", refers to the rising tide of products that incorporate elements of traditional Chinese culture and style into a modern twist. Celebrating Chinese heritage and homegrown brands, it’s fair to say that this cultural movement has recently flooded social media."},{"no":"②","text":"Online celebrities or influencers have played a crucial role in promoting guochao brands through social media and livestream platforms. They have effectively captured the attention of Chinese consumers, fostering a sense of patriotism and national unity. Yet, guochao’s popularity is also due to increasingly positive perceptions of the quality of Chinese-made products, as \"Made in China\" has become \"Created in China\" and \"Designed in China\". Guochao brands are particularly popular with social media savvy young consumers, who want to learn more about their history,"},{"no":"③","text":"culture and how it all fits together in the modern world. Chinese youth tend to have strong and genuine confidence in their national identity and traditional culture. Photos of guochao products posed by young people are all over social media. China is now playing an important role globally not just in technology, but also in design, culture, and business. It might be time for the rest of the world to know more about China’s modernization; otherwise, they might just miss this wave."}],"PRIDE_ZH":[{"no":"①","text":"国潮，意为\"中国时尚潮流\"，指的是将中国传统文化和风格与现代元素结合在一起的产品潮流。可以说，这场宣扬中国传统和国产品牌的文化运动最近已经在社交媒体上成为热潮。"},{"no":"②","text":"\"网红\"或在网络上有影响力的人在通过社交媒体和直播平台推广国潮品牌方面发挥了至关重要的作用，有效地吸引了中国消费者的注意力，培养了爱国主义情怀和民族团结意识。然而，国潮的流行还得益于人们对中国制造产品质量日益积极的看法，因为\"中国制造\"已然进阶为\"中国创造\"和\"中国设计\"。"},{"no":"③","text":"国潮品牌在精通社交媒体的年轻消费者中特别受欢迎，他们想要更多地了解自己的历史、文化以及它们是如何在现代世界中融合的。中国的年轻人往往对自己的民族认同和传统文化有着坚定而真挚的自信。社交媒体上随处可见年轻人晒出的国潮产品照片。如今，中国不仅在科技领域，在设计、文化和商业领域也在全球发挥着重要作用。也许是时候让世界其他地区更多地了解中国的现代化进程了；否则，他们可能会错过这股浪潮。"}],"PRIDE_CULTURE":"国潮（Guochao）是近年来在中国年轻人中兴起的文化潮流，指将传统文化元素与现代设计、消费方式相融合的本土品牌现象。它依托社交媒体与直播电商平台迅速传播，既体现了年轻一代对民族文化和本土品牌的自信，也折射出\"中国制造\"向\"中国创造\"\"中国设计\"的转型升级。国潮的走红，是中国文化软实力与数字经济协同发展的一个缩影。","PRIDE_QS":[{"q":"What does \"guochao\" mean according to the passage?","o":["Chinese fashion trend","Chinese food delivery","Chinese tourist attractions"],"a":0,"y":"第一段明确说明 Guochao 意为 \"Chinese fashion trend\"（中国时尚潮流）。"},{"q":"Who has played a crucial role in promoting guochao brands?","o":["Government officials","Online celebrities or influencers","Foreign investors"],"a":1,"y":"第二段指出网红（online celebrities / influencers）在推广国潮品牌方面发挥了至关重要的作用。"},{"q":"What transformation of Chinese products is mentioned?","o":["From \"Made in China\" to \"Created in China\" and \"Designed in China\"","From \"Created in China\" to \"Made in China\"","From \"Designed in China\" to \"Sold in China\""],"a":0,"y":"第二段提到 \"Made in China\" 已转变为 \"Created in China\" 与 \"Designed in China\"。"}],"PRIDE_CET4":[{"w":"incorporate","pos":"v.","zh":"包含；把…合并","eg":"products that incorporate elements of traditional Chinese culture"},{"w":"heritage","pos":"n.","zh":"遗产；传统","eg":"Celebrating Chinese heritage and homegrown brands"},{"w":"flood","pos":"v.","zh":"大量涌入；充斥","eg":"this cultural movement has recently flooded social media"},{"w":"crucial","pos":"adj.","zh":"至关重要的","eg":"have played a crucial role in promoting guochao brands"},{"w":"promote","pos":"v.","zh":"推广；促进","eg":"promoting guochao brands through social media"},{"w":"capture","pos":"v.","zh":"吸引；捕获","eg":"They have effectively captured the attention of Chinese consumers"},{"w":"consumer","pos":"n.","zh":"消费者","eg":"the attention of Chinese consumers"},{"w":"foster","pos":"v.","zh":"培养；促进","eg":"fostering a sense of patriotism and national unity"},{"w":"perception","pos":"n.","zh":"看法；感知","eg":"increasingly positive perceptions of the quality"},{"w":"genuine","pos":"adj.","zh":"真实的；真诚的","eg":"strong and genuine confidence in their national identity"},{"w":"identity","pos":"n.","zh":"身份；认同","eg":"confidence in their national identity"},{"w":"modernization","pos":"n.","zh":"现代化","eg":"know more about China’s modernization"}],"PRIDE_PHRASES":[{"p":"flood social media","zh":"在社交媒体上风靡 / 刷屏","eg":"this cultural movement has recently flooded social media"},{"p":"play a crucial role in","zh":"在…方面发挥至关重要的作用","eg":"Online celebrities have played a crucial role in promoting guochao brands"},{"p":"capture the attention of","zh":"吸引…的注意力","eg":"They have effectively captured the attention of Chinese consumers"},{"p":"social media savvy","zh":"精通社交媒体的","eg":"Guochao brands are popular with social media savvy young consumers"},{"p":"a sense of patriotism and national unity","zh":"爱国主义情怀和民族团结意识","eg":"fostering a sense of patriotism and national unity"},{"p":"fit together","zh":"融合；协调","eg":"how it all fits together in the modern world"},{"p":"miss this wave","zh":"错过这股浪潮","eg":"they might just miss this wave"}],"PRIDE_PATTERNS":[{"t":"非限制性定语从句（which 引导）","frame":"Guochao, which means \"Chinese fashion trend\", refers to ...","eg":"Guochao, which means \"Chinese fashion trend\", refers to the rising tide of products that incorporate elements of traditional Chinese culture.","zh":"which 引导非限制性定语从句，用逗号与主句隔开，补充说明先行词 Guochao。"},{"t":"as 引导的原因状语从句","frame":"as \"Made in China\" has become \"Created in China\" ...","eg":"...as \"Made in China\" has become \"Created in China\" and \"Designed in China\".","zh":"as 在此引导原因状语从句，表示\"因为 / 由于\"，说明国潮流行的原因。"}],"GAP_ANSWERS":{"vf":["primary","resources","basic","convinced","career"],"chatting":["find interesting work","online footprint","All sorts of","bother looking at","positive and professional"]},"QUESTIONS":{"vf":[{"q":"Where did Patrick work in Africa?","opts":["In a primary school in Malawi","In a large hospital","In a city library"],"a":0,"why":"Patrick 说 \"I joined the Belt and Road Initiative in Malawi where I worked as a teacher in a primary school.\""},{"q":"What did Patrick say about the classrooms there?","opts":["They were modern and well-equipped","They lacked resources and were very basic","They were small but comfortable"],"a":1,"why":"对话提到 \"We didn’t have many teaching resources at all, and the classrooms were very basic.\""},{"q":"What did the experience convince Patrick to do?","opts":["Become a doctor","Train as a teacher","Return to Africa to live"],"a":1,"why":"Patrick 说这段经历让他确信 \"I want to train as a teacher now.\""}],"chatting":[{"q":"What is Sam doing at the beginning of the conversation?","opts":["Job-hunting on social media","Watching a movie","Cooking dinner"],"a":0,"why":"Sam 说 \"Job-hunting! Social media is the place to find interesting work.\""},{"q":"What does Lucy warn Sam to check?","opts":["His bank account","His online footprint","His clothes"],"a":1,"why":"Lucy 问 \"how clean is your online footprint?\" 提醒他注意网络形象。"},{"q":"What kind of impression should Sam try to create?","opts":["A negative one","A positive and professional one","A funny one"],"a":1,"why":"Lucy 建议删掉不能留下 positive and professional impression 的内容。"}]},"SP_GROUPS":[{"group":"Grammar Focus · Present perfect and past perfect（现在完成时和过去完成时）","cards":[{"no":"1","title":"现在完成时 Present perfect","sent":"A large number of recruiters have admitted to not offering jobs to the candidates who had posted provocative photos.","zh":"表示过去发生、与现在情况或结果有关的经历或成就，不强调具体过去时间点。","items":[{"lb":"结构","df":"have / has + 过去分词","egs":[["He has lived here all his life.","他一辈子都住在这里。"],["I have seen that movie already.","我已经看过那部电影了。"],["The rain has already stopped.","雨已经停了。"]]}],"src":"Grammar Focus · Present perfect"},{"no":"2","title":"过去完成时 Past perfect","sent":"The play had already started when we got to the theater.","zh":"表示在过去某一具体时间点之前已经完成的动作，常含两个时间层次（更早的过去 + 相对较晚的过去）。","items":[{"lb":"结构","df":"had + 过去分词","egs":[["I had studied French before I moved to Paris.","我搬到巴黎之前学过法语。"],["The play had already started when we got to the theater.","我们到剧场时戏已经开始了。"],["Had you driven a tractor before working on the farm?","你在农场工作之前开过拖拉机吗？"]]}],"src":"Grammar Focus · Past perfect"}]},{"group":"Reading · Language notes（课文语言解析）","cards":[{"no":"1","title":"enable / make possible","sent":"It enables you to find vacancies and make connections.","zh":"enable sb to do sth 使某人能做某事；make connections 建立联系。","items":[{"lb":"enable","df":"v. 使能够，使有机会","egs":[["The new test enables doctors to detect the disease early.","新的检测手段使医生能及早查出疾病。"]]},{"lb":"make connections","df":"phrase 建立联系","egs":[["We are not able to make connections between current events and past events.","我们很难将当前与过去的事件联系起来。"]]}],"src":"Reading · Language notes"},{"no":"2","title":"分数表达 two in five","sent":"two in five companies use your online profile","zh":"英语分数可用\"基数词＋介词＋基数词\"表达，介词 in / out of / of / to 前为分子，后为分母。","items":[{"lb":"two in five","df":"每五家中两家","egs":[["Two in five companies use your online profile.","每五家公司里就有两家用你的线上资料。"],["Ninety-nine out of a hundred would answer Columbus.","一百个里有九十九个会回答哥伦布。"]]}],"src":"Reading · Language notes"},{"no":"3","title":"be wary of / watch out for","sent":"What kind of content should job seekers be wary of posting online?","zh":"be wary of 谨慎、小心做某事；watch out for 密切注意、小心提防。","items":[{"lb":"be wary of","df":"phrase 小心做","egs":[["They taught her to be wary of strangers.","他们教育她提防陌生人。"]]},{"lb":"watch out for","df":"phrase 密切注意","egs":[["We will be watching for any developments.","我们会关注所有进展。"]]}],"src":"Reading · Language notes"},{"no":"4","title":"by all means / catch sb’s eye","sent":"By all means, use social media to help you catch a potential employer’s eye.","zh":"by all means 一定、无论如何；catch sb’s eye 引起某人的注意。","items":[{"lb":"by all means","df":"phrase 一定，无论如何","egs":[["You must bring him here by all means.","你们一定要设法把他带到这里来。"]]},{"lb":"catch sb’s eye","df":"phrase 引起某人的注意","egs":[["Lizzy catches the eye of wealthy landowner Mr. Darcy.","莉齐引起了富有的地主达西先生的注意。"]]}],"src":"Reading · Language notes"}]}]},"content":{"unit":{"title":"Social media and career success","zh":"社交媒体与职业","book":"New Era English for Careers · 用英语讲中国故事","source":"下学期 U5 教学课件（VR版）"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段关于萨拉与帕特里克在非洲“一带一路”支教经历的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u5-vocabulary-focus-exC.mp3","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["primary","resources","basic","convinced","career"],"gaps":[{"who":"Sara","html":"Hi, Patrick. I haven’t seen you in ages! How was your year in Africa?"},{"who":"Patrick","html":"Hi, Sara. It was amazing, thank you. I loved it there."},{"who":"Sara","html":"You were working with young children, weren’t you?"},{"who":"Patrick","html":"Yes. I joined the Belt and Road Initiative in Malawi where I worked as a teacher in a <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\"> school. The children I was teaching were 10-12 years old."},{"who":"Sara","html":"And was it hard working there?"},{"who":"Patrick","html":"Yes, it was tough sometimes. We didn’t have many teaching <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> at all, and the classrooms were very <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\">. Class sizes were big too!"},{"who":"Sara","html":"You must have enjoyed it to stay the whole year though."},{"who":"Patrick","html":"I did. The children were wonderful. The whole experience <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> me that I want to train as a teacher now. I know it’s the right <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> for me."}],"script":[["Sara","Hi, Patrick. I haven’t seen you in ages! How was your year in Africa?"],["Patrick","Hi, Sara. It was amazing, thank you. I loved it there."],["Sara","You were working with young children, weren’t you?"],["Patrick","Yes. I joined the Belt and Road Initiative in Malawi where I worked as a teacher in a primary school. The children I was teaching were 10-12 years old."],["Sara","And was it hard working there?"],["Patrick","Yes, it was tough sometimes. We didn’t have many teaching resources at all, and the classrooms were very basic. Class sizes were big too!"],["Sara","You must have enjoyed it to stay the whole year though."],["Patrick","I did. The children were wonderful. The whole experience convinced me that I want to train as a teacher now. I know it’s the right career for me."]],"translation":[["萨拉","嗨，帕特里克。我好久没见到你了！你在非洲的一年过得怎么样？"],["帕特里克","嗨，萨拉。过得非常好，谢谢你。我很喜欢那里。"],["萨拉","你是在和孩子们一起工作，对吗？"],["帕特里克","是的，我参加了“一带一路”倡议项目，在马拉维的一所小学里当老师。教10到12岁的孩子。"],["萨拉","在那边工作辛苦吗？"],["帕特里克","嗯，有时候确实很艰苦。我们根本没有多少教学资源，所有的教室都很简陋。而且班上的学生也很多。"],["萨拉","不过你一定很喜欢那里，毕竟在那里待了一整年。"],["帕特里克","是的，我很喜欢。孩子们都很棒。这段经历让我确信我现在想成为一名教师。我知道这个职业很适合我。"]],"note":"词库：primary, resources, basic, convinced, career。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Social media: Will it HELP or HINDER your job search?","lead":"阅读课文，了解雇主如何借助社交媒体评估求职者，以及求职者应警惕在线上发布的内容。","audio":"assets/audio/s2-u5-reading-passage.mp3","audioLabel":"课文原声 · Social media and career success"},"chatting":{"title":"Chatting · Online footprint","lead":"听一段关于社交媒体求职的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u5-chatting-listening.mp3","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["find interesting work","online footprint","All sorts of","bother looking at","positive and professional"],"gaps":[{"who":"Lucy","html":"Hi, Sam. What are you doing?"},{"who":"Sam","html":"Job-hunting! Social media is the place to <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\">. But there is a lot of spam here."},{"who":"Lucy","html":"Yeah, I agree. You need to be careful."},{"who":"Sam","html":"What do you mean?"},{"who":"Lucy","html":"Well, how clean is your <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\">?"},{"who":"Sam","html":"I don’t know. I’m on social media a lot, you know!"},{"who":"Lucy","html":"And what kind of things do you post?"},{"who":"Sam","html":"<input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> things. Photos from nights out, jokes… I comment on other people’s posts sometimes."},{"who":"Lucy","html":"Is there anything a recruiter would be unhappy about?"},{"who":"Sam","html":"Well, probably. They’re not going to <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> all my posts, are they?"},{"who":"Lucy","html":"They might! If I were you, I’d start looking at my social media accounts right now and removing anything that doesn’t create a <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> impression."}],"script":[["Lucy","Hi, Sam. What are you doing?"],["Sam","Job-hunting! Social media is the place to find interesting work. But there is a lot of spam here."],["Lucy","Yeah, I agree. You need to be careful."],["Sam","What do you mean?"],["Lucy","Well, how clean is your online footprint?"],["Sam","I don’t know. I’m on social media a lot, you know!"],["Lucy","And what kind of things do you post?"],["Sam","All sorts of things. Photos from nights out, jokes… I comment on other people’s posts sometimes."],["Lucy","Is there anything a recruiter would be unhappy about?"],["Sam","Well, probably. They’re not going to bother looking at all my posts, are they?"],["Lucy","They might! If I were you, I’d start looking at my social media accounts right now and removing anything that doesn’t create a positive and professional impression."]],"translation":[["露西","嗨，萨姆。你在做什么？"],["萨姆","找工作！社交媒体是找有趣工作的地方，但是垃圾邮件很多。"],["露西","是啊，我同意。你要小心点。"],["萨姆","什么意思？"],["露西","嗯，你的网络足迹有多干净？"],["萨姆","我不清楚。我经常用社交媒体，你知道的！"],["露西","那你都发些什么东西？"],["萨姆","各种各样的内容。晚上出去玩的照片，笑话……有时也会评论别人的帖子。"],["露西","有没有雇主看了会不高兴的内容？"],["萨姆","嗯，可能会有。他们不会费心看我所有的帖子吧？"],["露西","他们可能会看！如果我是你，我现在就会开始查看我的社交媒体账户，并删除任何不能留下积极、专业印象的内容。"]],"note":"词库：find interesting work, online footprint, All sorts of, bother looking at, positive and professional。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · A wave of guochao products flood social media","lead":"阅读关于“国潮”风靡社交媒体的专题，了解中国品牌与传统文化在数字化时代的传播与升级。","audio":"assets/audio/s2-u5-pride-of-china.mp3","audioLabel":"专题原声 · Guochao","note":"本专题讲述“国潮”风靡社交媒体的现象，了解中国品牌与传统文化在数字化时代的传播与升级。"}}});

<script>
window.__PENDING_UNITS.push({"id":"s2-u6","readyNo":6,"data":{"WORDS":[{"w":"degree","pos":"n.","zh":"学位；程度","lv":"","eg":"My brother has a master's degree from Harvard.","egZh":"我哥哥有哈佛大学的硕士学位。"},{"w":"goal","pos":"n.","zh":"目标，目的","lv":"","eg":"You need to set yourself some long-term goals.","egZh":"你得为自己订一些长期目标。"},{"w":"intern","pos":"n.","zh":"实习生","lv":"","eg":"He is a summer intern at a law firm.","egZh":"他是暑假在法律事务所实习的学生。"},{"w":"outstanding","pos":"adj.","zh":"杰出的，优秀的","lv":"","eg":"He is an outstanding athlete and deserved to win.","egZh":"他是位优秀的运动员，赢得比赛也是理所当然。"},{"w":"participate","pos":"v.","zh":"参加，参与","lv":"","eg":"We encourage students to participate fully in the running of the college.","egZh":"我们鼓励学生全面参与学院的运作。"},{"w":"long term","pos":"phr.","zh":"长期的；长远的","lv":"","eg":"The agreement should have very positive results in the long term.","egZh":"从长远来看，这个协议将会产生非常积极的影响。"},{"w":"short term","pos":"phr.","zh":"短期","lv":"","eg":"In the short term, chemical sprays are clearly an effective way to control pests.","egZh":"从短期来看，喷洒化学药品显然能有效控制虫害。"},{"w":"social activity","pos":"phr.","zh":"社交活动","lv":"","eg":"You should take an active part in social activities.","egZh":"你应该积极参加社会活动。"},{"w":"acronym","pos":"n.","zh":"首字母缩略词","lv":"","eg":"Can you tell me what this acronym stands for?","egZh":"您能告诉我这个缩写代表什么意思吗？"},{"w":"attainable","pos":"adj.","zh":"可达到的；可得到的","lv":"","eg":"It is unrealistic to believe perfection is an attainable goal.","egZh":"相信完美可以企及是不现实的。"},{"w":"examine","pos":"v.","zh":"检查；调查","lv":"","eg":"The goods were examined for damage on arrival.","egZh":"货物到达时检查是否有破损。"},{"w":"measurable","pos":"adj.","zh":"可测量的；明显的","lv":"","eg":"Economists emphasize measurable quantities — the number of jobs, the per capita income, etc.","egZh":"经济学家看重的是可测定的量——岗位数量、人均收入等。"},{"w":"specific","pos":"adj.","zh":"具体的；明确的","lv":"","eg":"I ask him to be more specific.","egZh":"我要求他说得更具体些。"},{"w":"time-bound","pos":"adj.","zh":"有时限的","lv":"","eg":"The goal is not time-bound because it has no starting point, no ending point, and no fixed duration.","egZh":"该目标没有时限，因为它既无起止时间，也无固定期限。"},{"w":"have a connection to","pos":"phr.","zh":"与……有联系","lv":"","eg":"Williams apparently has a connection to the case.","egZh":"威廉姆斯显然和此案有关系。"},{"w":"instead of","pos":"phr.","zh":"代替；而不是","lv":"","eg":"Take a shower instead of a bath.","egZh":"洗淋浴吧，别用浴缸了。"},{"w":"compromise","pos":"v.","zh":"折中，妥协","lv":"#","eg":"A wedding often requires compromise between two families.","egZh":"婚礼往往需要我们双方相互妥协。"},{"w":"honeymoon","pos":"n.","zh":"蜜月","lv":"#","eg":"They decided to make a honeymoon of the trip.","egZh":"他们决定把这次旅行当作蜜月。"},{"w":"scholarship","pos":"n.","zh":"奖学金","lv":"**","eg":"Ella has just got a scholarship for a university in New York.","egZh":"埃拉刚刚获得纽约一所大学的奖学金。"},{"w":"rain forest","pos":"phr.","zh":"（热带）雨林","lv":"**","eg":"The rain forest would not be the place for her.","egZh":"热带雨林不适合她。"},{"w":"the Amazon jungle","pos":"phr.","zh":"亚马孙丛林","lv":"**","eg":"He wanted to do volunteer work in the Amazon jungle.","egZh":"他想去亚马孙丛林做志愿工作。"}],"GLOSS":{"acronym":{"w":"SMART acronym","pos":"n.","zh":"SMART 首字母缩略词","def":"a word formed from the first letters of a series of words","eg":"Can you tell me what this acronym stands for?","egZh":"您能告诉我这个缩写代表什么意思吗？","src":"Reading · Words & Expressions"},"standfor":{"w":"stand for","pos":"phr.","zh":"（字母或符号）代表，表示","def":"if a letter or symbol stands for something, it represents a word or idea, especially as a short form","eg":"What does ATM stand for?","egZh":"ATM 是什么意思？","src":"Reading · Language notes (slide 23)"},"insteadof":{"w":"instead of","pos":"phr.","zh":"代替；而不是","def":"in place of; as an alternative to","eg":"Take a shower instead of a bath.","egZh":"洗淋浴吧，别用浴缸了。","src":"Reading · Words & Expressions"},"complete":{"w":"complete","pos":"v.","zh":"结束，完成","def":"to finish doing or making something, especially when it has taken a long time","eg":"The building took two years to complete.","egZh":"这幢大楼花了两年时间才完工。","src":"Reading · Language notes (slide 24)"},"realistic":{"w":"realistic","pos":"adj.","zh":"现实的，能够实现的","def":"something that is possible to achieve; opposite of unrealistic","eg":"I don't think they have a realistic chance of winning.","egZh":"我认为他们没有机会赢。","src":"Reading · Language notes (slide 25)"},"relevant":{"w":"relevant","pos":"adj.","zh":"有关的，切题的","def":"directly relating to the subject or problem being discussed or considered; opposite of irrelevant","eg":"Relevant documents were presented in court.","egZh":"法庭上出示了相关的文件。","src":"Reading · Language notes (slide 26)"},"conn":{"w":"have a connection to","pos":"phr.","zh":"与……有联系","def":"to be related to something","eg":"Williams apparently has a connection to the case.","egZh":"威廉姆斯显然和此案有关系。","src":"Reading · Words & Expressions"},"ln1":{"isNote":true,"w":"段⑥ 长句 · 条件句","sent":"If you follow the SMART acronym, you will become better at making and completing important goals in your life.","zh":"遵循 SMART 原则，你就会在制定和完成生活中的重要目标上做得更好。","def":"if 引导的条件句，主句用一般将来时（will + 动词原形），表示假设条件下的结果，属于第一条件句。","points":["SMART acronym","become better at"],"src":"Reading · Grammar Focus (条件句, slide 45)"}},"PASSAGE":[{"no":"①","text":"In today’s presentation, I'll be talking about how to set yourself goals. Setting goals allows you to choose how you live your life. If you want to become better at setting goals, use the SMART [[acronym|acronym]] to help you. Let's take a look at what each letter [[standfor|stands for]]. Choose a clear goal, which includes information about why it is important and where it will happen. For example, [[insteadof|instead of]] saying \"I want to start a babysitting business,\" you should say, \"A lot of people in my neighborhood are finding it difficult to organize childcare. I'm going to start a babysitting business to make money and help to meet a need among local families.\""},{"no":"②","text":"Measuring a goal will tell you how near or far you are from [[complete|completing]] it. For example, [[insteadof|instead of]] saying \"I'm going to have lots of customers,\" you should say, \"I aim to have 20 customers by the end of the month.\""},{"no":"③","text":"It is important to examine your skills honestly and decide on a [[realistic|realistic]] goal. For example, [[insteadof|instead of]] saying \"I'm going to become the most successful entrepreneur in my country,\" you should say, \"I'm going to establish a good reputation for my childcare business in my local neighborhood.\""},{"no":"④","text":"This means that the goal has a [[conn|connection to]] your life now. Ask yourself, \"Is this the right time?\" \"Am I ready for this?\" For example, if you are planning to start a babysitting business, aiming to learn first aid might be [[relevant|relevant]]."},{"no":"⑤","text":"You should always have a target time for [[complete|completing]] the goal. For example, [[insteadof|instead of]] saying \"I'm going to start my own business,\" you should say, \"I aim to have five customers by the end of the month.\""},{"no":"⑥","text":"[[ln1|If you follow the SMART acronym, you will become better at making and completing important goals in your life.]]"}],"PASSAGE_ZH":[{"no":"①","text":"在今天的演讲中，我将会讲到如何给自己制定目标。制定目标让你可以选择自己的生活方式。如果你想在制定目标方面有所进步，SMART原则可以帮到你。让我们来看看缩略词 SMART 中的每个字母都代表什么含义。首先，要选择一个清晰的目标，制定目标时要明确目标的重要性、达成目标的地点等信息。举例来说，如果你想要开办一项托儿业务，不应该说：\"我想开办一项托儿业务。\"而应该说：\"我家附近很多人在照管孩子方面遇到了困难。所以我要开办一项托儿业务来挣钱，同时帮助满足邻居们的需求。\""},{"no":"②","text":"通过衡量一个目标，你就能知道自己距离完成这个目标还有多近或多远。举例来说，制定目标时，不要说：\"我要拥有很多顾客。\"而要说：\"我的目标是在这个月底之前拥有 20 位顾客。\""},{"no":"③","text":"目标具有可实现性就是说这个目标是可以达成的。正视自己的能力并选定一个现实的目标是非常重要的。举例来说，你不应该说：\"我要成为我国最成功的企业家。\"而应该说：\"我要在社区里为我的托儿业务建立良好的声誉。\""},{"no":"④","text":"相关性指的是你的目标应该与你现在的生活有一定的联系。问问自己：\"现在是合适的时机吗？\"\"我准备好了吗？\"举例来说，如果你计划开办一项托儿业务，那么学习急救知识可能就是一个具有相关性的目标。"},{"no":"⑤","text":"你应该始终有一个完成目标的目标时间。举例来说，制定目标时，不应该说：\"我要开办自己的业务。\"而应该说：\"我的目标是在月底之前拥有 5 位顾客。\""},{"no":"⑥","text":"遵循 SMART 原则，你就会变得更擅长于制定和完成生活中的重要目标。"}],"READING_QS":[{"q":"According to the passage, what does the letter \"S\" in SMART stand for?","o":["Specific（明确性）","Measurable（可衡量性）","Achievable（可实现性）"],"a":0,"y":"出自课文第①段：Choose a clear goal... 明确性（Specific）要求目标清晰具体，对应演讲中的 \"S\"。"},{"q":"Which of the following is given as an example of a measurable goal?","o":["I want to have lots of customers.","I aim to have 20 customers by the end of the month.","I'm going to start my own business."],"a":1,"y":"出自第②段，衡量目标用具体数字：\"I aim to have 20 customers by the end of the month.\" 而另两项均为反面例子。"},{"q":"Why should a goal be \"relevant\"?","o":["It must be completed as quickly as possible.","It should have a connection to your life now.","It should be as big as possible."],"a":1,"y":"出自第④段：This means that the goal has a connection to your life now. 相关性指目标应与当下生活有联系。"},{"q":"According to the passage, which goal is described as unrealistic?","o":["Having five customers by the end of the month.","Becoming the most successful entrepreneur in my country.","Learning first aid before starting a babysitting business."],"a":1,"y":"出自第③段反面例子：\"I'm going to become the most successful entrepreneur in my country\" 被替换为更现实的目标，说明其不现实。"}],"PATTERNS":[{"fn":"01 · 说明短期目标","frame":"My short-term goal is to ...","ex":"My short-term goal is to pass all my exams at the end of this semester.","zh":"用于清晰地说明自己近期的目标。"},{"fn":"02 · 表达开始考虑长期目标","frame":"I've started to think of long-term goals.","ex":"But recently I've started to think of long-term goals.","zh":"表示近期开始把目光放长远。"},{"fn":"03 · 用反问提出建议","frame":"So why not ... ?","ex":"So why not take Ella there and make a honeymoon of it?","zh":"用 why not 委婉地提出建议或方案。"},{"fn":"04 · 表示不得不妥协","frame":"we will have to ...","ex":"if we get married now, we will have to compromise.","zh":"说明在某种情况下必须做出折中或让步。"},{"fn":"05 · 向他人请教方法","frame":"Do you have any good methods for ... ?","ex":"Do you have any good methods for setting goals?","zh":"礼貌地请求对方分享经验或方法。"},{"fn":"06 · 提醒目标要符合 SMART 原则","frame":"Make sure your goals are ...","ex":"Make sure your goals are specific, measurable, attainable, relevant, and time-bound.","zh":"总结并提醒目标应具备的五个特征。"}],"CHAT_TIPS":["听前先浏览填空位置，预测所需词性（动词短语、名词或形容词）。","注意现在完成进行时 \"have been together\" 与 \"have been offered\" 的连读与重音。","对话主题围绕结婚与人生规划，留意 but / however 等转折词后的真实态度。","补全后结合上下文核对语义是否通顺，如 \"stopping you from getting married\"。","关注 \"why not ...\" 建议句型与 \"have to compromise\" 等地道表达，积累交际用语。"],"PRIDE_PASSAGE":[{"no":"①","text":"The BeiDou Navigation Satellite System (BDS), launched in 1994, is a global navigation satellite system built by and operated by China. As an important spatiotemporal system, it can provide information about positioning, navigation and timing for global users."},{"no":"②","text":"In the late 20th century, China formulated a three-step development strategy (三步走发展战略). Work on BDS-1 and BDS-2 was completed in 2000 and 2012, respectively. When BDS-3 was completed and put into service on July 31, 2020, China became the third country to have an independent global navigation satellite system."},{"no":"③","text":"Since provision of services, BDS has been widely used in various industries related to the country's economic and social development, profoundly changing people's production and life. The BDS development team have worked hard for years to meet the challenges of research."},{"no":"④","text":"In the new era, they have fostered a BeiDou spirit of \"independent innovation, openness and inclusiveness, unity of purpose, and pursuit of excellence\". In the years to come, China will further upgrade BDS technologies, functions and services. The goal is to create a comprehensive spatiotemporal system that is more extensive, more integrated, and more intelligent. In doing so, China will help improve people's well-being and build a global community of shared future."}],"PRIDE_ZH":[{"no":"①","text":"1994年启动的北斗卫星导航系统（BDS）是中国自主建设和运营的全球卫星导航系统。作为国家重要时空基础设施，它能为全球用户提供定位、导航和授时服务。"},{"no":"②","text":"20世纪后期，中国制定了\"三步走发展战略\"。北斗一号系统和北斗二号系统分别于2000年和2012年建成。2020年7月31日，随着北斗三号系统建成并投入使用，中国成为世界上第三个拥有独立全球导航卫星系统的国家。"},{"no":"③","text":"北斗系统自提供服务以来，已被广泛应用于与国家经济社会发展相关的各个行业，深刻改变了人们的生产和生活方式。多年来，北斗系统研发团队一直在积极应对并努力克服研究中的挑战。"},{"no":"④","text":"在新时代，他们培养了\"自主创新、开放融合、万众一心、追求卓越\"的北斗精神。未来几年，中国将进一步升级北斗系统技术、功能和服务水平，目标是构建更广泛、更集成、更智能的综合时空系统。通过这样做，中国将帮助改善人民福祉，推动构建人类命运共同体。"}],"PRIDE_CULTURE":"北斗卫星导航系统是中国着眼于国家安全和经济社会发展需要，自主建设、独立运行的全球卫星导航系统，也是国家重要的时空基础设施。从1994年启动到2020年北斗三号全球组网完成，中国用二十余年走完了其他国家三四十年走过的路，体现了\"三步走\"发展战略中目标清晰、分步推进的智慧。\"自主创新、开放融合、万众一心、追求卓越\"的北斗精神，正是中国人民设定远大目标并持之以恒加以实现的一个缩影，也为本课\"设定目标（setting goals）\"的主题提供了生动的中国案例。","PRIDE_QS":[{"q":"北斗系统能为全球用户提供哪些服务？","o":["定位、导航和授时","天气预报和地震预警","网上购物与支付"],"a":0,"y":"出自第①段：it can provide information about positioning, navigation and timing for global users."},{"q":"中国成为世界上第几个拥有独立全球导航卫星系统的国家？","o":["第二个","第三个","第四个"],"a":1,"y":"出自第②段：China became the third country to have an independent global navigation satellite system."},{"q":"北斗三号系统于哪一年建成并投入使用？","o":["2000年","2012年","2020年"],"a":2,"y":"出自第②段：BDS-3 was completed and put into service on July 31, 2020."},{"q":"下列哪项不属于北斗精神？","o":["自主创新","开放融合","闭门造车"],"a":2,"y":"出自第④段，北斗精神为\"自主创新、开放融合、万众一心、追求卓越\"，\"闭门造车\"与之相悖。"}],"PRIDE_CET4":[{"w":"launch","pos":"v.","zh":"发射；启动","eg":"The BeiDou Navigation Satellite System (BDS), launched in 1994, is a global navigation satellite system."},{"w":"global","pos":"adj.","zh":"全球的","eg":"...is a global navigation satellite system built by and operated by China."},{"w":"independent","pos":"adj.","zh":"独立的","eg":"China became the third country to have an independent global navigation satellite system."},{"w":"strategy","pos":"n.","zh":"战略","eg":"China formulated a three-step development strategy."},{"w":"complete","pos":"v.","zh":"完成","eg":"Work on BDS-1 and BDS-2 was completed in 2000 and 2012."},{"w":"service","pos":"n.","zh":"服务；投入使用","eg":"When BDS-3 was completed and put into service on July 31, 2020..."},{"w":"widely","pos":"adv.","zh":"广泛地","eg":"BDS has been widely used in various industries related to the country's economic and social development."},{"w":"economic","pos":"adj.","zh":"经济的","eg":"...the country's economic and social development..."},{"w":"challenge","pos":"n.","zh":"挑战","eg":"The BDS development team have worked hard for years to meet the challenges of research."},{"w":"upgrade","pos":"v.","zh":"升级","eg":"In the years to come, China will further upgrade BDS technologies, functions and services."},{"w":"intelligent","pos":"adj.","zh":"智能的","eg":"...a comprehensive spatiotemporal system that is more extensive, more integrated, and more intelligent."},{"w":"improve","pos":"v.","zh":"改善；提高","eg":"China will help improve people's well-being and build a global community of shared future."}],"PRIDE_PHRASES":[{"p":"put into service","zh":"投入使用","eg":"When BDS-3 was completed and put into service on July 31, 2020..."},{"p":"in the late 20th century","zh":"20世纪后期","eg":"In the late 20th century, China formulated a three-step development strategy."},{"p":"work on","zh":"致力于；进行……的工作","eg":"Work on BDS-1 and BDS-2 was completed in 2000 and 2012."},{"p":"a three-step development strategy","zh":"三步走发展战略","eg":"China formulated a three-step development strategy (三步走发展战略)."},{"p":"in the years to come","zh":"在未来几年","eg":"In the years to come, China will further upgrade BDS technologies, functions and services."},{"p":"meet the challenges of","zh":"应对……的挑战","eg":"The BDS development team have worked hard for years to meet the challenges of research."},{"p":"build a global community of shared future","zh":"推动构建人类命运共同体","eg":"...build a global community of shared future."}],"PRIDE_PATTERNS":[{"t":"现在完成时被动语态","frame":"has / have been + 过去分词","eg":"BDS has been widely used in various industries.","zh":"描述从过去持续到现在并仍在产生影响的状态，强调北斗系统已产生的广泛影响。"},{"t":"when 引导的时间状语从句","frame":"When + 从句, 主句","eg":"When BDS-3 was completed and put into service on July 31, 2020, China became the third country to have an independent global navigation satellite system.","zh":"表示一个动作（建成投入使用）发生时，另一个动作（成为第三国）随之发生。"},{"t":"in doing so 结果状语","frame":"In doing so, 主句","eg":"In doing so, China will help improve people's well-being and build a global community of shared future.","zh":"\"通过这样做\"引出前述行动带来的结果，常用于说明举措的意义。"}],"GAP_ANSWERS":{"vf":["pass","degree","graduates","intern","Relationships"],"chatting":["have been together","do volunteer work","make a honeymoon","stopping you from","have to compromise"]},"QUESTIONS":{"vf":[{"q":"What is Amy's short-term goal?","opts":["To get a good degree.","To pass all her exams this semester.","To find an internship."],"a":1,"why":"出自 Vocabulary Focus C 脚本：Amy 说 \"my short-term goal is to pass all my exams at the end of this semester.\""},{"q":"According to Amy, what do outstanding graduates have?","opts":["Much wider opportunities to choose from.","A guaranteed job.","Free internships."],"a":0,"why":"出自 Amy 的台词：\"Outstanding graduates have much wider opportunities to choose from.\""},{"q":"Besides career goals, what does Amy think is also important?","opts":["Making money.","Relationships.","Traveling abroad."],"a":1,"why":"出自 Amy 的台词：\"Relationships are also important.\""}],"chatting":[{"q":"How long have Andy and Ella been together?","opts":["A few months.","For years.","They just met."],"a":1,"why":"出自 Chang 的台词：\"You two have been together for years now!\""},{"q":"What has Andy always wanted to do?","opts":["Get a scholarship in New York.","Do volunteer work in the Amazon jungle.","Get married immediately."],"a":1,"why":"出自 Andy 的台词：\"I've always wanted to do volunteer work in the Amazon jungle.\""},{"q":"Why would Andy and Ella have to compromise if they married now?","opts":["Ella got a scholarship in New York and he an internship in Germany.","They don't love each other.","Ella dislikes insects."],"a":0,"why":"出自 Andy 的台词：Ella 拿到纽约奖学金、他得到德国实习机会，因此结婚就得相互妥协。"}]},"SP_GROUPS":[{"group":"Grammar Focus · Conditionals（条件句）","cards":[{"no":"①","title":"零条件句（表事实）","sent":"If you heat water to 100℃, it boils.","zh":"表示客观事实或普遍真理。","items":[{"lb":"句型","df":"if + 一般现在时，一般现在时","egs":[["If you heat water to 100℃, it boils.","如果你将水加热到100摄氏度，它会沸腾。"],["The ice melts if the temperature rises.","如果温度上升，冰会融化。"]]}],"src":"课件 Grammar Focus · Conditionals (slide 46)"},{"no":"②","title":"第一条件句（表可能）","sent":"If it rains tomorrow, we will cancel the picnic.","zh":"表示将来可能发生的情况及其结果。","items":[{"lb":"句型","df":"if + 一般现在时，will + 动词原形","egs":[["If it rains tomorrow, we will cancel the picnic.","如果明天下雨，我们会取消野餐。"],["I will call you if I have time tonight.","如果我今晚有时间，我会给你打电话。"]]}],"src":"课件 Grammar Focus · Conditionals (slide 47)"},{"no":"③","title":"第二条件句（表假设，与现在事实相反）","sent":"If she were here right now, she would help us solve the problem.","zh":"表示与现在事实相反的想象或假设。","items":[{"lb":"句型","df":"if + 一般过去时，would + 动词原形","egs":[["If she were here right now, she would help us solve the problem.","如果她现在在这里，她会帮助我们解决问题。"],["I would volunteer at a charity if I had more free time.","如果我有更多空闲时间，我会做慈善工作。"]]}],"src":"课件 Grammar Focus · Conditionals (slide 48)"},{"no":"④","title":"第三条件句（表假设，与过去事实相反）","sent":"If I had saved more money, I would have traveled around the world.","zh":"表示与过去事实相反的想象或假设。","items":[{"lb":"句型","df":"if + 过去完成时，would have + 过去分词","egs":[["If I had saved more money, I would have traveled around the world.","如果我存了更多的钱，我就能环游世界了。"],["He would have attended the event if he had received the invitation.","如果他收到了邀请，他就会参加那个活动。"]]}],"src":"课件 Grammar Focus · Conditionals (slide 49)"}]},{"group":"Language notes · 课文长句","cards":[{"no":"①","title":"条件句（课文原句）","sent":"If you follow the SMART acronym, you will become better at making and completing important goals in your life.","zh":"遵循 SMART 原则，你就会在制定和完成生活中的重要目标上做得更好。","items":[{"lb":"结构","df":"if + 一般现在时，will + 动词原形（第一条件句）","egs":[["If you follow the SMART acronym, you will become better at making and completing important goals in your life.","遵循 SMART 原则，你将会做得更好。"]]}],"src":"Reading · Grammar Focus (条件句, slide 45)"}]}]},"content":{"unit":{"title":"Setting smart goals","zh":"设定目标","book":"New Era English for Careers · 用英语讲中国故事","source":"下学期 U6_教学课件_VR版（新版）"},"vocabulary":{"title":"Vocabulary Focus · Exercise C","lead":"听一段陈珊和埃米关于未来规划的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u6-vocabulary-focus-exC.mp3","audioLabel":"练习 C 原声 · Listen and complete the conversation","bank":["pass","degree","graduates","intern","Relationships"],"gaps":[{"who":"Chen Shan","html":"What are your plans for the future, Amy?"},{"who":"Amy","html":"Well, my short-term goal is to <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\"> all my exams at the end of this semester."},{"who":"Chen Shan","html":"Me too! But recently I've started to think of long-term goals. You know, I really want to get a good <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\">."},{"who":"Amy","html":"I've been thinking about that too. Outstanding <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> have much wider opportunities to choose from."},{"who":"Chen Shan","html":"That's true. A good degree also means you have a chance of getting an <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> position after graduation."},{"who":"Amy","html":"We shouldn't just think about career goals though. <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\"> are also important."},{"who":"Chen Shan","html":"You're right. But first I want to feel satisfied with where my career is going."}],"script":[["Chen Shan","What are your plans for the future, Amy?"],["Amy","Well, my short-term goal is to pass all my exams at the end of this semester."],["Chen Shan","Me too! But recently I've started to think of long-term goals. You know, I really want to get a good degree."],["Amy","I've been thinking about that too. Outstanding graduates have much wider opportunities to choose from."],["Chen Shan","That's true. A good degree also means you have a chance of getting an intern position after graduation."],["Amy","We shouldn't just think about career goals though. Relationships are also important."],["Chen Shan","You're right. But first I want to feel satisfied with where my career is going."]],"translation":[["陈珊","你对未来有什么计划，埃米？"],["埃米","嗯，我的短期目标是在这个学期末通过所有考试。"],["陈珊","我也是！但是最近我开始考虑长期目标。你知道的，我真的很想拿到一个好学位。"],["埃米","我也一直在思考这个问题。优秀的毕业生拥有的选择机会比别人多得多。"],["陈珊","没错。拥有一个好学位也意味着你在毕业后有机会得到一个实习岗位。"],["埃米","不过，我们不应该只考虑职业目标。人际关系也很重要。"],["陈珊","你说得对。但首先，我想在我的职业发展上令自己满意。"]],"note":"词库：pass, degree, graduates, intern, Relationships。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"reading":{"title":"Reading · Setting smart goals","lead":"运用 SMART 原则制定目标的演讲课文，听原声跟读并理解每段含义。","audio":"assets/audio/s2-u6-reading-passage.mp3","audioLabel":"课文原声 · Setting smart goals"},"chatting":{"title":"Chatting · Listen and complete the conversation","lead":"听一段安迪和常关于结婚与人生规划的对话，补全空缺，再核对对话理解。","audio":"assets/audio/s2-u6-chatting-listening.mp3","audioLabel":"Chatting 原声 · Listen and complete the conversation","bank":["have been together","do volunteer work","make a honeymoon","stopping you from","have to compromise"],"gaps":[{"who":"Andy","html":"Ella wants to tie the knot, but I'm not sure."},{"who":"Chang","html":"Why not? You two <input class=\"gap\" data-gap=\"1\" placeholder=\"(1)\" autocomplete=\"off\"> for years now!"},{"who":"Andy","html":"I know! But there are so many things I want to do."},{"who":"Chang","html":"Can't you do them together?"},{"who":"Andy","html":"Not really. I've always wanted to <input class=\"gap\" data-gap=\"2\" placeholder=\"(2)\" autocomplete=\"off\"> in the Amazon jungle, for example."},{"who":"Chang","html":"So why not take Ella there and <input class=\"gap\" data-gap=\"3\" placeholder=\"(3)\" autocomplete=\"off\"> of it?"},{"who":"Andy","html":"You don't know Ella! She really doesn't like insects, so I don't think the rain forest would be the place for her."},{"who":"Chang","html":"Is that the only thing that's <input class=\"gap\" data-gap=\"4\" placeholder=\"(4)\" autocomplete=\"off\"> getting married?"},{"who":"Andy","html":"No. Ella has just got a scholarship for a university in New York and I've been offered an internship in Germany. So, if we get married now, we'll <input class=\"gap\" data-gap=\"5\" placeholder=\"(5)\" autocomplete=\"off\">."},{"who":"Chang","html":"I see! I think you two need to talk about this."}],"script":[["Andy","Ella wants to tie the knot, but I'm not sure."],["Chang","Why not? You two have been together for years now!"],["Andy","I know! But there are so many things I want to do."],["Chang","Can't you do them together?"],["Andy","I've always wanted to do volunteer work in the Amazon jungle, for example."],["Chang","So why not take Ella there and make a honeymoon of it?"],["Andy","You don't know Ella! She really doesn't like insects, so I don't think the rain forest would be the place for her."],["Chang","Is that the only thing that's stopping you from getting married?"],["Andy","No. Ella has just got a scholarship for a university in New York and I've been offered an internship in Germany. So, if we get married now, we'll have to compromise."],["Chang","I see! I think you two need to talk about this."]],"translation":[["安迪","埃拉想结婚，但我不太确定。"],["常","为什么不呢？你们俩在一起这么多年了！"],["安迪","我知道！但我还有很多事情想做。"],["常","你不能和她一起做吗？"],["安迪","不一定。比如说，我一直想去亚马孙丛林做志愿工作。"],["常","那为什么不带埃拉去那儿度蜜月呢？"],["安迪","你不了解埃拉！她真的不喜欢昆虫，所以我觉得热带雨林不适合她。"],["常","你不愿意结婚的原因只有这个吗？"],["安迪","不止。埃拉刚刚拿到了纽约一所大学的奖学金，而我得到了一个去德国实习的机会。所以，如果我们现在结婚，就得相互妥协。"],["常","我明白了！我想你们俩需要谈谈这件事。"]],"note":"词库：have been together, do volunteer work, make a honeymoon, stopping you from, have to compromise。填空可改变形式；核对后展开听力脚本与参考译文复核。"},"pride":{"title":"The Pride of China · BeiDou Navigation Satellite System","lead":"了解中国北斗卫星导航系统的建设历程与\"三步走\"发展目标，体会其中设定目标、分步推进的智慧。","audio":"assets/audio/s2-u6-pride-of-china.mp3","audioLabel":"专题原声 · BeiDou","note":"本专题讲述中国北斗卫星导航系统的建设历程与“三步走”发展目标，体会设定目标、分步推进的智慧。"}}});

/* Chatting · 按表达功能积累句型（取自本单元听力对话与课件示例句） */
let PATTERNS = [
  {fn:'01 · 说明近况与感受',frame:`I’m getting used to + n. / doing　·　I miss + n.　·　I suppose (that) …`,ex:`I’m getting used to it! / I miss the peace and quiet of the countryside. / I suppose I’m a country girl at heart.`,zh:'先说适应情况，再说怀念什么，最后点明自己本质上更偏向哪一边。'},
  {fn:'02 · 询问看法与差异',frame:`What do you think is the difference between A and B?　·　Are you enjoying …?`,ex:`What do you think is the difference between city life and life in the countryside?`,zh:'用一句问话把话题展开到对比，比直接问「你喜欢城市吗」更容易接话。'},
  {fn:'03 · 作比较',frame:`A is a lot / much + 比较级 (+ than B)　·　It’s so much + 比较级`,ex:`Life in the countryside is a lot slower and more friendly. / Life is so much easier here. It’s so convenient as well.`,zh:'用 a lot / much 修饰比较级，把两边差异说得具体而不绝对。'},
  {fn:'04 · 表达偏好',frame:`I’d rather + 动词原形　·　I prefer to do / doing　·　The …, for sure.`,ex:`I’d rather live in the city. / If you prefer to dress up as a princess… / The town, for sure.`,zh:'开门见山给立场，后面再补理由；三个句式可替换使用，避免重复。'},
  {fn:'05 · 部分同意与让步',frame:`Yes, I know what you mean. …, though.　·　Well, yes and no…　·　True. What about … though?`,ex:`Yes, I know what you mean. Life in the countryside is much more peaceful though. / True. What about job opportunities though?`,zh:'先接住对方，再用 though / but 补自己的角度，语气更自然。'},
  {fn:'06 · 委婉补充理由',frame:`That may be true, but …　·　There may be …, but …　·　You have access to better …`,ex:`That may be true, but I’d rather live in the city. / There may be lots of people in the town, but people in the countryside are more friendly.`,zh:'不同意时先承认对方有道理，再给出自己的依据，避免生硬反驳。'},
  {fn:'07 · 说明优势',frame:`… has lots of advantages　·　It’s so convenient as well.`,ex:`You’ll soon make friends here, and city life has lots of advantages.`,zh:'用概括句收束列举，适合在说了两三个具体理由之后使用。'},
  {fn:'08 · 保留分歧地收尾',frame:`I probably won’t be able to convince you. We’ll just have to agree to disagree!`,ex:`I probably won’t be able to convince you. We’ll just have to agree to disagree!`,zh:'观点不一致时的得体收束，比强行说服更符合英语讨论习惯。'}
];

  `There is said to be a porcelain jar in Venice from Dehua County in Fujian Province, China, which was brought back to Italy over 700 years ago by Marco Polo. At that time, Dehua was the trading center for porcelain, which was known as “white gold” in Europe. This fascination with porcelain has attracted people from all over the world to visit China.`,
  `Jingdezhen in Jiangxi Province is known as the “porcelain capital”. Through its porcelain it has promoted international cultural exchange and mutual learning. Nowadays, many foreign porcelain fans come to study here. They get their hands dirty and play with clay. And they also have the chance to visit various porcelain art exhibitions. This city, famous for its porcelain, is like an art salon without a roof, where many arts come together.`,
  `As time passes, the spirit of communicating through porcelain remains unchanged. With this product of clay and fire, people around the world are writing a new “China” legend together.`

  `江西省景德镇被誉为“瓷都”。通过瓷器，它促进了国际文化交流和相互学习。如今，许多外国瓷器爱好者来到这里学习。他们亲自动手，和泥土打交道。他们还有机会参观各种瓷器艺术展览。这座以瓷器闻名的城市，就像一个没有屋顶的艺术沙龙，汇聚了许多艺术形式。`,

  function shuffled(a,rnd){ var r=a.slice(); for(var i=r.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)), tmp=r[i]; r[i]=r[j]; r[j]=tmp; } return r; }

  /* 干扰词池：全站真实听填答案，去重 */
  var uniq=[], seen={};
  Object.keys(UDATA).forEach(function(uid){
    var ga=(UDATA[uid]||{}).GAP_ANSWERS||{};
    ['vf','chatting'].forEach(function(g){
      (ga[g]||[]).forEach(function(w){ var k=key(w); if(k && !seen[k]){ seen[k]=1; uniq.push(String(w)); } });
    });
  });

  Object.keys(CONTENT).forEach(function(uid){
    var ga=(UDATA[uid]||{}).GAP_ANSWERS||{};
    [['vocabulary','vf'],['chatting','chatting']].forEach(function(pair){
      var c=CONTENT[uid][pair[0]]; if(!c) return;
      var ans=(ga[pair[1]]||[]).map(String).filter(function(w){ return key(w); });
      if(!ans.length) return;
      var rnd=rng(seedOf(uid+':'+pair[1]));
      var used={}; ans.forEach(function(a){ used[key(a)]=1; });
      function available(w){
        var k=key(w); if(used[k] || !k) return false;
        for(var i=0;i<ans.length;i++){ var a=key(ans[i]); if(a.indexOf(k)>=0 || k.indexOf(a)>=0) return false; }
        return true;
      }
      var picked=[];
      /* 每个答案配一个同词数的干扰项，避免靠长短一眼排除 */
      ans.forEach(function(a){
        var target=wc(a), cand=uniq.filter(function(w){
          return available(w) && wc(w)===target && Math.abs(w.length-a.length)<=Math.max(8,target*5);
        });
        if(!cand.length) cand=uniq.filter(function(w){ return available(w) && Math.abs(wc(w)-target)<=1; });
        if(!cand.length) cand=uniq.filter(available);
        if(!cand.length) return;
        var w=cand[Math.floor(rnd()*cand.length)];
        used[key(w)]=1; picked.push(w);
      });
      /* 补足干扰项，使备选项明显多于空格数 */
      var extra=uniq.filter(available), need=Math.max(4,ans.length);
      while(picked.length<need && extra.length){
        var w2=extra.splice(Math.floor(rnd()*extra.length),1)[0];
        if(used[key(w2)]) continue;
        used[key(w2)]=1; picked.push(w2);
      }
      var bank=shuffled(ans.concat(picked),rnd);
      if(bank.length===ans.length && bank.every(function(w,i){ return key(w)===key(ans[i]); })) bank.reverse();
      c.bank=bank;
      c.bankDistractors=picked.length;
    });
  });
})();

function P(g){ const k=pkey(g); if(!prog[k] || typeof prog[k]!=='object') prog[k]={gaps:false,q:[]}; if(!Array.isArray(prog[k].q)) prog[k].q=[]; return prog[k]; }

function refUnlocked(group){

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getTerm(){ return TERMS.find(t=>t.id===state.term) || TERMS[0]; }
function getUnit(){ const t=getTerm(); return t.units.find(u=>u.no===state.unit) || t.units[0]; }
function getMod(){ return MODULES.find(m=>m.id===state.module) || MODULES[0]; }
function content(){ return CONTENT[state.term+'-u'+state.unit]; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

function parseHash(){
  const m = /^([a-z]\d+)-u(\d+)-([a-z]+)$/.exec(location.hash.replace(/^#/,''));
  if(!m) return false;
  const t = TERMS.find(x=>x.id===m[1]);
  const mod = MODULES.find(x=>x.id===m[3]);
  if(!t || !mod || !t.units.some(u=>u.no===Number(m[2]))) return false;
  state = {term:m[1], unit:Number(m[2]), module:m[3]};
  return true;
}
function go(patch){
  const next = Object.assign({}, state, patch);

}

/* 自动把访问码(?sharecode=...) 拼到音频地址，使整站自包含、分享链接也能放音 */
function withShare(u){
  const s = location.search;
  return (s && s.charAt(0) === '?') ? (u + s) : u;
}

function wordAudioSrc(w){
  const dir = 'assets/audio/words-' + state.term + '-u' + state.unit + '/';
  return withShare(dir + String(w).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-') + '.mp3');
}
let speechSeq=0, wordAudioSeq=0, wordAudio=null, passageAudio=null;
function sayState(msg, bad){
  const g=document.getElementById('glossAudioState');
  if(g){ g.textContent=msg; g.className='audio-state'+(bad?' err':''); }
  const q=document.getElementById('ttsState');
  if(q) q.textContent=msg;
}
/* 主发音：本地 mp3（不依赖浏览器语音包，离线可播）；quiet=true 时状态栏不显示词条，用于听音选词防透题 */
function playWord(word, rate, quiet){
  if(!word) return;
  const my=++wordAudioSeq;
  speechSeq++;
  if(passageAudio && !passageAudio.paused) passageAudio.pause();
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  if(!wordAudio){ wordAudio=new Audio(); wordAudio.preload='auto'; }
  wordAudio.pause();
  wordAudio.onended=()=>{ if(my===wordAudioSeq) sayState('✓ 播放完毕，可再点一次重听。'); };
  wordAudio.onerror=()=>{
    if(my!==wordAudioSeq) return;
    sayState('该词发音文件未能加载，已改用浏览器朗读。',true);
    speak(word, quiet);
  };
  wordAudio.src=wordAudioSrc(word);
  wordAudio.playbackRate=rate||1;
  try{ wordAudio.currentTime=0; }catch(e){}
  const what = quiet ? '发音' : '：'+word;
  sayState((rate&&rate<1?'▶ 慢速 0.75× 播放':'▶ 正在播放')+what+' …');
  const pr=wordAudio.play();
  if(pr && pr.catch) pr.catch(()=>{
    if(my===wordAudioSeq) sayState('浏览器暂时阻止了播放，请再点一次按钮。',true);
  });
}
/* 兜底：浏览器 TTS。内嵌预览常无英语语音包，因此只作最后回退 */
function speak(word, quiet){
  speechSeq++;
  const my=speechSeq;
  if(!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance){
    sayState('当前浏览器不提供英语朗读，请点「听课件原声」听整篇真人录音。',true);
    return false;
  }
  try{
    const synth=window.speechSynthesis;
    const voices=synth.getVoices()||[];
    const v=voices.find(x=>/^en[-_]US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang))||null;
    const u=new SpeechSynthesisUtterance(word);
    if(v) u.voice=v;
    u.lang=(v&&v.lang)||'en-US'; u.rate=.8; u.pitch=1; u.volume=1;
    u.onstart=()=>{ if(my===speechSeq) sayState(quiet?'▶ 浏览器朗读中…':'▶ 浏览器朗读：'+word); };
    u.onend=()=>{ if(my===speechSeq) sayState('✓ 播放完毕。'); };
    u.onerror=e=>{ if(my===speechSeq) sayState('浏览器朗读未能播放（'+((e&&e.error)||'浏览器限制')+'），请点「听课件原声」。',true); };
    sayState(quiet?'▶ 正在请求朗读…':'▶ 正在请求浏览器朗读…');
    synth.cancel();
    /* Chrome 中 cancel() 与 speak() 连在同一同步调用会吞掉首次朗读 */
    setTimeout(()=>{ if(my===speechSeq) synth.speak(u); },80);
    return true;
  }catch(e){
    sayState('浏览器朗读不可用，请点「听课件原声」。',true);
    return false;
  }
}
function playPassage(){
  wordAudioSeq++; speechSeq++;
  if(wordAudio && !wordAudio.paused) wordAudio.pause();
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  const st=document.getElementById('ttsState');
  const ra = (content() && content().reading && content().reading.audio) || 'assets/audio/u1-reading-passage.mp3';
  if(!passageAudio || passageAudio.src.indexOf(ra)===-1){ passageAudio=new Audio(withShare(ra)); }
  passageAudio.onended=()=>{ if(st) st.textContent='✓ 课件原声播放完毕。'; };
  if(!passageAudio.paused){
    passageAudio.pause(); passageAudio.currentTime=0;
    if(st) st.textContent='已停止课件原声。';
    return;
  }
  passageAudio.currentTime=0;
  passageAudio.onended=()=>{ if(st) st.textContent='✓ 课件原声播放完毕。'; };
  passageAudio.play().then(()=>{ if(st) st.textContent='▶ 正在播放课件原声（真人录音，整篇课文）…'; })
    .catch(e=>{ if(st) st.textContent='课件原声未能播放：'+e.message+'（请检查音频文件或改用系统浏览器）。'; });
}

    ${qHtml}
    <div class="quiz-opts">${opts.map((oi,j)=>`<button class="quiz-opt" data-act="quiz-option" data-i="${oi}" ${quiz.answered?'disabled':''}>${esc(WORDS[oi].w)}</button>`).join('')}</div>
    <div class="quiz-fb ${quiz.answered?(quiz.lastOk?'ok':'bad'):''} ${quiz.answered?'show':''}" id="quizFb">
      ${quiz.answered ? (quiz.lastOk
        ? `<b>✓ 回答正确</b>　已记入本轮成绩。`
        : `<b>✗ 再记一次</b>　本题答案将在结算页统一给出。`) : ''}
    </div>
    <div class="quiz-foot">
      ${quiz.answered?`<button class="btn primary" data-act="quiz-next">${quiz.idx+1>=total?'查看结果':'下一题 →'}</button>`:''}
      ${quiz.mode==='listen'?`<button class="btn sm" data-act="quiz-hint">显示中文提示</button>`:''}
      <button class="btn sm" data-act="quiz-restart">重新练习</button>
    </div>`;
}
function renderQuizResult(){
  const total = quiz.queue.length;
  const pct = Math.round(quiz.correct/total*100);
  const title = pct>=90?'掌握得很扎实':pct>=70?'再过一遍错词就稳了':'建议回看词表后再练一轮';
  document.getElementById('quizBody').innerHTML = `
    <div class="quiz-result">
      <div class="score">${quiz.correct}<small> / ${total}</small></div>
      <h3>${title}</h3>
      <p>本轮题型：${quiz.mode==='meaning'?'释义匹配':'听音选词'}　·　覆盖率：本单元 ${WORDS.length} 个重点词</p>
      ${quiz.wrong.length?`<div class="wrong-words">${quiz.wrong.map(i=>`<span class="chip red">${esc(WORDS[i].w)} · ${esc(WORDS[i].zh)}</span>`).join('')}</div>`:'<p>全部答对，没有错词。</p>'}
      <div class="btn-row" style="justify-content:center;margin-top:18px;">
        <button class="btn primary" data-act="quiz-restart">重新练习（重新随机）</button>
        <button class="btn" data-act="quiz-mode" data-mode="${quiz.mode==='meaning'?'listen':'meaning'}">换一种题型</button>
      </div>
    </div>`;
}
function answerQuiz(oi){
  if(!quiz || quiz.answered) return;
  const wi = quiz.queue[quiz.idx];
  quiz.answered = true;
  quiz.lastOk = (oi===wi);
  if(quiz.lastOk) quiz.correct++; else quiz.wrong.push(wi);
  quiz.opts = quiz.opts || makeOptions(wi);
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.disabled = true;
    if(Number(b.dataset.i)===oi) b.classList.add(quiz.lastOk?'correct':'wrong');
  });
  const w = WORDS[wi];
  const fb = document.getElementById('quizFb');
  fb.className = 'quiz-fb show ' + (quiz.lastOk?'ok':'bad');
  fb.innerHTML = quiz.lastOk
    ? `<b>✓ 回答正确</b>　已记入本轮成绩。`
    : `<b>✗ 再记一次</b>　本题答案将在结算页统一给出，先继续下一题。`;
  const foot = document.querySelector('.quiz-foot');
  if(foot && !foot.querySelector('[data-act="quiz-next"]')){
    foot.insertAdjacentHTML('afterbegin', `<button class="btn primary" data-act="quiz-next">${quiz.idx+1>=quiz.queue.length?'查看结果':'下一题 →'}</button>`);
  }
}

/* =========================================================
   6. 主渲染与事件
   ========================================================= */
function render(){
  loadUnit();
  renderTop(); renderSidebar();
  const unit = getUnit(), mod = getMod(), has = !!content();
  let body;
  if(!has) body = renderPlaceholder(mod);
  else if(mod.id==='vocabulary') body = renderVocabulary();
  else if(mod.id==='reading'){ body = renderReading(); }
  else if(mod.id==='chatting') body = renderChatting();
  else body = renderPride();
  document.getElementById('main').innerHTML =
    renderHead(unit, mod, has) + renderTabs() + body + renderPager();
  if(has && mod.id==='reading') startQuiz(quiz ? quiz.mode : 'meaning');
  syncTopbarH(); scrollToModuleBar();
}
function checkGaps(group){
  const ans = GAP_ANSWERS[group];
  const inputs = Array.from(document.querySelectorAll('input[data-gap]'));
  const filled = inputs.every(i=>norm(i.value)!=='');
  let right = 0;
  inputs.forEach(inp=>{
    const i = Number(inp.dataset.gap)-1;
    const ok = norm(inp.value) === norm(ans[i]);
    inp.classList.toggle('ok', ok); inp.classList.toggle('bad', !ok);
    if(ok) right++;
  });
  const fb = document.getElementById('gapFb');
  fb.className = 'fb-line show ' + (right===ans.length?'ok':'bad');
  fb.textContent = right===ans.length
    ? `✓ ${right}/${ans.length} 全部正确！继续完成下方对话理解题，全部做完后参考答案才会解锁。`
    : `答对 ${right}/${ans.length}。标红空格请再听一遍原声后修改；全部作答完成后才会显示参考答案。`;
  P(group).gaps = filled;
  saveProg(); refreshRefs(group);
}
function clearGaps(){
  document.querySelectorAll('input[data-gap]').forEach(inp=>{ inp.value=''; inp.classList.remove('ok','bad'); });
  const fb = document.getElementById('gapFb'); if(fb) fb.className='fb-line';
}
function answerQuestion(group, qi, oi, btn){
  const q = QUESTIONS[group][qi];
  const box = btn.closest('.q-item');
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok = oi===q.a;
  btn.classList.add(ok?'correct':'wrong');
  const fb = document.getElementById('qfb-'+qi);
  fb.className = 'q-fb show ' + (ok?'ok':'bad');
  fb.textContent = ok ? '✓ 正确。' : '✗ 再想想。本题答案将在「参考与解析」解锁后显示。';
  if(!P(group).q.includes(qi)){ P(group).q.push(qi); saveProg(); }
  refreshRefs(group);
}
function answerPride(qi, oi, btn){
  const q = PRIDE_QS[qi];
  const box = btn.closest('.q-item');
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok = oi===q.a;
  btn.classList.add(ok?'correct':'wrong');
  const fb = document.getElementById('prfb-'+qi);
  fb.className = 'q-fb show ' + (ok?'ok':'bad');
  fb.textContent = ok ? '✓ 正确。' : '✗ 再读一遍专题原文。本题答案将在「参考与解析」解锁后显示。';
  if(!P('pride').q.includes(qi)){ P('pride').q.push(qi); saveProg(); }
  refreshRefs('pride');
}
function answerPassage(qi, oi, btn){
  const q = READING_QS[qi];
  const box = btn.closest('.q-item');
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok = oi===q.a;
  btn.classList.add(ok?'correct':'wrong');
  const fb = document.getElementById('pqfb-'+qi);
  fb.className = 'q-fb show ' + (ok?'ok':'bad');
  fb.textContent = ok ? '✓ 正确。' : '✗ 再读一遍对应段落。本题答案将在「参考与解析」解锁后显示。';
  if(!P('reading').q.includes(qi)){ P('reading').q.push(qi); saveProg(); }
  refreshRefs('reading');
}
function syncTopbarH(){
  const tb=document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px');
}
function scrollToModuleBar(){
  const bar=document.querySelector('.module-tabs');
  if(!bar) return;
  const h=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h'))||58;
  const y=bar.getBoundingClientRect().top + window.scrollY - h - 4;
  window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
}
window.addEventListener('resize', syncTopbarH);
window.addEventListener('load', syncTopbarH);
syncTopbarH();
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act==='term') go({term:el.dataset.term});
  else if(act==='unit') go({term:el.dataset.term, unit:Number(el.dataset.unit)});
  else if(act==='module') go({module:el.dataset.module});
  else if(act==='pager-unit'){
    const units=getTerm().units, pos=units.findIndex(u=>u.no===state.unit);
    const n=units[pos+Number(el.dataset.delta)]; if(n) go({unit:n.no});
  }
  else if(act==='pager-mod'){
    const mi=MODULES.findIndex(m=>m.id===state.module);
    const m=MODULES[mi+Number(el.dataset.delta)]; if(m) go({module:m.id});
  }
  else if(act==='check-gaps') checkGaps(el.dataset.group);
  else if(act==='clear-gaps') clearGaps();
  else if(act==='answer') answerQuestion(el.dataset.group, Number(el.dataset.q), Number(el.dataset.i), el);
  else if(act==='quiz-mode') startQuiz(el.dataset.mode);
  else if(act==='quiz-restart') startQuiz(quiz ? quiz.mode : 'meaning');
  else if(act==='quiz-option') answerQuiz(Number(el.dataset.i));
  else if(act==='quiz-next'){
    if(!quiz) return;
    quiz.idx++; quiz.answered=false; quiz.opts=null; quiz.hint=false;
    if(quiz.idx>=quiz.queue.length) renderQuizResult(); else renderQuiz();
  }
  else if(act==='quiz-hint'){
    if(!quiz) return; quiz.hint=true;
    const tip=document.getElementById('ttsTip');
    if(tip) tip.textContent='提示：'+WORDS[quiz.queue[quiz.idx]].zh;
  }
  else if(act==='speak') speak(el.dataset.word);
  else if(act==='play-word') playWord(el.dataset.word, 1);
  else if(act==='play-word-slow') playWord(el.dataset.word, .75);
  else if(act==='quiz-play') playWord(quiz? WORDS[quiz.queue[quiz.idx]].w : '', 1, true);
  else if(act==='quiz-play-slow') playWord(quiz? WORDS[quiz.queue[quiz.idx]].w : '', .75, true);
  else if(act==='quiz-replay') playWord(quiz? WORDS[quiz.queue[quiz.idx]].w : '', 1, true);
  else if(act==='play-passage') playPassage();
  else if(act==='gloss') showGloss(el.dataset.key);
  else if(act==='gloss-close'){ const h=document.getElementById('glossHost'); if(h) h.innerHTML=''; }
  else if(act==='passage-answer') answerPassage(Number(el.dataset.q), Number(el.dataset.i), el);
  else if(act==='pride-answer') answerPride(Number(el.dataset.q), Number(el.dataset.i), el);
});

window.addEventListener('hashchange', ()=>{ if(parseHash()) render(); });
if(!parseHash()){ history.replaceState(null, '', '#s1-u1-vocabulary'); }
render();
</script>
