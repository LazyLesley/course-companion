<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英语第二课堂 · 活动资源｜课本阅览室</title>
<style>
:root{
  --paper:#EFE7D4; --paper-2:#F6F0E3; --paper-3:#E5DAC3;
  --ink:#2A2521; --ink-2:#5C5349; --ink-3:#8A7F71;
  --red:#A2382C; --red-soft:rgba(162,56,44,.12);
  --gold:#B08A3E; --green:#4E6B4A;
  --line:rgba(42,37,33,.16); --line-2:rgba(42,37,33,.28);
  --shadow:0 1px 2px rgba(42,37,33,.08), 0 8px 24px -14px rgba(42,37,33,.28);
  --shadow-lift:0 2px 4px rgba(42,37,33,.10), 0 16px 36px -18px rgba(42,37,33,.34);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
  background-image:radial-gradient(rgba(42,37,33,.045) 1px,transparent 1px);
  background-size:5px 5px;
}
a{color:inherit;text-decoration:none}

/* ===== 顶栏（与课本阅览室保持一致） ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(239,231,212,.94);backdrop-filter:blur(10px) saturate(1.2);border-bottom:1px solid var(--line-2)}
.topbar-in{max-width:1180px;margin:0 auto;padding:0 28px;height:62px;display:flex;align-items:center;gap:18px}
.brand{font-weight:700;font-size:17px;letter-spacing:.14em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .seal{width:27px;height:27px;border:1.6px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:12px;border-radius:3px;transform:rotate(-4deg)}
.brand small{font-family:var(--sans);font-size:10px;letter-spacing:.22em;color:var(--ink-3);display:block;margin-top:-3px}
.back{margin-left:auto;font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--red);border:1px solid var(--line-2);border-radius:2px;padding:7px 13px;background:var(--paper-2);white-space:nowrap;transition:.2s}
.back:hover{background:var(--red);color:var(--paper-2);border-color:var(--red)}

/* ===== 主体 ===== */
.wrap{max-width:1180px;margin:0 auto;padding:52px 28px 70px}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:.34em;color:var(--ink-3);margin-bottom:18px}
h1{font-size:38px;letter-spacing:.08em;margin:0 0 14px;font-weight:700;line-height:1.3}
h1 .h1-en{font-family:var(--mono);font-size:14px;font-weight:400;letter-spacing:.12em;color:var(--ink-3);margin-left:12px;vertical-align:middle}
.intro{font-family:var(--sans);font-size:14px;line-height:2;color:var(--ink-2);max-width:760px;margin:0}
.rule{height:1px;background:var(--line-2);margin:34px 0 26px;position:relative}
.rule::after{content:'';position:absolute;left:0;top:-2px;width:54px;height:4px;background:var(--red)}
.sec-title{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.sec-title span{font-family:var(--sans);font-size:11px;letter-spacing:.28em;color:var(--ink-3)}
.sec-title small{font-family:var(--mono);font-size:11px;color:var(--red)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.act{display:block;background:var(--paper-2);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s,border-color .22s;overflow:hidden}
.act:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.thumb{height:172px;background-color:var(--paper-3);background-size:cover;background-position:center;position:relative;border-bottom:1px solid var(--line)}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,20,14,0) 45%,rgba(26,20,14,.34) 100%)}
.thumb .no{position:absolute;left:16px;top:14px;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.act-body{padding:20px 22px 18px}
.act-en{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;margin-bottom:9px}
.act h2{font-size:21px;letter-spacing:.05em;margin:0 0 10px;font-weight:700}
.act p{font-family:var(--sans);font-size:12.5px;line-height:1.9;color:var(--ink-2);margin:0 0 16px;min-height:48px}
.act-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.tag{font-family:var(--sans);font-size:11px;color:var(--green);background:rgba(78,107,74,.10);padding:4px 10px;border-radius:999px;white-space:nowrap}
.open{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:var(--red);white-space:nowrap}
.act:hover .open{text-decoration:underline}
/* 站外链接：无封面时显示域名，与站内课件卡片区分 */
.thumb.ext{background:linear-gradient(135deg,var(--paper-3),#DCD0B6);display:grid;place-items:center}
.thumb.ext::after{display:none}
.site-mark{position:relative;z-index:2;font-family:var(--mono);font-size:16px;letter-spacing:.08em;color:var(--ink-2);text-align:center;padding:0 20px;word-break:break-all;line-height:1.5}
.ext-badge{position:absolute;right:14px;top:14px;z-index:2;font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;color:var(--red);background:var(--paper-2);border:1px solid var(--red);border-radius:2px;padding:3px 8px}
@media (max-width:640px){ .site-mark{font-size:14px} }

footer{max-width:1180px;margin:0 auto;padding:0 28px 46px;font-family:var(--sans);font-size:11px;color:var(--ink-3);line-height:2}

/* ===== 站内课件查看层：不离开本页、不跳站外 ===== */
.viewer{position:fixed;inset:0;z-index:999;background:var(--paper);display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer-bar{flex:0 0 46px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--paper-2);border-bottom:1px solid var(--line-2);font-family:var(--sans)}
.viewer-back{cursor:pointer;background:transparent;border:1px solid var(--line-2);border-radius:2px;padding:6px 12px;font-family:var(--sans);font-size:12px;color:var(--red);white-space:nowrap;transition:.2s}
.viewer-back:hover{background:var(--red);color:#fff;border-color:var(--red)}
.viewer-title{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-new{margin-left:auto;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.viewer-new:hover{color:var(--red)}
.viewer iframe{flex:1 1 auto;width:100%;border:0;background:#fff}

@media (max-width:640px){
  .topbar-in{padding:0 16px;height:auto;min-height:58px;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
  .wrap{padding:32px 16px 48px}
  h1{font-size:29px}
  h1 .h1-en{display:block;margin:8px 0 0}
  .grid{grid-template-columns:1fr}
  .thumb{height:150px}
  footer{padding:0 16px 36px}
  .viewer-bar{gap:8px;padding:0 12px}
  .viewer-title{font-size:12px}
  .viewer-new{font-size:10.5px}
}

/* RUNTIME_FALLBACK_V1 · 老内核提示 */
.env-tip{display:none}
html.legacy .env-tip{display:block;margin:24px 0 0;padding:13px 18px;background:#FFF4F1;border:1px solid rgba(192,69,59,.55);border-left:4px solid #C0453B;font-family:var(--sans);font-size:13px;line-height:1.9;color:#4e1a06}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="seal">阅</span>
      <span>课本阅览室<small>COURSE COMPANION</small></span>
    </div>
    <a class="back" href="../index.html">← 返回课本阅览室</a>
  </div>
</header>

<main class="wrap">
  <div class="eyebrow">EXTRACURRICULAR · SECOND CLASSROOM</div>
  <h1>英语第二课堂 <span class="h1-en">Activity Hub</span></h1>
      <p class="intro">周五晚 7:00–8:40 · 汉水楼 410。点卡片在本页内打开。站外链接见首页「外部学习资源」。</p>

  <div class="env-tip">旧内核：已切为静态阅读版；切「极速模式」可恢复互动。</div>

  <div class="rule"></div>
  <div class="sec-title"><span>活动课件 / ACTIVITIES</span><small id="count"></small></div>
  <div class="grid" id="list"></div>

</main>

<footer>英语第二课堂 · 活动资源汇总｜课本阅览室 COURSE COMPANION</footer>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <button class="viewer-back" id="viewerClose" type="button">← 返回第二课堂</button>
    <span class="viewer-title" id="viewerTitle"></span>
    <a class="viewer-new" id="viewerNew" href="#" target="_blank" rel="noopener">没显示？在新标签打开 ↗</a>
  </div>
  <iframe id="viewerFrame" src="about:blank" title="第二课堂课件"></iframe>
</div>

<script>
/* RUNTIME_FALLBACK_V1 · 与课件一致的运行环境自检 */
var IS_LEGACY = (function(){
  try {
    return !!document.documentMode || !window.CSS || !CSS.supports
        || !CSS.supports('display','grid')
        || typeof NodeList.prototype.forEach !== 'function'
        || typeof window.URLSearchParams !== 'function';
  } catch (e) { return true; }
})();
if (IS_LEGACY) { document.documentElement.className += ' legacy'; }

/* 站内课件清单 */
const ACTIVITIES = [
  {
    no:'01',
    title:'看图说话 · Look & Say',
    en:'Picture Talk · Week 10',
    desc:'13 页互动课件 · 4 组随堂测验',
    tag:'第 10 周 · 记忆锦囊',
    url:'picture-talk/index.html',
    thumb:'picture-talk/img/cover.jpg',
    external:false
  }
];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

var extCount = ACTIVITIES.filter(function(a){ return !!a.external; }).length;
document.getElementById('count').textContent = '共 ' + ACTIVITIES.length + ' 项 · 站内课件';
document.getElementById('list').innerHTML = ACTIVITIES.map(function(a,i){
  var ext = !!a.external;
  var noThumbExt = ext && !a.thumb;
  var host = ext ? String(a.url||'').replace(/^https?:\/\//i,'').replace(/^www\./i,'').split('/')[0] : '';
  var bg = a.thumb ? 'background-image:url(\'' + esc(a.thumb) + '\');' : '';
  return '<a class="act" data-i="' + i + '" href="' + esc(a.url) + '"' + (ext?' target="_blank" rel="noopener"':'') + '>'
    +   '<div class="' + (noThumbExt?'thumb ext':'thumb') + '" style="' + bg + '">'
    +     (noThumbExt ? '<span class="site-mark">' + esc(host) + '</span><span class="ext-badge">外部资源 ↗</span>' : '')
    +     '<span class="no">' + esc(a.no) + '</span></div>'
    +   '<div class="act-body">'
    +     '<div class="act-en">' + esc(a.en) + '</div>'
    +     '<h2>' + esc(a.title) + '</h2>'
    +     '<p>' + esc(a.desc) + '</p>'
    +     '<div class="act-foot"><span class="tag">' + esc(a.tag) + '</span>'
    +       '<span class="open">' + (a.external ? '访问链接 ↗' : '在本页打开 ▸') + '</span></div>'
    +   '</div>'
    + '</a>';
}).join('');

/* 站内课件：直接在本页的全屏层里打开，不跳站外、不新开标签 */
var viewer = document.getElementById('viewer');
var frame  = document.getElementById('viewerFrame');

function openViewer(a){
  var url = String(a.url || '');
  if (IS_LEGACY && url.indexOf('picture-talk/index.html') >= 0) url = 'picture-talk/compat.html';
  document.getElementById('viewerTitle').textContent = a.title;
  document.getElementById('viewerNew').href = url;
  frame.src = url;
  viewer.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('viewerClose').focus();
}
function closeViewer(){
  viewer.hidden = true;
  frame.src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !viewer.hidden) closeViewer();
});

document.getElementById('list').addEventListener('click', function(e){
  var el = e.target;
  while(el && el !== this && !(el.classList && el.classList.contains('act'))) el = el.parentNode;
  if(!el || el === this) return;
  var a = ACTIVITIES[Number(el.getAttribute('data-i'))];
  if(a && !a.external){ e.preventDefault(); openViewer(a); }
});
</script>
</body>
</html>
